<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" preserveAspectRatio="xMaxYMid slice" role="presentation" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="turf" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14532d" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#14532d" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#15803d" stop-opacity="0.5"/>
    </linearGradient>
    <pattern id="mow" width="80" height="360" patternUnits="userSpaceOnUse">
      <rect width="40" height="360" fill="#ffffff" fill-opacity="0.035"/>
    </pattern>
    <radialGradient id="glow" cx="400" cy="180" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" fill="#0a0a0a"/>
  <rect width="640" height="360" fill="url(#turf)"/>
  <rect width="640" height="360" fill="url(#mow)"/>
  <rect width="640" height="360" fill="url(#glow)"/>
  <!-- an original, schematic pitch: touchlines, halfway line, centre circle, both penalty and goal areas (no crest, no mark, no photograph) -->
  <g fill="none" stroke="#f5f1e8" stroke-opacity="0.4" stroke-width="2" stroke-linejoin="round">
    <rect x="150" y="28" width="470" height="304" rx="3"/>
    <line x1="385" y1="28" x2="385" y2="332"/>
    <circle cx="385" cy="180" r="44"/>
    <rect x="150" y="96" width="74" height="168"/>
    <rect x="150" y="136" width="25" height="88"/>
    <path d="M224 150 A44 44 0 0 1 224 210"/>
    <rect x="546" y="96" width="74" height="168"/>
    <rect x="595" y="136" width="25" height="88"/>
    <path d="M546 150 A44 44 0 0 0 546 210"/>
  </g>
  <g fill="#f5f1e8" fill-opacity="0.55">
    <circle cx="385" cy="180" r="4"/>
    <circle cx="198" cy="180" r="3"/>
    <circle cx="572" cy="180" r="3"/>
  </g>
</svg>
