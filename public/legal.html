    --primary-ink: #0a0a0a;

    --bad: #f87171;

  * { box-sizing: border-box; }

    font-family: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

  a { color: inherit; text-decoration: none; }
  [hidden] { display: none !important; }

    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 16px;
    max-width: 720px; margin: 0 auto; padding: 20px 20px 0;
  }
  .brand { display: inline-flex; align-items: center; gap: 10px; min-width: 0; }
  .brand-link { display: inline-flex; align-items: center; gap: 10px; border-radius: 6px; }
  .brand-mark-wrap { position: relative; display: inline-flex; width: 24px; height: 26px; flex-shrink: 0; }
  .brand-mark-wrap::before {
    content: ""; position: absolute; inset: -9px;
    background: radial-gradient(circle, var(--exp-purple-glow) 0%, transparent 70%);
    filter: blur(4px); z-index: 0;
  }
  .brand-mark { position: relative; z-index: 1; width: 24px; height: 26px; display: block; }
  .brand-word { font-size: 17px; font-weight: 700; color: var(--ink); letter-spacing: 0.02em; }
  .brand-badge {
    background: var(--exp-purple-bg); border: 1px solid var(--exp-purple);
    color: var(--exp-purple); font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; padding: 3px 8px; border-radius: 999px;
  }
  .header-tools { display: flex; align-items: center; gap: 12px; margin-left: auto; min-width: 0; max-width: 100%; }
  .lang-switch { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; flex-shrink: 0; }
  .lang-switch button {
    font-family: inherit; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: var(--muted);
    background: transparent; border: none; padding: 9px 12px; min-height: 44px; min-width: 44px; cursor: pointer;
  }
  .lang-switch button[aria-pressed="true"] { color: var(--primary-ink); background: var(--primary-fill); }
  .account-group { display: flex; align-items: center; gap: 8px; min-width: 0; justify-content: flex-end; position: relative; }
  .account-group .signin-btn { flex: 0 1 auto; min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .account-group [data-urbano-signout] { flex: none; white-space: nowrap; padding: 12px 4px; color: var(--muted); }
  a.signin-btn { display: inline-block; text-align: center; }
  .signin-btn {
    font-family: inherit; font-size: 13px; font-weight: 600; padding: 9px 16px;
    border-radius: 8px; border: 1px solid var(--ink); background: transparent;
    color: var(--ink); cursor: pointer;
  }
  .signin-btn:hover { background: var(--surface-2); }
  .signin-status {
    display: none; max-width: 720px; margin: 10px auto 0; padding: 10px 20px 0;
    font-size: 12.5px; color: var(--muted); line-height: 1.5;
  }

  .primary-nav {
    display: flex; gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch;
    max-width: 720px; margin: 16px auto 0; padding: 0 20px 2px;
  }
  .primary-nav::-webkit-scrollbar { display: none; }
  .nav-link {
    flex: 0 0 auto; font-size: 13px; font-weight: 600; color: var(--muted);
    padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line);
    white-space: nowrap;
  }

  .content { max-width: 720px; margin: 20px auto 0; padding: 0 20px; }
  .legal-title { font-size: 24px; font-weight: 800; margin: 0 0 16px; }
  .card {
    border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2);
    padding: 20px; margin: 0 0 18px;
  }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 14px; font-weight: 700; }
  .msg { font-size: 13px; color: var(--muted); margin: 0 0 12px; line-height: 1.5; }
  .empty-state { text-align: center; color: var(--muted); padding: 40px 20px; }
  .btn-primary {
    font-family: inherit; font-size: 14px; font-weight: 700; padding: 13px 18px;
    border-radius: 10px; border: none; background: var(--primary-fill); color: var(--primary-ink);
    cursor: pointer; min-height: 46px;
  }

  .legal-groups { display: grid; gap: 14px; }
  .legal-group h3 { font-size: 15px; font-weight: 800; margin: 0 0 6px; }
  .legal-versions { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .legal-versions a { display: inline-block; font-size: 14px; font-weight: 600; text-decoration: underline; padding: 10px 0; min-height: 44px; overflow-wrap: anywhere; }
  .legal-tag { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; margin-left: 8px; }
  .legal-tag.good { color: var(--good); border-color: var(--good); }

  .legal-doc { line-height: 1.65; }
  .legal-doc h2 { font-size: 18px; text-transform: none; letter-spacing: 0; color: var(--ink); margin: 22px 0 8px; font-weight: 800; }
  .legal-doc h1 { font-size: 22px; font-weight: 800; margin: 0 0 6px; text-wrap: balance; overflow-wrap: anywhere; }
  .legal-doc p, .legal-doc li { font-size: 14.5px; margin: 0 0 10px; overflow-wrap: anywhere; }
  .legal-doc ul { padding-left: 20px; margin: 0 0 12px; }
  .legal-meta { font-size: 12.5px; color: var(--muted); margin: 0 0 14px; overflow-wrap: anywhere; }
  .legal-meta code { font-size: 11.5px; word-break: break-all; }
  .table-wrap { overflow-x: auto; margin: 0 0 14px; border: 1px solid var(--line); border-radius: 10px; }
  .legal-doc table { border-collapse: collapse; width: 100%; min-width: 360px; font-size: 13.5px; }
  .legal-doc th, .legal-doc td { text-align: left; vertical-align: top; padding: 9px 12px; border-bottom: 1px solid var(--line); }
  .legal-doc th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
  .legal-back { display: inline-block; font-size: 14px; font-weight: 700; text-decoration: underline; padding: 10px 0; min-height: 44px; }
  .legal-mine { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .legal-mine li { font-size: 13.5px; line-height: 1.55; overflow-wrap: anywhere; }

  footer {
    max-width: 720px; margin: 48px auto 0; padding: 20px; text-align: center;
    color: var(--muted); font-size: 12px; border-top: 1px solid var(--line);
  }
  footer p { margin: 0 0 6px; }
  footer a { color: var(--ink); text-decoration: underline; padding: 8px 2px; }

  .brand-link:focus-visible, .brand-badge:focus-visible, .nav-link:focus-visible, .lang-switch button:focus-visible,
  .signin-btn:focus-visible, .account-group [data-urbano-signout]:focus-visible, .btn-primary:focus-visible,
  .legal-versions a:focus-visible, .legal-back:focus-visible, footer a:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  .legal-doc:focus { outline: none; }

    .shell-header { padding: 16px 16px 0; }
    .header-tools { display: contents; }
    .lang-switch { margin-left: auto; }
    .account-group { flex: 1 1 100%; }
    .brand-word { font-size: 15px; }
    .signin-btn { font-size: 12px; padding: 9px 12px; white-space: nowrap; }
    .primary-nav { padding: 0 16px 2px; }
    .content { padding-left: 16px; padding-right: 16px; }
  }

const DOC_NAME_KEYS = { ACCOUNT_TERMS: "legalpage.doc.ACCOUNT_TERMS", PRIVACY_NOTICE: "legalpage.doc.PRIVACY_NOTICE", EVENT_RULES: "legalpage.doc.EVENT_RULES" };
const DOC_ORDER = ["ACCOUNT_TERMS", "PRIVACY_NOTICE", "EVENT_RULES"];

// Sets a node's text from the language table and remembers the key so a change of language re-translates it in place.
function setText(node, key, vars) {
  node.setAttribute("data-i18n", key);
  if (vars) node.setAttribute("data-i18n-vars", JSON.stringify(vars));
  node.textContent = t(key, vars);
  return node;
}
function make(tag, className, key) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (key) setText(node, key);
  return node;
}
function plain(tag, text, className) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  node.textContent = text; // always text: a document can never carry markup onto this page
  return node;
}

// An instant with its time zone written out (the device's own); the language of month names follows the page. Redrawn on a change of language.
function formatInstant(iso) {
  try {
    return new Intl.DateTimeFormat(UrbanoI18n.locale(), { year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit", timeZoneName: "short" }).format(new Date(iso));
  } catch (err) {
    return new Date(iso).toLocaleString(UrbanoI18n.locale());
  }
}
function setTimeText(node, key, iso) {
  node.removeAttribute("data-i18n");
  node.removeAttribute("data-i18n-vars");
  node.setAttribute("data-time-key", key);
  node.setAttribute("data-time-iso", iso);
  node.textContent = t(key, { time: formatInstant(iso) });
  return node;
}
function renderTimeNodes(scope) {
  for (const node of scope.querySelectorAll("[data-time-key]")) {
    node.textContent = t(node.getAttribute("data-time-key"), { time: formatInstant(node.getAttribute("data-time-iso")) });
  }
}
UrbanoI18n.onChange(() => renderTimeNodes(document));

async function authedFetch(path) {
  const token = await UrbanoAuth.getAccessToken();
  const headers = {};
  if (token) headers.authorization = "Bearer " + token;
  const res = await fetch(path, { headers });
  const json = await res.json().catch(() => null);
  return { status: res.status, json, signedIn: !!token };
}

const params = new URLSearchParams(window.location.search);
const wantedDoc = params.get("doc");
const wantedVersion = params.get("version");
const wantedKickoff = params.get("kickoffAt");

function docUrl(entry) {
  let url = "/legal.html?doc=" + encodeURIComponent(entry.key) + "&version=" + encodeURIComponent(entry.version);
  if (entry.scope && entry.scope.kind === "EVENT") url += "&kickoffAt=" + encodeURIComponent(entry.scope.kickoffAt);
  return url;
}

function renderList(documents) {
  listHost.replaceChildren();
  if (!documents.length) {
    listHost.appendChild(messageNode("legalpage.none"));
    return;
  }
  const card = make("div", "card");
  card.appendChild(make("h2", null, "legalpage.listTitle"));
  const groups = make("div", "legal-groups");
  for (const key of DOC_ORDER) {
    const entries = documents.filter((d) => d.key === key);
    if (!entries.length) continue;
    const group = make("div", "legal-group");
    group.appendChild(make("h3", null, DOC_NAME_KEYS[key]));
    const ul = make("ul", "legal-versions");
    // the current version first, then the older ones: an older text stays readable
    entries.sort((a, b) => Number(b.current) - Number(a.current));
    for (const entry of entries) {
      const li = document.createElement("li");
      const link = document.createElement("a");
      link.href = docUrl(entry);
      link.appendChild(setText(document.createElement("span"), "legalpage.version", { version: entry.version }));
      li.appendChild(link);
      const tag = make("span", entry.current ? "legal-tag good" : "legal-tag", entry.current ? "legalpage.current" : "legalpage.old");
      li.appendChild(tag);
      if (entry.scope && entry.scope.kind === "EVENT") {
        const when = document.createElement("span");
        when.className = "msg";
        when.style.marginLeft = "8px";
        setTimeText(when, "legalpage.event", entry.scope.kickoffAt);
        li.appendChild(when);
      }
      ul.appendChild(li);
    }
    group.appendChild(ul);
    groups.appendChild(group);
  }
  card.appendChild(groups);
  listHost.appendChild(card);
}

function messageNode(key, buttonKey, onClick) {
  const wrap = make("div", "card");
  wrap.appendChild(make("p", "msg", key));
  if (buttonKey) {
    const button = make("button", "btn-primary", buttonKey);
    button.type = "button";
    button.addEventListener("click", onClick);
    wrap.appendChild(button);
  }
  return wrap;
}

// A document is a list of typed blocks, put on the page as text.
function renderBlocks(host, blocks) {
  for (const block of blocks) {
    if (block.kind === "heading") host.appendChild(plain("h2", block.text));
    else if (block.kind === "paragraph") host.appendChild(plain("p", block.text));
    else if (block.kind === "list") {
      const ul = document.createElement("ul");
      for (const item of block.items) ul.appendChild(plain("li", item));
      host.appendChild(ul);
    } else if (block.kind === "table") {
      const wrap = document.createElement("div");
      wrap.className = "table-wrap";
      const table = document.createElement("table");
      const head = document.createElement("thead");
      const headRow = document.createElement("tr");
      for (const cell of block.header) {
        const th = plain("th", cell);
        th.scope = "col";
        headRow.appendChild(th);
      }
      head.appendChild(headRow);
      const body = document.createElement("tbody");
      for (const row of block.rows) {
        const tr = document.createElement("tr");
        for (const cell of row) tr.appendChild(plain("td", cell));
        body.appendChild(tr);
      }
      table.append(head, body);
      wrap.appendChild(table);
      host.appendChild(wrap);
    }
  }
}

async function showDocument() {
  const query = new URLSearchParams();
  if (wantedVersion) query.set("version", wantedVersion);
  if (wantedKickoff) query.set("kickoffAt", wantedKickoff);
  const url = "/api/gaming/legal/documents/" + encodeURIComponent(wantedDoc) + (query.toString() ? "?" + query.toString() : "");
  const result = await authedFetch(url);
  docHost.hidden = false;
  docHost.replaceChildren();
  if (result.status !== 200 || !result.json || !result.json.document) {
    docHost.appendChild(make("p", "msg", "legalpage.notFound"));
  } else {
    const doc = result.json.document;
    docHost.appendChild(plain("h1", doc.title));
    const meta = document.createElement("p");
    meta.className = "legal-meta";
    meta.appendChild(setText(document.createElement("span"), "legalpage.version", { version: doc.version }));
    meta.appendChild(document.createTextNode(" · "));
    meta.appendChild(make("span", null, doc.current ? "legalpage.current" : "legalpage.old"));
    meta.appendChild(document.createTextNode(" · SHA-256 "));
    meta.appendChild(plain("code", doc.sha256));
    docHost.appendChild(meta);
    renderBlocks(docHost, doc.blocks);
  }
  const back = make("a", "legal-back", "legalpage.back");
  back.href = "/legal.html";
  docHost.appendChild(back);
  docHost.focus();
}

async function showMine() {
  const result = await authedFetch("/api/gaming/legal/acceptances");
  mineHost.hidden = false;
  mineHost.replaceChildren();
  const title = make("h2", null, "legalpage.mine.title");
  title.id = "legal-mine-title";
  mineHost.appendChild(title);
  if (!result.signedIn || result.status === 401) {
    mineHost.appendChild(make("p", "msg", "legalpage.mine.signin"));
    return;
  }
  const rows = result.status === 200 && result.json && Array.isArray(result.json.acceptances) ? result.json.acceptances : null;
  if (rows === null) {
    mineHost.appendChild(make("p", "msg", "legalpage.loadFailed"));
    return;
  }
  if (rows.length === 0) {
    mineHost.appendChild(make("p", "msg", "legalpage.mine.empty"));
    return;
  }
  const ul = make("ul", "legal-mine");
  for (const row of rows) {
    const li = document.createElement("li");
    li.appendChild(make("strong", null, DOC_NAME_KEYS[row.documentKey] || "legalpage.doc.ACCOUNT_TERMS"));
    li.appendChild(document.createTextNode(" — "));
    li.appendChild(setText(document.createElement("span"), "legalpage.version", { version: row.documentVersion }));
    li.appendChild(document.createTextNode(" — "));
    li.appendChild(setTimeText(document.createElement("span"), row.actType === "READ_ACKNOWLEDGMENT" ? "legalpage.mine.read" : "legalpage.mine.accepted", row.acceptedAt));
    ul.appendChild(li);
  }
  mineHost.appendChild(ul);
}

async function load() {
  try {
    const list = await fetch("/api/gaming/legal/documents", { headers: {} });
    const json = await list.json();
    if (!list.ok || !json || !Array.isArray(json.documents)) throw new Error("list");
    renderList(json.documents);
  } catch (err) {
    listHost.replaceChildren(messageNode("legalpage.loadFailed", "legalpage.retry", () => load()));
  }
  if (wantedDoc) await showDocument();
  await showMine();
}
load();
</script>
