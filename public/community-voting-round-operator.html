<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>Estación del concurso — URBANO Gaming</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /*
   * Halloween Community Voting, the four-category contest — the operator's station. Mobile- and tablet-first, on the same identity tokens as the rest
   * of the shell. Everything shown comes from the server as plain text and is placed with textContent; this page never builds markup from data.
   * The station is for the person standing in front of the operator; the setup of the contest lives in its own tab, away from it.
   */
  :root {
    --bg-page: #0a0a0a; --bg-card: #161616; --surface-2: #1c1c1c; --ink: #f5f1e8; --muted: #a8a295; --line: #2a2a2a;
    --halloween: #ff7a1a; --halloween-bg: rgba(255, 122, 26, 0.12); --purple: #7c3aed; --good: #4ade80; --bad: #f87171; --warn: #fbbf24; --radius: 14px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { font-family: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-page); color: var(--ink); margin: 0; padding: 0 0 calc(32px + env(safe-area-inset-bottom)); }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  input[type="text"], input[type="email"], input[type="search"], input[type="date"], input[type="time"], textarea, select { font: inherit; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; width: 100%; font-size: 16px; min-height: 44px; }
  .top { display: flex; align-items: center; gap: 10px; padding: 12px 16px; max-width: 880px; margin: 0 auto; flex-wrap: wrap; }
  .top img { width: 24px; height: 26px; }
  .top h1 { font-size: 15px; font-weight: 800; margin: 0; flex: 1; min-width: 140px; }
  .who { font-size: 12px; color: var(--muted); max-width: 46%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .clockchip { background: var(--halloween-bg); border: 1px solid rgba(255, 122, 26, 0.5); border-radius: 999px; padding: 4px 12px; font-weight: 800; font-size: 13px; }
  nav.tabs { display: flex; gap: 6px; max-width: 880px; margin: 0 auto; padding: 0 16px 10px; }
  nav.tabs button { flex: 1; padding: 10px 4px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); font-size: 13px; font-weight: 700; min-height: 44px; }
  nav.tabs button[aria-selected="true"] { background: var(--halloween-bg); border-color: var(--halloween); color: var(--halloween); }
  main { max-width: 880px; margin: 0 auto; padding: 0 16px; }
  .card { background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
  .card h2 { font-size: 17px; margin: 0 0 6px; }
  .card h3 { font-size: 15px; margin: 0 0 4px; }
  .card p { margin: 6px 0; font-size: 14px; line-height: 1.5; color: var(--muted); }
  .stack > * + * { margin-top: 10px; }
  .row { display: flex; gap: 10px; align-items: center; }
  .row > * { flex: 1; }
  .btn { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-weight: 700; font-size: 14px; min-height: 44px; }
  .btn.primary { background: var(--halloween); color: #1a0d00; border-color: var(--halloween); }
  .btn.danger { border-color: rgba(248, 113, 113, 0.5); color: #fecaca; }
  .btn.link { background: none; border: none; color: var(--muted); text-decoration: underline; font-weight: 600; }
  .btn.small { padding: 8px 12px; min-height: 44px; font-size: 13px; }
  .btn.block { display: block; width: 100%; text-align: center; }
  .btnrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .btnrow .btn { flex: 1 1 150px; }
  .msg { font-size: 14px; line-height: 1.45; padding: 10px 12px; border-radius: 10px; margin-bottom: 10px; }
  .msg.err { background: rgba(248, 113, 113, 0.12); border: 1px solid rgba(248, 113, 113, 0.4); color: #fecaca; }
  .msg.ok { background: rgba(74, 222, 128, 0.12); border: 1px solid rgba(74, 222, 128, 0.4); color: #bbf7d0; }
  .msg.warn { background: rgba(251, 191, 36, 0.12); border: 1px solid rgba(251, 191, 36, 0.4); color: #fde68a; }
  .strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin-bottom: 14px; }
  .mini { background: var(--bg-card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .mini b { display: block; font-size: 13px; }
  .mini span { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
  .mini.open { border-color: rgba(255, 122, 26, 0.6); }
  .mini.done { border-color: rgba(74, 222, 128, 0.5); }
  .chip { display: inline-block; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 700; background: var(--surface-2); border: 1px solid var(--line); margin: 0 6px 6px 0; }
  .chip.good { color: var(--good); border-color: rgba(74, 222, 128, 0.5); }
  .chip.warn { color: var(--warn); border-color: rgba(251, 191, 36, 0.5); }
  .chip.bad { color: var(--bad); border-color: rgba(248, 113, 113, 0.5); }
  .codechip { display: inline-block; font-weight: 800; letter-spacing: 0.1em; font-size: 20px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; }
  .claimcode { font-size: 30px; font-weight: 800; letter-spacing: 0.1em; text-align: center; padding: 14px; background: var(--surface-2); border-radius: 12px; }
  .searchbox { display: flex; gap: 8px; }
  .searchbox input { flex: 1; min-width: 0; }
  .steps { list-style: none; margin: 10px 0; padding: 0; display: grid; gap: 6px; }
  .steps li { display: flex; gap: 8px; align-items: center; font-size: 14px; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); color: var(--muted); }
  .steps li.done { color: var(--good); }
  .steps li.current { color: var(--ink); background: var(--halloween-bg); border: 1px solid rgba(255, 122, 26, 0.5); font-weight: 700; }
  .action { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-top: 10px; background: var(--surface-2); }
  .action > * + * { margin-top: 8px; }
  .check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.45; }
  .check input { margin-top: 3px; width: 22px; height: 22px; flex: 0 0 auto; accent-color: var(--halloween); }
  .ficha { display: grid; grid-template-columns: 1fr; gap: 12px; }
  .ficha img.preview { width: 100%; max-height: 46vh; object-fit: contain; background: #000; border-radius: 12px; }
  .list-row { display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 10px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .list-row:first-of-type { border-top: 0; }
  .list-row .grow { flex: 1 1 200px; min-width: 0; }
  .list-row .grow b { display: block; font-size: 14px; word-break: break-word; }
  .list-row .grow span { font-size: 12px; color: var(--muted); }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
  details.cfg { background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius); padding: 4px 16px; margin-bottom: 14px; }
  details.cfg summary { cursor: pointer; font-weight: 700; font-size: 15px; min-height: 48px; display: flex; align-items: center; }
  details.cfg summary::before { content: "▸"; margin-right: 8px; }
  details.cfg[open] summary::before { content: "▾"; }
  details.cfg[open] summary { margin-bottom: 8px; }
  .modal-back { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.78); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
  .modal { background: var(--bg-card); border: 1px solid var(--line); border-radius: 18px 18px 0 0; width: 100%; max-width: 560px; max-height: min(94vh, calc(100dvh - 8px)); display: flex; flex-direction: column; overflow: hidden; }
  .modal-body { overflow: auto; padding: 14px 16px 8px; flex: 1 1 auto; min-height: 0; }
  .modal-body > * + * { margin-top: 8px; }
  .modal-actions { flex: 0 0 auto; padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--bg-card); }
  .modal h2 { font-size: 17px; margin: 0; }
  .modal p { margin: 0; font-size: 14px; line-height: 1.45; color: var(--muted); }
  .sub { color: var(--muted); font-size: 12px; }
  .hidden { display: none !important; }
  @media (min-width: 560px) { .modal-back { align-items: center; } .modal { border-radius: 18px; } .ficha { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<header class="top">
  <img src="/urbano-mark.svg" alt="" width="24" height="26" />
  <h1>Estación del concurso</h1>
  <div class="clockchip" id="clockChip" role="timer" aria-label="Hora de Honduras"></div>
  <div class="who" id="who"></div>
</header>
<nav class="tabs hidden" id="tabs" role="tablist" aria-label="Secciones">
  <button role="tab" data-tab="station" id="tabStation">Estación</button>
  <button role="tab" data-tab="tracking" id="tabTracking">Seguimiento</button>
  <button role="tab" data-tab="results" id="tabResults">Resultados</button>
  <button role="tab" data-tab="config" id="tabConfig">Configuración</button>
</nav>
<main id="main"><div id="app" aria-busy="true" aria-live="polite"><div class="card" role="status"><h2>Cargando…</h2></div></div></main>
<div id="modalRoot"></div>

<script src="/urbanoAuth.js"></script>
<script src="/communityVotingRound.js"></script>
<script src="/communityVotingRoundOperator.js"></script>
<script>
(() => {
  "use strict";
  const Op = CommunityVotingOperator;
  const R = CommunityVotingRound;
  const KEYS = Op.CATEGORY_KEYS;
  const NAMES = { MOST_ELABORATE: "Disfraz más elaborado", SEXIEST: "Disfraz más sexy", BEST_GROUP: "Mejor disfraz en grupo", FUNNIEST: "Disfraz más chistoso" };
  const PROMPTS = {
    MOST_ELABORATE: "Elegí el disfraz más elaborado. Podés cambiar tu voto hasta que cierre la votación.",
    SEXIEST: "Elegí el disfraz más sexy. Podés cambiar tu voto hasta que cierre la votación.",
    BEST_GROUP: "Elegí el mejor disfraz en grupo. Podés cambiar tu voto hasta que cierre la votación.",
    FUNNIEST: "Elegí el disfraz más chistoso. Podés cambiar tu voto hasta que cierre la votación.",
  };
  const app = document.getElementById("app");
  const who = document.getElementById("who");
  const tabsEl = document.getElementById("tabs");
  const modalRoot = document.getElementById("modalRoot");
  const clockChip = document.getElementById("clockChip");
  const store = (() => { try { return window.localStorage; } catch (e) { return { getItem: () => null, setItem: () => {}, removeItem: () => {} }; } })();
  const fetchImpl = (...a) => window.fetch(...a);
  const token = () => UrbanoAuth.getAccessToken();

  const state = {
    auth: { status: "unauthenticated", email: "" }, authStep: "email", email: "", code: "", name: "",
    keys: Op.parseKeys(store.getItem(Op.STORE_KEY)), publicInfo: null, overviews: {}, loadedOnce: false,
    tab: "station", search: "", found: null, work: null, previews: {}, claims: {}, memberClaims: {}, delivery: null,
    form: { ...Op.EVENT_PLAN, confirmed: false }, setupLog: [],
    busy: false, error: null, notice: null, serverNow: null, fetchedAt: 0,
  };

  // ---- tiny DOM builder: text only, never markup from data
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === undefined || v === null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k === "value") el.value = v;
      else if (k === "checked") el.checked = !!v;
      else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
      else if (v === true) el.setAttribute(k, "");
      else el.setAttribute(k, String(v));
    }
    for (const kid of kids.flat()) {
      if (kid === null || kid === undefined || kid === false) continue;
      el.appendChild(typeof kid === "string" ? document.createTextNode(kid) : kid);
    }
    return el;
  }
  const say = (code) => Op.describeError(code);
  const step = () => R.identityStep(state.auth.status);
  const saveKeys = () => { try { if (state.keys) store.setItem(Op.STORE_KEY, JSON.stringify(state.keys)); } catch (e) { /* the backup file is the other copy */ } };
  const apiFor = (key) => {
    const c = state.keys && state.keys.categories[key];
    return c ? Op.buildOperatorApi(fetchImpl, token, () => c.hostToken, c.instanceId) : null;
  };
  const anyKey = () => (state.keys ? KEYS.find((k) => state.keys.categories[k]) : null);
  const overviewOf = (key) => state.overviews[key] || null;
  const entryOf = (key, entryId) => ((overviewOf(key) || {}).entries || []).find((e) => e.entryId === entryId) || null;
  const keyOfInstance = (instanceId) => KEYS.find((k) => state.keys && state.keys.categories[k] && state.keys.categories[k].instanceId === instanceId) || null;
  const fail = (r) => {
    const code = r && r.json && r.json.code;
    state.error = say(code);
    if (code === "AUTHENTICATION_REQUIRED") state.auth = { status: "unauthenticated", email: state.auth.email };
  };

  function confirmModal(title, body, confirmLabel, onConfirm, danger) {
    const close = () => { modalRoot.textContent = ""; };
    modalRoot.textContent = "";
    modalRoot.appendChild(h("div", { class: "modal-back", onclick: (e) => { if (e.target.classList.contains("modal-back")) close(); } },
      h("div", { class: "modal", role: "dialog", "aria-modal": "true", "aria-label": title },
        h("div", { class: "modal-body" }, h("h2", { text: title }), ...(Array.isArray(body) ? body : [body]).map((t) => h("p", { text: t }))),
        h("div", { class: "modal-actions row" },
          h("button", { class: "btn", id: "modalCancel", text: "Cancelar", onclick: close }),
          h("button", { class: `btn ${danger ? "danger" : "primary"}`, id: "modalConfirm", text: confirmLabel, onclick: () => { close(); onConfirm(); } })))));
  }

  // ---- reading the whole contest -----------------------------------------------------------------------------------------------

  async function refreshAll() {
    if (!state.keys) return;
    const keys = KEYS.filter((k) => state.keys.categories[k]);
    const results = await Promise.all(keys.map((k) => apiFor(k).overview()));
    let denied = null;
    results.forEach((r, i) => {
      if (r.status === 200) state.overviews[keys[i]] = r.json;
      else if (!denied && r.status !== 0) denied = r;
    });
    if (state.keys.contestId) {
      const info = await Op.buildSetupApi(fetchImpl, token).contest(state.keys.contestId);
      if (info.status === 200) { state.publicInfo = info.json; state.serverNow = info.json.serverNow; state.fetchedAt = performance.now(); }
    }
    state.loadedOnce = true;
    if (denied) fail(denied);
    else if (state.error && /conexión/.test(state.error)) state.error = null;
  }

  let refreshing = false;
  async function refreshAndRender() {
    if (refreshing) return;
    refreshing = true;
    try { await refreshAll(); } finally { refreshing = false; }
    render();
  }
  setInterval(() => { if (!document.hidden && step() === "READY" && state.keys && !state.busy && !busyEditing()) refreshAndRender(); }, 12000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && state.keys) refreshAndRender(); });
  /** A background refresh never rebuilds the page under a hand that is typing. */
  function busyEditing() {
    const a = document.activeElement;
    return !!(a && a !== document.body && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && app.contains(a) && a.type !== "checkbox" && a.type !== "file");
  }

  function tickClock() {
    const now = state.serverNow ? new Date(Date.parse(state.serverNow) + (performance.now() - state.fetchedAt)).toISOString() : new Date().toISOString();
    clockChip.textContent = `${R.formatEventTime(now)} · Honduras`;
  }
  setInterval(tickClock, 15000);

  // ---- identity ------------------------------------------------------------------------------------------------------------------

  async function refreshAuth() {
    try { const s = await UrbanoAuth.getState(); state.auth = { status: (s && s.status) || "unauthenticated", email: (s && s.email) || "" }; }
    catch (e) { state.auth = { status: "unauthenticated", email: "" }; }
  }
  async function afterIdentity() {
    await refreshAuth();
    if (step() === "READY") await refreshAll();
    render();
  }

  function renderSignIn() {
    const email = h("input", { type: "email", id: "email", autocomplete: "email", inputmode: "email", placeholder: "correo@ejemplo.com", "aria-label": "Correo electrónico", value: state.email });
    const code = h("input", { type: "text", id: "authCode", inputmode: "numeric", autocomplete: "one-time-code", placeholder: "Código del correo", "aria-label": "Código del correo", maxlength: "10", value: state.code });
    const s = step();
    if (s === "PROFILE") {
      const name = h("input", { type: "text", id: "displayName", maxlength: "40", placeholder: "Tu nombre", "aria-label": "Tu nombre", value: state.name });
      return h("section", { class: "card stack", id: "stepProfile" }, h("h2", { text: "Completá tu perfil" }), h("p", { text: R.PROFILE_NOTICE }), name,
        h("button", { class: "btn primary", id: "saveProfile", disabled: state.busy, text: "Guardar y continuar", onclick: async () => {
          state.busy = true; state.name = name.value; render();
          const r = await UrbanoAuth.completeProfile(name.value.trim());
          state.busy = false;
          if (r.status === "error") { state.error = "No pudimos guardar el perfil. Revisá el nombre."; render(); return; }
          await afterIdentity();
        } }));
    }
    return h("section", { class: "card stack", id: "stepIdentity" },
      h("h2", { text: "Entrá con tu correo" }), h("p", { text: "Esta página es solo para el operador del concurso." }),
      state.authStep === "email"
        ? [email, h("button", { class: "btn primary", id: "sendEmail", disabled: state.busy, text: "Enviar código al correo", onclick: async () => {
            state.busy = true; state.email = email.value.trim(); state.error = null; render();
            const r = await UrbanoAuth.requestOtp(state.email);
            state.busy = false;
            if (r.status === "sent") { state.authStep = "code"; state.notice = "Te enviamos un código."; } else state.error = say("INVALID_REQUEST");
            render();
          } })]
        : [h("p", { text: `Código enviado a ${state.email}` }), code, h("button", { class: "btn primary", id: "verifyEmail", disabled: state.busy, text: "Verificar y entrar", onclick: async () => {
            state.busy = true; state.code = code.value.trim(); state.error = null; render();
            const r = await UrbanoAuth.verifyOtp(state.email, state.code);
            state.busy = false;
            if (r.status === "error") { state.error = "El código no es correcto o ya venció."; render(); return; }
            state.authStep = "email"; state.code = ""; state.notice = null;
            await afterIdentity();
          } }), h("button", { class: "btn link", text: "Usar otro correo", onclick: () => { state.authStep = "email"; state.notice = null; render(); } })]);
  }

  // ---- the station ----------------------------------------------------------------------------------------------------------------

  function chipsFor(e) {
    const chips = [];
    if (e.withdrawn) chips.push(h("span", { class: "chip bad", text: "Retirada" }));
    else if (Op.isReady(e)) chips.push(h("span", { class: "chip good", text: "Pública" }));
    else chips.push(h("span", { class: "chip warn", text: "Sin completar" }));
    if (e.selfRegistered) chips.push(h("span", { class: "chip", text: "Inscrita en línea" }));
    if (e.deliveryStatus) chips.push(h("span", { class: `chip ${e.deliveryStatus === "DELIVERED" ? "good" : "warn"}`, text: Op.deliveryLabel(e.deliveryStatus) }));
    return chips;
  }

  function stripCards() {
    return h("div", { class: "strip", id: "strip" }, KEYS.map((k) => {
      const ov = overviewOf(k);
      const r = ov ? Op.categoryReadiness(ov) : null;
      const label = ov ? Op.categoryPhaseLabel(ov) : state.keys && state.keys.categories[k] ? "Cargando…" : "Sin crear";
      return h("div", { class: `mini${ov && ov.opened && !ov.closed ? " open" : ""}${ov && ov.published ? " done" : ""}`, "data-category": k },
        h("b", { text: NAMES[k] }), h("span", { text: label }), r ? h("span", { text: `${r.ready} lista${r.ready === 1 ? "" : "s"} · ${r.pending.length} por completar` }) : null);
    }));
  }

  async function runSearch() {
    const key = anyKey();
    const api = key ? apiFor(key) : null;
    if (!api) return;
    const code = R.normalizeCode(state.search);
    if (!code) { state.found = { valid: false }; state.error = null; render(); return; }
    state.found = { loading: true }; render();
    const r = await api.find(code);
    if (r.status !== 200) { state.found = null; fail(r); render(); return; }
    state.error = null;
    state.found = { valid: true, candidacy: r.json.candidacy };
    if (r.json.candidacy) attend(r.json.candidacy.categoryKey, r.json.candidacy.entryId);
    render();
  }

  function attend(categoryKey, entryId) {
    state.work = { categoryKey, entryId };
    state.delivery = null;
  }

  function renderSearchCard() {
    const input = h("input", { type: "search", id: "codeSearch", autocomplete: "off", autocapitalize: "characters", placeholder: "Código, por ejemplo HAL-K7M2Q", "aria-label": "Buscar un código", value: state.search });
    input.addEventListener("input", () => { state.search = input.value; });
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); state.search = input.value; runSearch(); } });
    const f = state.found;
    return h("section", { class: "card stack", id: "searchCard" },
      h("h2", { text: "Buscar código" }),
      h("p", { text: "La persona te dice o te muestra su código. Escribilo para abrir su candidatura." }),
      h("div", { class: "searchbox" }, input, h("button", { class: "btn primary", id: "searchGo", text: "Buscar", onclick: () => { state.search = input.value; runSearch(); } })),
      f && f.loading ? h("p", { role: "status", text: "Buscando…" }) : null,
      f && f.valid === false ? h("div", { class: "msg err", role: "alert", id: "searchBad", text: "Ese código no es válido. Los códigos se ven así: HAL-K7M2Q (no llevan 0, 1, I, L, O ni U)." }) : null,

  async function uploadPhoto(w, e, api, file) {
    if (state.busy) return;
    state.busy = true; state.error = null; state.notice = null; render();
    try {
      const prepared = await preparePhoto(file);
      state.previews[e.entryId] = prepared.preview;

      if (r.status !== 201) fail(r); else state.notice = "Foto subida.";

  /** Reads the picture, scales it down (never up), and encodes it as JPEG under the server's size limits. EXIF is dropped by the canvas and again by the server. */
  async function preparePhoto(file) {
    const dataUrl = await new Promise((resolve, reject) => { const fr = new FileReader(); fr.onload = () => resolve(fr.result); fr.onerror = reject; fr.readAsDataURL(file); });
    const img = await new Promise((resolve, reject) => { const i = new Image(); i.onload = () => resolve(i); i.onerror = reject; i.src = dataUrl; });
    const encode = (maxLong, maxBytes) => {
      const plan = Op.planResize(img.naturalWidth, img.naturalHeight, maxLong);
      const canvas = document.createElement("canvas");
      canvas.width = plan.width; canvas.height = plan.height;
      canvas.getContext("2d").drawImage(img, 0, 0, plan.width, plan.height);
      for (const q of [0.85, 0.75, 0.65, 0.55]) {
        const url = canvas.toDataURL("image/jpeg", q);
        const b64 = url.split(",")[1];
        if (Math.floor((b64.length * 3) / 4) <= maxBytes) return { b64, url };
      }
      const url = canvas.toDataURL("image/jpeg", 0.45);
      return { b64: url.split(",")[1], url };
    };
    const full = encode(Op.PHOTO_LIMITS.full, 1_400_000);
    const thumb = encode(Op.PHOTO_LIMITS.thumb, 140_000);
    return { full: full.b64, thumb: thumb.b64, preview: thumb.url };
  }

        h("div", { class: "grow" }, h("b", { text: Op.entryTitle(e) }), h("span", { text: e.publicCode || e.label }), h("div", null, chipsFor(e))),
        h("button", { class: "btn small", text: "Atender", onclick: () => { attend(k, e.entryId); state.tab = "station"; render(); window.scrollTo(0, 0); } }))),
      h("div", { class: "btnrow" }, actions));
  }

  function openOne(k) {
    const ov = overviewOf(k);
    const r = Op.categoryReadiness(ov);
    confirmModal(`¿Abrir «${NAMES[k]}»?`, [
      `Se abre la votación con ${r.ready} candidaturas. A partir de ese momento no se pueden inscribir más personas, cambiar fotos ni agregar candidaturas.`,
      "La votación cierra sola a la hora de cierre configurada, aunque la abras tarde.",
    ], "Abrir la votación", () => act("open", async () => {
      const api = apiFor(k);
      const lock = await lockLobby(k);
      if (!lock) return;
      const r2 = await api.open(PROMPTS[k]);
      if (r2.status !== 201) fail(r2); else state.notice = `«${NAMES[k]}» está abierta.`;
    }));
  }

  /** The Session must be locked before it can start (admission closes). It is the platform's own route, driven by the same host token. */
  async function lockLobby(k) {
    const c = state.keys.categories[k];
    const sessionId = c.sessionId || "";
    if (!sessionId) { state.error = "Falta el id de la sesión de esta categoría en las claves guardadas."; return false; }
    const r = await fetch(`/api/sessions/${sessionId}/lock`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ hostToken: c.hostToken }) }).then(async (x) => ({ status: x.status, json: await x.json().catch(() => null) })).catch(() => ({ status: 0, json: null }));
    if (r.status === 200 || r.status === 201) return true;
    if (r.status === 409) return true; // already locked
    state.error = say(r.status === 0 ? "NETWORK" : "SESSION_NOT_STARTABLE");
    return false;
  }

  function closeOne(k) {
    confirmModal(`¿Cerrar «${NAMES[k]}»?`, ["Nadie podrá votar ni cambiar su voto. Los resultados no se publican hasta que los revises."], "Cerrar la votación", () => act("close", async () => {
      const r = await apiFor(k).close();
      if (r.status !== 200 && r.status !== 201) fail(r); else state.notice = `«${NAMES[k]}» cerró.`;
    }), true);
  }

  function renderTracking() {
    const ready = KEYS.filter((k) => state.keys.categories[k] && overviewOf(k) && !overviewOf(k).opened && Op.categoryReadiness(overviewOf(k)).canOpen);
    return [
      stripCards(),
      ready.length > 1 ? h("div", { class: "card", id: "openAll" }, h("p", { text: `${ready.length} categorías están listas para abrir.` }),
        h("button", { class: "btn primary block", id: "openAllBtn", disabled: state.busy, text: "Abrir todas las que están listas", onclick: () => confirmModal("¿Abrir las categorías listas?", [`Se abren: ${ready.map((k) => NAMES[k]).join(", ")}.`, "Cada una cierra sola a su hora de cierre configurada."], "Abrir", () => act("openAll", async () => {
          for (const k of ready) {
            if (!(await lockLobby(k))) return;
            const r = await apiFor(k).open(PROMPTS[k]);
            if (r.status !== 201) { fail(r); return; }
          }
          state.notice = "Las categorías listas están abiertas.";
        })) })) : null,
      KEYS.map(renderCategoryTrack),
    ];
  }

  // ---- results ------------------------------------------------------------------------------------------------------------------------

  const resultCache = {};
  async function loadResults(k) {
    const r = await apiFor(k).results();
    if (r.status === 200) { resultCache[k] = r.json; render(); } else { fail(r); render(); }
  }

  function renderResultsFor(k) {
    const ov = overviewOf(k);
    if (!ov) return null;
    const nextStep = Op.afterCloseStep(ov);
    const rows = resultCache[k] && resultCache[k].rows ? resultCache[k].rows : null;
    const names = new Map(((ov.entries || [])).map((e) => [e.entryId, e]));
    return h("section", { class: "card stack", "data-category": k },
      h("h2", { text: NAMES[k] }),
      !ov.closed ? h("p", { text: ov.opened ? "La votación sigue abierta. Los resultados se ven cuando cierre." : "Esta categoría todavía no abrió." }) : null,
      ov.closed ? h("div", { class: "btnrow" }, h("button", { class: "btn", "data-load-results": k, text: rows ? "Actualizar resultados" : "Ver resultados", onclick: () => loadResults(k) })) : null,
      rows ? (rows.length === 0 ? h("p", { text: "Sin votos válidos: no hay ganador." }) : rows.map((row) => {
        const e = names.get(row.entryId);
        return h("div", { class: "list-row" }, h("div", { class: "grow" }, h("b", { text: e ? Op.entryTitle(e) : row.label }), h("span", { text: `${row.votes} voto${row.votes === 1 ? "" : "s"}${row.winner ? " · ganador" : ""}` })));
      })) : null,
      nextStep === "REVIEW" ? h("button", { class: "btn primary block", "data-review": k, disabled: state.busy, text: "Registrar mi revisión del resultado", onclick: () => confirmModal("¿Registrar la revisión?", ["Confirmás que revisaste el resultado de esta categoría. Después podés publicarlo."], "Registrar", () => act("review", async () => { const r = await apiFor(k).review(); if (r.status !== 201) fail(r); else state.notice = "Revisión registrada."; })) }) : null,
      nextStep === "PUBLISH" ? h("button", { class: "btn primary block", "data-publish": k, disabled: state.busy, text: "Publicar el resultado", onclick: () => confirmModal("¿Publicar el resultado?", ["Se anuncia públicamente quién ganó esta categoría. Esto no se puede deshacer."], "Publicar", () => act("publish", async () => { const r = await apiFor(k).publish(); if (r.status !== 201) fail(r); else state.notice = "Resultado publicado."; }), true) }) : null,
      nextStep === "DONE" ? h("div", { class: "msg ok", role: "status", text: "Resultado publicado." }) : null);
  }

  // ---- configuration: the contest itself (away from the station) ----------------------------------------------------------------------

  function renderConfig() {
    const f = state.form;
    const field = (id, label, type, key) => h("div", { class: "field" }, h("label", { for: id, text: label }), h("input", { type, id, value: f[key], oninput: (e) => { f[key] = e.target.value; } }));
    const created = Op.keysComplete(state.keys);
    const listed = state.publicInfo ? state.publicInfo.listed : false;
    const parts = [];
    parts.push(h("section", { class: "card stack", id: "setupCard" },
      h("h2", { text: "El concurso" }),
      created ? h("p", { id: "setupState", text: "Las cuatro categorías existen y sus claves están guardadas en este navegador." }) : h("p", { id: "setupState", text: "Todavía no están creadas las cuatro categorías." }),
      state.setupLog.length ? h("ul", { class: "sub", id: "setupLog" }, state.setupLog.map((l) => h("li", { text: l }))) : null,
      !created ? h("button", { class: "btn primary block", id: "createContest", disabled: state.busy, text: "Crear las cuatro categorías", onclick: createContest }) : null));
    if (created) {
      parts.push(h("section", { class: "card stack", id: "scheduleCard" },
        h("h2", { text: "Horarios (hora de Honduras)" }),
        h("p", { text: "Los horarios informan al público. La votación solo abre cuando vos la abrés, y cierra sola a su hora de cierre." }),
        h("div", { class: "grid2" },
          field("fDate", "Día", "date", "date"), field("fRegOpen", "Abre la inscripción", "time", "registrationOpens"), field("fRegClose", "Cierra la inscripción", "time", "registrationCloses"),
          field("fVoteOpen", "Abre la votación (prevista)", "time", "votingOpens"), field("fVoteClose", "Cierra la votación", "time", "votingCloses")),
        h("label", { class: "check", for: "fConfirmed" }, h("input", { type: "checkbox", id: "fConfirmed", checked: f.confirmed, onchange: (e) => { f.confirmed = e.target.checked; } }), h("span", { text: "El horario está confirmado (si no, se muestra como tentativo)." })),
        h("div", { class: "btnrow" },
          h("button", { class: "btn", id: "fillPlan", text: "Rellenar con el horario de Halloween", onclick: () => { state.form = { ...Op.EVENT_PLAN, confirmed: f.confirmed }; render(); } }),
          h("button", { class: "btn primary", id: "saveSchedule", disabled: state.busy, text: "Guardar en las cuatro categorías", onclick: saveSchedule }))));
      parts.push(h("section", { class: "card stack", id: "listingCard" },
        h("h2", { text: "Inicio de la app" }),
        h("p", { id: "listingState", text: listed ? "El concurso aparece en Inicio con sus enlaces." : "El concurso no aparece en Inicio todavía: Inicio solo dice lo que es cierto y no muestra enlaces." }),
        h("button", { class: `btn ${listed ? "" : "primary"} block`, id: "toggleListing", disabled: state.busy, text: listed ? "Quitar el concurso de Inicio" : "Mostrar el concurso en Inicio", onclick: () => toggleListing(!listed) })));
      parts.push(h("section", { class: "card stack", id: "linksCard" },
        h("h2", { text: "Enlaces" }),
        h("p", { class: "sub", text: "Para compartir o probar. Abrirlos no abre la votación." }),
        h("p", { id: "linkVote", text: new URL(`/community-voting-round.html?c=${state.keys.contestId}`, location.origin).toString() }),
        h("p", { id: "linkRegister", text: new URL(`/community-voting-round.html?c=${state.keys.contestId}&participar=1`, location.origin).toString() }),
        h("p", { id: "linkDisplay", text: new URL(`/community-voting-round-display.html?c=${state.keys.contestId}`, location.origin).toString() })));
    }
    parts.push(h("section", { class: "card stack", id: "backupCard" },
      h("h2", { text: "Copia de las claves" }),
      h("p", { text: "Las claves de las cuatro categorías viven solo en este navegador. Guardá una copia en un lugar seguro: sin ellas no se puede operar." }),
      h("div", { class: "btnrow" },
        created ? h("button", { class: "btn", id: "backupKeys", text: "Guardar copia", onclick: backupKeys }) : null,
        h("button", { class: "btn", id: "restoreKeys", text: "Restaurar copia", onclick: () => document.getElementById("restoreInput").click() })),
      h("input", { type: "file", id: "restoreInput", accept: "application/json,.json", class: "hidden", onchange: (e) => restoreKeys(e.target.files && e.target.files[0]) })));
    parts.push(h("button", { class: "btn link", id: "signOut", text: "Cerrar sesión", onclick: async () => { try { await UrbanoAuth.signOut(); } catch (e) { /* re-read below */ } await refreshAuth(); render(); } }));
    return parts;
  }

  async function createContest() {
    if (state.busy) return;
    state.busy = true; state.error = null; state.notice = null; state.setupLog = []; render();
    const setup = Op.buildSetupApi(fetchImpl, token);
    const keys = state.keys || { contestId: "", ownerUserId: "", categories: {} };
    try {
      for (const k of KEYS) {
        if (keys.categories[k]) { state.setupLog.push(`${NAMES[k]}: ya existía`); continue; }
        const s = await setup.createSession();
        if (s.status !== 201) { fail(s); state.setupLog.push(`${NAMES[k]}: no se pudo crear la sesión`); break; }
        const sessionId = s.json.sessionId, hostToken = s.json.hostToken;
        // the keys are kept the moment they exist, so a failure further on never loses them
        const cap = await setup.declareVoting(sessionId, hostToken);
        if (cap.status !== 200 && cap.status !== 201) { state.error = say("INTERNAL_ERROR"); state.setupLog.push(`${NAMES[k]}: no se pudo preparar la sesión`); break; }
        const reg = await setup.registerCategory(sessionId, hostToken, k, keys.contestId || null);
        if (reg.status !== 201) { fail(reg); state.setupLog.push(`${NAMES[k]}: no se pudo registrar`); break; }
        keys.contestId = reg.json.round.contestId;
        keys.categories[k] = { instanceId: reg.json.round.instanceId, sessionId, hostToken };
        state.keys = keys; saveKeys();
        state.setupLog.push(`${NAMES[k]}: creada`);
        render();
      }
    } finally { state.busy = false; }
    state.keys = keys.contestId ? keys : null;
    if (state.keys) saveKeys();
    if (Op.keysComplete(state.keys)) state.notice = "Las cuatro categorías están creadas. Ahora cargá los horarios y guardá una copia de las claves.";
    await refreshAll();
    render();
  }

  async function saveSchedule() {
    const schedule = Op.scheduleFromForm(state.form);
    if (!schedule) { state.error = say("SCHEDULE_INVALID"); render(); return; }
    state.busy = true; state.error = null; render();
    let failed = null;
    for (const k of KEYS) {
      const r = await apiFor(k).schedule(schedule);
      if (r.status !== 200 && r.status !== 201) { failed = r; break; }
    }
    state.busy = false;
    if (failed) fail(failed); else state.notice = "Horarios guardados en las cuatro categorías.";
    await refreshAll();
    render();
  }

  function toggleListing(listed) {
    const run = () => act("listing", async () => {
      const r = await apiFor(anyKey()).listing(listed);
      if (r.status !== 200) fail(r); else state.notice = listed ? "El concurso aparece en Inicio." : "El concurso salió de Inicio.";
    });
    if (listed) confirmModal("¿Mostrar el concurso en Inicio?", ["Inicio mostrará «Concurso de disfraces» con los enlaces para votar y para participar."], "Mostrar", run);
    else run();
  }

  function backupKeys() {
    const blob = new Blob([JSON.stringify(state.keys, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = h("a", { href: url, download: "concurso-disfraces-claves.json" });
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    state.notice = "Copia guardada. Guardala en un lugar seguro: contiene las claves del concurso."; render();
  }
  async function restoreKeys(file) {
    if (!file) return;
    const parsed = Op.parseKeys(await file.text());
    if (!parsed) { state.error = "Ese archivo no es una copia válida de las claves."; render(); return; }
    state.keys = parsed; saveKeys(); state.notice = "Claves restauradas."; await refreshAll(); render();
  }

  // ---- shell -------------------------------------------------------------------------------------------------------------------------

  function messages() {
    return [
      state.error ? h("div", { class: "msg err", role: "alert", id: "errorMsg", text: state.error }) : null,
      state.notice ? h("div", { class: "msg ok", role: "status", id: "noticeMsg", text: state.notice }) : null,
    ];
  }

  function render() {
    app.setAttribute("aria-busy", "false");
    who.textContent = state.auth.status === "unauthenticated" ? "" : state.auth.email;
    const s = step();
    const parts = [...messages()];
    if (s !== "READY") { tabsEl.classList.add("hidden"); parts.push(renderSignIn()); }
    else if (!state.keys || (state.tab !== "config" && !Op.keysComplete(state.keys) && !anyKey())) {
      tabsEl.classList.remove("hidden");
      if (state.tab !== "config") {
        parts.push(h("section", { class: "card stack", id: "noContest" }, h("h2", { text: "Todavía no hay un concurso en este navegador" }),
          h("p", { text: "Si ya lo creaste desde otro navegador, restaurá la copia de las claves. Si no, creá las cuatro categorías." }),
          h("button", { class: "btn primary block", id: "goConfig", text: "Ir a Configuración", onclick: () => { state.tab = "config"; render(); } })));
      } else parts.push(...renderConfig());
    } else {
      tabsEl.classList.remove("hidden");
      if (state.tab === "station") parts.push(...renderStation());
      else if (state.tab === "tracking") parts.push(...renderTracking());
      else if (state.tab === "results") parts.push(...KEYS.map(renderResultsFor));
      else parts.push(...renderConfig());
    }
    for (const b of tabsEl.querySelectorAll("button")) b.setAttribute("aria-selected", b.dataset.tab === state.tab ? "true" : "false");
    const a = document.activeElement;
    const id = a && a !== document.body && app.contains(a) ? a.id : "";
    const range = id && typeof a.selectionStart === "number" ? [a.selectionStart, a.selectionEnd] : null;
    app.textContent = "";
    for (const p of parts.flat()) if (p) app.appendChild(p);
    if (id) { const again = document.getElementById(id); if (again) { try { again.focus({ preventScroll: true }); if (range && again.setSelectionRange) again.setSelectionRange(range[0], range[1]); } catch (e) { /* a nicety */ } } }
    tickClock();
  }

  tabsEl.addEventListener("click", (e) => { const b = e.target.closest("button[data-tab]"); if (!b) return; state.tab = b.dataset.tab; state.error = null; state.notice = null; render(); window.scrollTo(0, 0); });

  (async function start() {
    await refreshAuth();
    if (step() === "READY") await refreshAll();
    render();
  })();
})();
</script>
</body>
</html>
