<!doctype html>
<html lang="es">
<head>

<title>Operador — Concurso de Disfraces (dos rondas) — URBANO Gaming</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /*
   * Halloween Community Voting, two-round pilot — the operator's tablet. Only the designated operator (a signed-in Gaming Member who also
   * holds the round's host token) can do anything here; every control calls a server route that checks both again, and the database checks
   * the member against the one recorded on the round. Text from the server is placed with textContent, never as markup. The per-contestant
   * totals exist only after a round has closed; while it is open this page shows aggregate counters and nothing else.
   */
  :root { --bg-page: #0a0a0a; --bg-card: #161616; --surface-2: #1c1c1c; --ink: #f5f1e8; --muted: #9b9689; --line: #2a2a2a; --halloween: #ff7a1a; --halloween-bg: rgba(255,122,26,.12); --good: #4ade80; --bad: #f87171; }
  * { box-sizing: border-box; }
  body { font-family: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-page); color: var(--ink); margin: 0; padding: 0 0 48px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  input, textarea, select { font: inherit; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; width: 100%; font-size: 16px; }
  .top { display: flex; align-items: center; gap: 12px; padding: 14px 20px; max-width: 980px; margin: 0 auto; }
  .top h1 { font-size: 16px; margin: 0; flex: 1; }
  main { max-width: 980px; margin: 0 auto; padding: 0 20px; }
  .card { background: var(--bg-card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  .card h2 { font-size: 16px; margin: 0 0 8px; }
  .card p { font-size: 13px; line-height: 1.5; color: var(--muted); margin: 6px 0; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  .stack > * + * { margin-top: 10px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .btn { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; font-weight: 700; font-size: 14px; min-height: 46px; }
  .btn.primary { background: var(--halloween); color: #1a0d00; border-color: var(--halloween); }
  .btn.good { background: var(--good); color: #052e16; border-color: var(--good); }
  .btn.bad { background: var(--bad); color: #450a0a; border-color: var(--bad); }
  .msg { font-size: 13px; padding: 10px 12px; border-radius: 10px; line-height: 1.45; margin-bottom: 10px; }
  .msg.err { background: rgba(248,113,113,.12); border: 1px solid rgba(248,113,113,.4); color: #fecaca; }
  .msg.ok { background: rgba(74,222,128,.12); border: 1px solid rgba(74,222,128,.4); color: #bbf7d0; }
  .msg.warn { background: var(--halloween-bg); border: 1px solid rgba(255,122,26,.4); }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; background: var(--bg-page); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; color: var(--ink); overflow-wrap: anywhere; }
  .chip { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 11px; font-weight: 800; background: var(--surface-2); }
  .chip.live { background: var(--halloween-bg); color: var(--halloween); }
  .chip.done { background: rgba(74,222,128,.14); color: var(--good); }
  .counters { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
  .counter { background: var(--surface-2); border-radius: 12px; padding: 10px; text-align: center; }
  .counter b { display: block; font-size: 22px; }
  .counter span { font-size: 11px; color: var(--muted); }
  .clock { font-size: 28px; font-weight: 800; letter-spacing: .05em; }
  .entry { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-top: 10px; background: var(--surface-2); }
  .entry header { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  .entry header .no { font-weight: 800; font-size: 18px; flex: 1; }
  .entry img.preview { width: 100%; max-height: 340px; object-fit: contain; background: #000; border-radius: 10px; }
  .code-big { font-size: 30px; font-weight: 800; letter-spacing: .12em; text-align: center; padding: 12px; background: var(--bg-card); border-radius: 10px; }
  .consent-text { background: var(--bg-card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: 14px; line-height: 1.5; }
  .check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
  .check input { width: 24px; height: 24px; flex: 0 0 24px; }
  ol.steps { list-style: none; margin: 0; padding: 0; }
  ol.steps li { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  ol.steps li .what { flex: 1; min-width: 200px; }
  ol.steps li small { display: block; color: var(--muted); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  tr.cut td { background: var(--halloween-bg); }
  .modal-back { position: fixed; inset: 0; background: rgba(0,0,0,.8); display: flex; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
  .modal { background: var(--bg-card); border: 1px solid var(--line); border-radius: 16px; width: 100%; max-width: 520px; padding: 18px; }
  .hidden { display: none !important; }
  .chip.warn { background: rgba(250,204,21,.16); color: #fde68a; }
  .chip.bad { background: rgba(248,113,113,.16); color: #fecaca; }
  /* a rehearsal says so, loudly, for as long as the page is showing it */
  #bannerSlot { position: sticky; top: 0; z-index: 6; }
  .test-banner { background: #b91c1c; color: #fff; padding: 10px 20px; font-size: 14px; font-weight: 700; line-height: 1.4; text-align: center; border-bottom: 3px solid #fecaca; }
  .test-banner strong { letter-spacing: .08em; font-weight: 800; }
  .field small { display: block; color: var(--muted); font-size: 12px; line-height: 1.4; margin-top: 4px; }
  .field small.err { color: #fecaca; }
  .geo-result { border: 1px solid var(--line); border-left-width: 6px; border-radius: 10px; padding: 12px; background: var(--surface-2); }
  .geo-result[data-tone="good"] { border-left-color: var(--good); }
  .geo-result[data-tone="bad"] { border-left-color: var(--bad); }
  .geo-result[data-tone="warn"] { border-left-color: var(--halloween); }
  .geo-result p { margin: 6px 0 0; }
  .geo-schematic-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  #geo-schematic { width: 100%; max-width: 320px; height: auto; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; }
  details.help > summary { cursor: pointer; font-size: 13px; color: var(--muted); }
  /* UG-IV-GATE-014: how fresh the data on screen is, and the unresolved policies kept off the routine path (collapsed unless one blocks something) */
  .live-status { margin: 0 0 8px; font-size: 12px; color: var(--muted); }
  .live-status[data-tone="stale"] { color: #fde68a; font-weight: 700; }
  .live-status[data-tone="refreshing"] { color: var(--halloween); }
  .counters[data-stale="true"] { opacity: .55; }
  details.card > summary { cursor: pointer; list-style: none; }
  details.card > summary::-webkit-details-marker { display: none; }
  details.card > summary h2 { display: inline; }
  details.card > summary::after { content: "  ▾"; color: var(--muted); }
  details.card[open] > summary::after { content: "  ▴"; }
</style>
</head>
<body>
<div id="bannerSlot"></div>
<header class="top">
  <img src="/urbano-mark.svg" alt="" width="24" height="26" />
  <h1>Operador · Concurso de Disfraces</h1>
  <button class="btn" id="signInButton" type="button">Iniciar sesión</button>
  <span id="signInStatus" class="chip"></span>
</header>
<main id="main"><div id="liveStatus" class="live-status" role="status" aria-live="off" hidden></div><div id="app" aria-busy="true" aria-live="polite"></div></main>
<div id="modalRoot"></div>

<script src="/urbanoAuth.js"></script>
<script src="/communityVotingRoundOperator.js"></script>
<script>
(() => {
  "use strict";
  const P = CommunityVotingRoundOperator;
  const app = document.getElementById("app");
  const modalRoot = document.getElementById("modalRoot");
  const EVENT_KEY = "cvop2:round";
  const FULL_LONG_SIDE = 1600;
  const THUMB_LONG_SIDE = 320;
  const CLAIM_TTL_SECONDS = 3600;

  const store = {
    get(k) { try { return window.sessionStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { window.sessionStorage.setItem(k, v); } catch (e) { /* ignore */ } },
    remove(k) { try { window.sessionStorage.removeItem(k); } catch (e) { /* ignore */ } },
  };
  // the schedule form, in the EVENT's own date and time (America/Tegucigalpa), never the tablet's
  const freshSchedule = () => ({ registration: { date: "", time: "" }, cutoff: { date: "", time: "" }, opens: { date: "", time: "" }, closes: { date: "", time: "" }, confirmed: false });
  const freshRegister = () => ({ sessionId: "", hostToken: "", role: "PRELIMINARY", source: "", lat: "", lon: "", radius: "", accuracy: "", inside: "1", outside: "1", test: false });
  // The final's geofence form and everything private to testing it: the typed values, the proposal taken from this device, the last test and the
  // reading it used. Held in this page's memory ONLY (never stored, never logged) and dropped with the person, the round or the result.
  const freshGeo = () => ({ form: null, baseline: null, proposal: null, result: null, reading: null, resultWasDirty: false, error: null, fieldErrors: {}, locating: false });
  const BASE_TITLE = document.title;
  const state = {
    auth: { status: "unauthenticated" },
    // Who the page is showing it for. `epoch` goes up every time the signed-in person changes or signs out; whatever was started under an
    // older epoch is dropped when it finishes (a late answer must never restore a previous person's round). `identityKey` is the
    // identity contract's own "who, and how far their account is", so a repeated notification for the same state does nothing.
    epoch: 0, identityKey: "",
    // the round this person connected to (its id and host token). Never read from storage until the person it belongs to is known.
    round: null,
    overview: null, results: null, claims: {}, previews: {}, consentChecked: {}, texts: null,
    tick: 0, fetchedAtMono: 0,
    error: null, notice: null, busy: false,
    promptText: "Elige tu disfraz favorito",
    schedule: freshSchedule(),
    policyRefs: {}, policyAcks: {}, taskNotes: {},
    register: freshRegister(),
    geo: freshGeo(),
    // GATE-014: a click that claims something (the review) is only believed once the refreshed overview agrees; where the schedule form came from; the totals' key
    claim: null, identityNote: null, scheduleBaseline: null, resultsKey: "", deferred: 0,
  };
  const mono = () => (typeof performance !== "undefined" ? performance.now() : Date.now());
  /** HH:MM in the event's zone, from an ISO instant. */
  const eventTime = (iso) => { const t = P.fromEventInstant(iso); return t ? t.time : ""; };

  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === undefined || v === null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
      else if (v === true) el.setAttribute(k, "");
      else el.setAttribute(k, String(v));
    }
    for (const kid of kids.flat()) {
      if (kid === null || kid === undefined || kid === false) continue;
      el.appendChild(typeof kid === "string" ? document.createTextNode(kid) : kid);
    }
    return el;
  }
  const say = (code) => P.describeError(code);
  // Every call is tied to the epoch it started in: if the person changed meanwhile, the answer is replaced by a marker nobody acts on.
  const STALE = Object.freeze({ status: -1, json: { code: "IDENTITY_CHANGED" }, stale: true });
  const api = () => {
    const epoch = state.epoch;
    const raw = P.buildOperatorApi((...a) => window.fetch(...a), () => UrbanoAuth.getAccessToken(), () => (state.round && state.round.hostToken) || "", state.round.instanceId);
    return new Proxy(raw, { get: (target, name) => (typeof target[name] !== "function" ? target[name] : async (...args) => { const r = await target[name](...args); return epoch === state.epoch ? r : STALE; }) });
  };
  // The round is remembered for THIS tab only and together with the person it belongs to; a different person never inherits it.
  const saveRound = () => {
    if (state.round && state.auth.authUserId) store.set(EVENT_KEY, JSON.stringify({ instanceId: state.round.instanceId, hostToken: state.round.hostToken, ownerUserId: state.auth.authUserId }));
    else store.remove(EVENT_KEY);
  };
  const UUID_LIKE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
  /** The stored connection, or null when there is none or it is malformed, incomplete or in an older format: nothing is guessed from such a value. */
  function readStoredRound() {
    let stored = null;
    try { stored = JSON.parse(store.get(EVENT_KEY) || "null"); } catch (e) { stored = null; }
    if (!stored || typeof stored !== "object" || Array.isArray(stored)) return null;
    if (typeof stored.instanceId !== "string" || !UUID_LIKE.test(stored.instanceId)) return null;
    if (typeof stored.hostToken !== "string" || stored.hostToken.trim() === "") return null;
    if (typeof stored.ownerUserId !== "string" || stored.ownerUserId === "") return null;
    return stored;
  }
  /**
   * Restores ONLY the connection of the person who is signed in now. A connection that is not valid is removed; another person's is removed on
   * the spot and never used; one that cannot be judged yet (the person is not resolved: a failed lookup, a profile gap, no session) is left in
   * the tab for its owner — and used for nobody until the owner is resolved.
   */
  function loadStoredRound(auth) {
    const stored = readStoredRound();
    if (!stored) { store.remove(EVENT_KEY); return null; }
    const known = auth && typeof auth.authUserId === "string" && auth.authUserId !== "" ? auth.authUserId : null;
    if (known && stored.ownerUserId !== known) { store.remove(EVENT_KEY); return null; }
    if (known && auth.status === "authenticated") return { instanceId: stored.instanceId, hostToken: stored.hostToken };
    return null;
  }
  const clearMessages = () => { state.error = null; state.notice = null; };
  function fail(r) {
    if (r && r.stale) return;
    state.error = r.status === 0 ? "No hay conexión con el servidor. Inténtalo de nuevo." : say(r.json && r.json.code);
    state.notice = null;
  }
  async function act(fn) {
    const epoch = state.epoch;
    state.error = null; state.notice = null; state.busy = true; render();
    try { await fn(); } finally { if (epoch === state.epoch) state.busy = false; }
    if (epoch !== state.epoch) return;
    await refresh();
    if (epoch === state.epoch) { settleClaim(); render(); }
  }

  // ---- data ------------------------------------------------------------------------------------------------------------------
  /**
   * Reads the round's authoritative state — the overview, the texts, and (once it is closed) the totals — unless the person or the round changed
   * meanwhile. It does NOT apply anything: whoever called it applies the answer if it is still wanted. `live` is the poll's lighter read.
   */
  async function readRound(opts) {
    const live = !!(opts && opts.live);
    if (!state.round || state.auth.status !== "authenticated") return { ok: false };
    const epoch = state.epoch;
    const instanceId = state.round.instanceId;
    const current = () => epoch === state.epoch && !!state.round && state.round.instanceId === instanceId;
    const [ov, info] = await Promise.all([api().overview(), live && state.texts ? Promise.resolve({ status: 0 }) : api().info()]);
    if (!current() || ov.stale) return { ok: false };
    if (ov.status !== 200) return { ok: false, reply: ov };
    let results;
    if (ov.json.closed && (!live || state.results === null || state.resultsKey !== resultsKeyOf(ov.json))) {
      const r = await api().results();
      if (!current() || r.stale) return { ok: false };
      results = r.status === 200 ? r.json : null;
    }
    return { ok: true, overview: ov.json, results, texts: info.status === 200 && info.json ? info.json.texts : undefined };
  }
  /** What the closed round's totals depend on: when it changes the totals are read again. */
  const resultsKeyOf = (ov) => [ov.counters && ov.counters.votes, ov.counters && ov.counters.withdrawn, (ov.entries || []).length, ov.review && ov.review.digest, ov.published].join("|");

  function applyRound(read) {
    state.overview = read.overview; state.fetchedAtMono = mono();
    syncGeofenceForm(read.overview);
    syncSchedule(read.overview);
    if (read.overview.closed) {
      if (read.results !== undefined) { state.results = read.results; state.resultsKey = resultsKeyOf(read.overview); }
    } else { state.results = null; state.resultsKey = ""; }
    if (read.texts) state.texts = read.texts;
  }

  /** The server does not accept this connection for this person (403) or the round is gone (404): it is dropped from the tab, never kept. */
  function handleRefusal(reply) {
    if (!reply || reply.status === 0) return; // no connection: the freshness line says so; nothing is invented
    fail(reply);
    if (reply.status === 403 || reply.status === 404) { state.round = null; state.overview = null; state.results = null; state.geo = freshGeo(); saveRound(); }
  }

  /** The authoritative read after an operator action, a connection or a sign-in. It makes any poll still in flight older than itself. */
  async function refresh() {
    if (!state.round) return;
    poller.invalidate();
    const read = await readRound({ live: false });
    if (read.ok) { applyRound(read); poller.markFresh(); }
    else if (read.reply) handleRefusal(read.reply);
  }

  /** The schedule form follows the server until the operator has edits of their own: those are never overwritten by a refresh. */
  function syncSchedule(ov) {
    const s = ov.schedule;
    if (!s || !state.round) return;
    const part = (iso) => P.fromEventInstant(iso) || { date: "", time: "" };
    const fromServer = { registration: part(s.registrationOpensAt), cutoff: part(s.contestantCutoffAt), opens: part(s.votingOpensAt), closes: part(s.votingClosesAt), confirmed: s.status === "CONFIRMED" };
    const base = state.scheduleBaseline;
    const untouched = !base || base.id !== state.round.instanceId || JSON.stringify(state.schedule) === JSON.stringify(base.form);
    state.scheduleBaseline = { id: state.round.instanceId, form: fromServer };
    if (untouched) state.schedule = JSON.parse(JSON.stringify(fromServer));
  }

  /** A button that claims success (the review) is believed only when the state read AFTER it agrees. */
  function settleClaim() {
    const claim = state.claim;
    state.claim = null;
    if (!claim) return;
    if (claim.kind === "review") {
      const ok = !!state.overview && !!state.overview.review && state.overview.review.current === true;
      if (ok) state.notice = "Revisión registrada para los resultados actuales.";
      else state.error = "La revisión se envió, pero ya no corresponde a los resultados actuales. Regístrala de nuevo.";
    }
  }

  // ---- live state (UG-IV-GATE-014): the panel follows the server by itself -------------------------------------------------------
  // A poll of the (uncached) operator overview — one at a time, quick while voting is open, paused while the page is hidden and refreshed the moment
  // it is visible again, backed off after failures — whose answer is applied only if it is still the newest and the person and the round are still
  // the ones it was asked for. It replaces only the sections of the page that CHANGED and never one the operator is typing in. The page says how fresh
  // its data is, and says so plainly when it is not. The public tally boundary is untouched: this reads only the operator routes.

  let pollingRound = null;
  const poller = P.createPoller({
    now: mono,
    setTimer: (fn, ms) => window.setTimeout(fn, ms),
    clearTimer: (handle) => window.clearTimeout(handle),
    isVisible: () => !document.hidden,
    random: () => Math.random(),
    delayFor: () => P.livePollDelayMs({ overview: state.overview }),
    staleAfterMs: P.LIVE_POLL.staleAfterMs,
    maxBackoffMs: P.LIVE_POLL.maxBackoffMs,
    onStatus: () => paintLive(),
    fetchOnce: async () => {
      const read = await readRound({ live: true });
      if (read.ok) return { ok: true, apply: () => { applyRound(read); renderLive(); } };
      if (read.reply && (read.reply.status === 403 || read.reply.status === 404)) { handleRefusal(read.reply); render(); return { ok: false, terminal: true }; }
      return { ok: false };
    },
  });
  function syncPolling() {
    const want = state.auth.status === "authenticated" && state.round ? state.round.instanceId : null;
    if (want === pollingRound) return;
    pollingRound = want;
    if (want) poller.start(); else poller.stop();
  }
  document.addEventListener("visibilitychange", () => poller.onVisibility(!document.hidden));
  window.addEventListener("pageshow", (e) => { if (e && e.persisted) poller.refreshNow(); });
  window.addEventListener("online", () => poller.refreshNow());

  function paintLive() {
    const el = document.getElementById("liveStatus");
    if (!el) return;
    const view = P.liveStatus(poller.status());
    el.hidden = view.tone === "off";
    // fresh data may be waiting behind a section the operator is typing in: never present that section as current without saying so
    el.textContent = state.deferred > 0 && view.tone !== "off" ? `${view.text} Hay cambios nuevos que se mostrarán cuando termines de editar.` : view.text;
    el.setAttribute("data-tone", view.tone);
    const counters = document.querySelector("#roundSections .counters");
    if (counters) { if (view.tone === "stale") counters.setAttribute("data-stale", "true"); else counters.removeAttribute("data-stale"); }
  }

  /** Do two sections show the same thing? Opening or closing a card is the operator's own doing, not a change in the data. */
  function sameSection(a, b) {
    const plain = (node) => {
      const copy = node.cloneNode(true);
      copy.removeAttribute("open");
      copy.querySelectorAll("details").forEach((d) => d.removeAttribute("open"));
      return copy;
    };
    return plain(a).isEqualNode(plain(b));
  }
  /** True while the operator is typing in a section, has changed one of its controls, or holds an unsaved geofence proposal: it is left alone. */
  function beingEdited(node) {
    const active = document.activeElement;
    if (active && active !== document.body && node.contains(active) && /^(INPUT|TEXTAREA|SELECT)$/.test(active.tagName)) return true;
    for (const el of node.querySelectorAll("input, textarea")) {
      if (el.type === "file") { if (el.files && el.files.length > 0) return true; continue; }
      if (el.type === "checkbox" || el.type === "radio") { if (el.checked !== el.defaultChecked) return true; continue; }
      if (el.value !== el.defaultValue) return true;
    }
    if (node.id === "geofenceCard" && (state.geo.proposal || state.geo.locating || (state.geo.form && state.geo.baseline && P.geofenceDirty(state.geo.baseline, state.geo.form)))) return true;
    return false;
  }
  function reconcile(slot, next) {
    const existing = new Map(Array.from(slot.children).map((el) => [el.id, el]));
    const keep = [];
    let held = 0;
    for (const el of next) {
      const mine = existing.get(el.id);
      existing.delete(el.id);
      if (!mine) { keep.push(el); continue; }
      if (sameSection(mine, el)) { mine.removeAttribute("data-deferred"); keep.push(mine); continue; }

  }

  function renderRound() {
    return [header(), checklist(), renderGeofence(), renderPolicies(), renderTasks(), renderSchedule(), renderEntries(), renderResults()];
  }

  /** A rehearsal is announced for as long as it is on screen: the banner above everything and the title of the tab. Nothing on screen = no label. */
  function paintTestEvent() {
    const slot = document.getElementById("bannerSlot");
    const test = state.auth.status === "authenticated" && !!state.round && !!state.overview && state.overview.isTest === true;
    document.title = test ? `[PRUEBA] ${BASE_TITLE}` : BASE_TITLE;
    slot.textContent = "";
    if (test) slot.appendChild(h("div", { class: "test-banner", id: "testBanner", role: "status" }, h("strong", { text: P.TEST_EVENT_LABEL }), ` — ${P.TEST_EVENT_NOTICE}`));
  }

  function render() {
    app.setAttribute("aria-busy", "false");
    paintTestEvent();
    const parts = [
      state.error ? h("div", { class: "msg err", role: "alert", text: state.error }) : null,
      state.notice ? h("div", { class: "msg ok", role: "status", text: state.notice }) : null,
    ];
    if (state.auth.status !== "authenticated") {
      parts.push(h("div", { class: "msg warn", role: "status", id: "needSignIn", text: state.identityNote || (state.auth.status === "profile_incomplete" ? "Completa tu perfil de URBANO Gaming para operar." : "Inicia sesión con la cuenta del operador.") }));
    } else if (!state.round) parts.push(renderConnect());
    else if (!state.overview) parts.push(h("div", { class: "card" }, h("p", { text: "Conectando…" })), h("button", { class: "btn", id: "disconnect", text: "Cambiar de ronda", onclick: () => { state.round = null; state.geo = freshGeo(); saveRound(); clearMessages(); render(); } }));
    else parts.push(h("div", { id: "roundSections" }, ...renderRound()), h("button", { class: "btn", id: "disconnect", text: "Cambiar de ronda", onclick: () => { state.round = null; state.overview = null; state.results = null; state.geo = freshGeo(); saveRound(); clearMessages(); render(); } }));
    app.textContent = "";
    for (const p of parts.flat()) if (p) app.appendChild(p);
    state.deferred = 0;
    syncPolling();
    paintLive();
  }

  setInterval(() => { const clock = document.getElementById("windowClock"); if (clock && state.overview) clock.textContent = P.deadlineLabel(state.overview, mono() - state.fetchedAtMono) || ""; paintLive(); }, 1000);

  // ---- who is signed in: the destination's identity contract (public/urbanoAuth.js) -----------------------------------------------
  // onIdentityReset runs synchronously, BEFORE anything is looked up, the moment the person changes or signs out: everything that
  // belonged to the previous person goes at once, including the round and its host token (the authority). onIdentityChange says who is
  // signed in, or how far their account is (a first-time member finishing the profile), whenever that changes. Raw Auth events (token
  // refreshes, repeated sign-ins) are not what this page reacts to, and a repeated notification for the same state does nothing.
  function dropPreviousPerson(next) {
    poller.stop(); pollingRound = null;
    const incoming = next && typeof next.userId === "string" ? next.userId : null;
    const wasShowing = state.auth.status === "authenticated";
    const stored = readStoredRound();
    state.epoch += 1;
    state.identityKey = "";
    state.auth = { status: "unauthenticated" };
    state.round = null; state.overview = null; state.results = null; state.texts = null;
    state.claims = {}; state.previews = {}; state.consentChecked = {}; state.policyRefs = {}; state.policyAcks = {}; state.taskNotes = {};
    state.schedule = freshSchedule(); state.register = freshRegister(); state.geo = freshGeo();
    state.claim = null; state.identityNote = null; state.scheduleBaseline = null; state.resultsKey = "";
    state.busy = false; state.error = null; state.notice = null;
    modalRoot.textContent = "";
    // The connection leaves the tab on every sign-out and every change of person. The only exception: nobody was on screen and the person who is
    // announced now is the very owner of the stored connection (a session that was still recovering when the page loaded).
    if (!(stored && incoming && !wasShowing && stored.ownerUserId === incoming)) store.remove(EVENT_KEY);
  }
  async function showIdentity(next) {
    const key = [next.status, next.authUserId || "", next.gamingMemberId || ""].join("|");
    if (key === state.identityKey) return;
    state.identityKey = key;
    state.auth = next;
    state.identityNote = null;
    state.round = loadStoredRound(next);
    const epoch = state.epoch;
    render();
    if (state.round) { await refresh(); if (epoch === state.epoch) render(); return; }
    // A profile gap for the very person who owns a stored connection is not a verdict (an operator already has a profile; the shared client keeps
    // a failed lookup's answer until its next Auth event). The connection stays in the tab for them, and the page says so.
    const stored = readStoredRound();
    if (stored && next.status === "profile_incomplete" && next.authUserId === stored.ownerUserId) {
      state.identityNote = "No pudimos confirmar tu perfil por ahora. La ronda sigue conectada en esta pestaña: recarga la página para retomarla.";
      render();
    }
  }
  /** The identity could not be read at all (the request itself failed): nothing stored is touched, and the check is repeated a few times before giving up. */
  const IDENTITY_RETRY_MS = [2000, 5000, 12000];
  function retryIdentity(attempt) {
    if (attempt >= IDENTITY_RETRY_MS.length) { state.identityNote = "No pudimos comprobar tu sesión. Recarga la página."; render(); return; }
    const epoch = state.epoch;
    window.setTimeout(async () => {
      if (epoch !== state.epoch) return; // another person or a sign-out came meanwhile
      let next = null;
      try { next = await UrbanoAuth.getState(); } catch (e) { next = null; }
      if (epoch !== state.epoch) return;
      if (next) { await showIdentity(next); return; }
      retryIdentity(attempt + 1);
    }, IDENTITY_RETRY_MS[attempt]);
  }

  let identityWired = false;
  (async () => {
    UrbanoAuth.attachSignInButton(document.getElementById("signInButton"), document.getElementById("signInStatus"));
    if (!identityWired) {
      identityWired = true;
      UrbanoAuth.onIdentityReset((event) => { dropPreviousPerson(event); render(); });
      UrbanoAuth.onIdentityChange((next) => showIdentity(next));
    }
    let first = null;
    try { first = await UrbanoAuth.getState(); } catch (e) { first = null; }
    // If WHO is signed in could not be read (a network failure, say), nothing is known about the person: the stored connection is left alone and the check repeats.
    if (first) await showIdentity(first);
    else { state.identityNote = "No pudimos comprobar tu sesión; reintentando…"; render(); retryIdentity(0); }
  })();
})();
</script>
</body>
</html>
