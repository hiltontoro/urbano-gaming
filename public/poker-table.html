<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Poker Table — URBANO Gaming</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /*
   * Poker Gameplay Phase — participant surface. Guest-only, no
   * urbanoAuth.js dependency. The phone is the player's private hand
   * AND controller: own hole cards, own stack, the public board/pot,
   * and — only when it is this seat's own turn — the legal action
   * buttons computed server-side (myLegalActions). No client-side
   * legality logic: the buttons shown are exactly what the server
   * already decided is legal, and every tap still goes through
   * PLAYER_ACTION's own full server-side validation.
   */
  :root {
    --bg-page: #0a0a0a; --bg-card: #161616; --surface-2: #1c1c1c;
    --ink: #f5f1e8; --muted: #9b9689; --line: #2a2a2a;
    --gold: #d4af37; --gold-bg: rgba(212, 175, 55, 0.12);
    --primary-fill: #f5f1e8; --primary-ink: #0a0a0a;
    --good: #4ade80; --bad: #f87171;
    --card-white: #f5f1e8; --card-ink: #0a0a0a; --card-red: #d64545;
    --felt: #123524;
    --exp-purple: #7c3aed; --exp-purple-glow: rgba(124, 58, 237, 0.45); --exp-purple-bg: rgba(124, 58, 237, 0.12);
  }
  * { box-sizing: border-box; }
  a { color: inherit; text-decoration: none; }
  body {
    font-family: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-page); color: var(--ink); margin: 0; padding: 0 0 60px;
  }
  .content { max-width: 480px; margin: 0 auto; padding: 20px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 20px; }

  /* Poker Dedicated Experience Participant Handoff Slice: visual-shell
     continuity only — reuses participant.html's own already-accepted
     header pattern (Frontend Shell Refinement Slice) byte-for-byte,
     rather than inventing a third variant alongside host.html's and
     participant.html's. No gameplay markup below this point changed. */
  .brand {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; max-width: 480px; margin: 0 auto; padding: 20px 20px 0;
  }
  .brand-identity { display: inline-flex; align-items: center; gap: 10px; }
  .identity-role-badge {
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted); border: 1px solid var(--line); padding: 4px 10px; border-radius: 999px;
    white-space: nowrap; flex-shrink: 0;
  }
  .brand-mark { width: 24px; height: 26px; display: block; filter: drop-shadow(0 0 6px var(--exp-purple-glow)); }
  .brand-word { font-size: 17px; font-weight: 700; color: var(--ink); letter-spacing: 0.02em; }
  .brand-badge {
    background: var(--exp-purple-bg); border: 1px solid var(--exp-purple);
    color: var(--exp-purple); font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; padding: 3px 8px; border-radius: 999px;
  }
  .back-link {
    max-width: 480px; margin: 14px auto 0; padding: 0 20px;
    font-size: 13px; color: var(--muted); display: block;
  }
  .back-link:hover { color: var(--ink); }

  @media (max-width: 400px) {
    .brand, .back-link, .content { padding-left: 16px; padding-right: 16px; }
    .brand-word { font-size: 15px; }
  }

  .card { border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); padding: 20px; margin: 0 0 16px; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
  .field input {
    width: 100%; font-family: inherit; font-size: 15px; padding: 12px 14px;
    border-radius: 10px; border: 1px solid var(--line); background: var(--bg-card); color: var(--ink);
    min-height: 44px;
  }
  .btn-primary {
    font-family: inherit; font-size: 14px; font-weight: 700; padding: 13px 18px;
    border-radius: 10px; border: none; background: var(--primary-fill); color: var(--primary-ink);
    cursor: pointer; width: 100%; min-height: 46px;
  }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  .msg { font-size: 13px; color: var(--muted); margin: 10px 0 0; line-height: 1.5; }
  .msg.error { color: var(--bad); }
  .msg.success { color: var(--good); }

  /* POKER-PLAYER-TABLE-UI:BEGIN
     Player Table UI Slice 001 (unified green table revision). Everything below hangs off .pk-root — the element pokerParticipant.js
     renders into — so it cannot reach Session UI or any shared rule (one deliberate exception: .pk-root ~ .btn-ghost, the room's own
     "Join a different room" button next to the Poker container). The identical block lives in participant.html and
     poker-table.html (shared stylesheet extraction is deferred); __tests__/pokerParticipantUi.test.ts fails if the two copies drift
     apart. The green felt is ONE panel (.pk-table) holding everything needed to act; the page itself, and the information panel
     below the table, stay on the ordinary URBANO background. Purple means "happening now" (turn), gold means "decided" (a win). */
  .pk-root {
    --pk-charcoal: #0a0a0a;
    --pk-surface: #161616;
    --pk-surface-2: #1f1f23;
    --pk-line: #3a3640;
    --pk-ivory: #f5f1e8;
    --pk-muted: #b8b4ad;
    --pk-purple: #7c3aed;
    --pk-purple-soft: #261a45;
    --pk-lilac: #b57cff;
    --pk-gold: #d4af37;
    --pk-felt: #0f3a28;
    --pk-felt-deep: #0a2a1d;
    --pk-felt-line: #1f5a40;
    --pk-felt-ink: #d6e6dd;
    --pk-felt-divider: rgba(255, 255, 255, 0.18);
    --pk-felt-shade: rgba(0, 0, 0, 0.32);
    --pk-card-red: #b3191f;
    --pk-card-ink: #15131a;
    --pk-danger: #ff9a9a;
    --pk-danger-line: #d46f6f;
    --pk-warn: #ffd866;
    --pk-focus: #ffffff;
    color: var(--pk-ivory);
    font-size: 16px;
    line-height: 24px;
    text-align: left;
  }
  .pk-root *, .pk-root *::before, .pk-root *::after { box-sizing: border-box; }
  .pk-root [hidden] { display: none !important; }
  .pk-root .pk-sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
  }
  .pk-root button:focus-visible, .pk-root input:focus-visible {
    outline: 3px solid var(--pk-focus); outline-offset: 2px; box-shadow: 0 0 0 6px var(--pk-purple);
  }
  .pk-root .msg { margin: 0; font-size: 14px; line-height: 20px; color: var(--pk-felt-ink); }
  .pk-root .pk-info .msg, .pk-root .poker-result-card .msg { color: var(--pk-muted); }
  .pk-root .msg.error { color: var(--pk-danger); }
  .pk-root .msg:empty { display: none; }

  /* panels */
  .pk-root .pk-panel {
    min-width: 0; margin: 0 0 14px; padding: 14px;
    background: var(--pk-surface); border: 1px solid var(--pk-line); border-radius: 14px;
  }
  .pk-root .pk-title {
    display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 8px; margin: 0 0 10px;
    font-size: 13px; line-height: 18px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--pk-muted);
  }
  .pk-root .pk-count { font-weight: 600; letter-spacing: 0; text-transform: none; }
  .pk-root .pk-private { font-size: 13px; line-height: 18px; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--pk-muted); }
  .pk-root .pk-note { margin: 8px 0 0; font-size: 13px; line-height: 18px; color: var(--pk-muted); }

  /* THE GREEN PLAYING TABLE: one continuous felt surface. The sections inside it (turn, pot, community cards, your cards, actions) are
     told apart by labels, spacing and hairline dividers, not by separate cards. The felt is this panel only, never the page. */
  .pk-root .pk-table {
    position: relative; min-width: 0; margin: 0 0 18px; padding: 22px 14px 14px;
    background: radial-gradient(120% 140% at 50% 0%, var(--pk-felt) 0%, var(--pk-felt-deep) 100%);
    border: 1px solid var(--pk-felt-line); border-radius: 18px;
    box-shadow: inset 0 0 28px rgba(0, 0, 0, 0.35);
  }
  .pk-root .pk-table .pk-sec { margin: 12px 0 0; padding: 12px 0 0; border-top: 1px solid var(--pk-felt-divider); }
  .pk-root .pk-table .pk-turn + .pk-sec { padding-top: 0; border-top: 0; }
  .pk-root .pk-table #poker-action-area:not(:empty) { margin: 12px 0 0; padding: 12px 0 0; border-top: 1px solid var(--pk-felt-divider); }
  .pk-root .pk-table .pk-title { margin: 0 0 8px; color: var(--pk-felt-ink); }
  .pk-root .pk-table .pk-private, .pk-root .pk-table .pk-count { color: var(--pk-felt-ink); }

  /* whose turn it is: always words (the colour and the bar are only emphasis); it is the first line of the table */
  .pk-root .pk-turn {
    margin: 0; padding: 8px 12px; overflow-wrap: anywhere;
    font-size: 16px; line-height: 22px; font-weight: 700; color: var(--pk-ivory);
    background: var(--pk-felt-shade); border-left: 4px solid var(--pk-felt-ink); border-radius: 10px;
  }
  .pk-root .pk-turn.is-mine { background: rgba(124, 58, 237, 0.55); border-left-color: var(--pk-lilac); }

  /* pot and community cards */
  .pk-root .pk-potrow { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; margin: 0; }
  .pk-root .pk-pot-label { font-size: 14px; line-height: 20px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--pk-felt-ink); }
  .pk-root .pk-pot-value { font-size: 28px; line-height: 34px; font-weight: 800; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .pk-root .pk-pot-unit { font-size: 14px; line-height: 20px; color: var(--pk-felt-ink); }
  .pk-root .pk-pot-note { margin: 4px 0 0; font-size: 13px; line-height: 18px; color: var(--pk-felt-ink); }
  /* "Out of date": sits in the table's own top band (the extra top padding above), out of the flow, so it can never take a line of its
     own or move anything, whatever the width or the size of the pot. It covers nothing and takes no taps. */
  .pk-root .pk-stale-tag {
    position: absolute; top: 3px; right: 14px; padding: 0 8px; white-space: nowrap; pointer-events: none;
    font-size: 12px; line-height: 14px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--pk-warn); background: var(--pk-felt-shade); border: 1px solid var(--pk-warn); border-radius: 999px;
  }
  .pk-root .pk-board-label {
    display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 8px; margin: 0 0 8px;
    font-size: 13px; line-height: 18px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--pk-felt-ink);
  }
  .pk-root .pk-board-label .pk-count { letter-spacing: 0; text-transform: none; font-weight: 600; }
  .pk-root .board-cards { --pk-cw: clamp(40px, 14vw, 72px); display: flex; justify-content: center; gap: 6px; }

  /* connection notice (a failed poll): the LAST thing inside the table, below the controls, so it never moves them */
  .pk-root .pk-table .pk-notice { margin: 12px 0 0; padding: 10px 12px; background: var(--pk-felt-shade); border-left: 4px solid var(--pk-warn); border-radius: 10px; }
  .pk-root .pk-notice-title { font-size: 16px; line-height: 22px; font-weight: 800; color: var(--pk-warn); }
  .pk-root .pk-notice-line { margin: 4px 0 0; font-size: 14px; line-height: 20px; color: var(--pk-ivory); overflow-wrap: anywhere; }

  /* INFORMATION PANEL: outside the table, on the page background */
  .pk-root .pk-info { margin: 0 0 14px; }
  /* the page's own "Join a different room" button is the next sibling of the Poker container: give it the same 44px touch target */
  .pk-root ~ .btn-ghost { min-height: 44px; }
  .pk-root .pk-room { margin: 14px 0 0; padding: 12px 0 0; border-top: 1px solid var(--pk-line); }
  .pk-root .pk-status { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin: 0; }
  .pk-root .status-pill {
    display: inline-flex; align-items: center; padding: 2px 10px; white-space: nowrap;
    font-size: 13px; line-height: 20px; font-weight: 700; color: var(--pk-ivory);
    background: var(--pk-surface-2); border: 1px solid var(--pk-line); border-radius: 999px;
  }
  .pk-root .status-pill.pk-street { background: var(--pk-purple); border-color: #a78bfa; color: #ffffff; }
  .pk-root .status-pill.pk-street.idle { background: var(--pk-surface-2); border-color: var(--pk-muted); color: var(--pk-ivory); }
  .pk-root .pk-street-note { font-size: 13px; line-height: 18px; color: var(--pk-muted); }

  /* playing cards: rank plus a suit SYMBOL, so suit never depends on colour */
  .pk-root .playing-card {
    width: var(--pk-cw, 48px); aspect-ratio: 5 / 7; flex: none;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: calc(var(--pk-cw, 48px) * 0.13); background: var(--pk-ivory); color: var(--pk-card-ink);
    font-weight: 800; line-height: 1; box-shadow: 0 1px 0 rgba(0, 0, 0, 0.35), inset 0 0 0 1px rgba(0, 0, 0, 0.25);
  }
  .pk-root .playing-card .pk-rank { font-size: calc(var(--pk-cw, 48px) * 0.44); }
  .pk-root .playing-card .pk-suit { font-size: calc(var(--pk-cw, 48px) * 0.46); }
  .pk-root .playing-card.red { color: var(--pk-card-red); }
  .pk-root .playing-card.face-down {
    background: repeating-linear-gradient(45deg, #2b1a5c 0 6px, #36206f 6px 12px);
    border: 2px solid var(--pk-lilac); box-shadow: none;
  }
  .pk-root .playing-card.slot { background: transparent; border: 2px dashed rgba(255, 255, 255, 0.5); box-shadow: none; }
  .pk-root .playing-card.pk-mini { --pk-cw: 34px; border-radius: 5px; }

  /* the viewer's own cards (a section of the table) */
  .pk-root .pk-hand .hole-cards { --pk-cw: clamp(52px, 17vw, 72px); display: flex; justify-content: center; gap: 10px; }
  .pk-root .pk-hand.is-folded .hole-cards { filter: grayscale(1); }

  /* players */
  .pk-root .seat-list { display: grid; gap: 8px; }
  .pk-root .seat-row {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: start;
    padding: 10px 12px; background: var(--pk-surface-2); border: 2px solid var(--pk-line); border-radius: 10px;
  }
  .pk-root .seat-row.is-me { background: #25232a; border-color: #8c877f; }
  .pk-root .seat-row.is-turn { background: var(--pk-purple-soft); border-color: var(--pk-lilac); }
  .pk-root .seat-row.is-folded { color: var(--pk-muted); }
  .pk-root .seat-name { min-width: 0; font-size: 16px; line-height: 22px; font-weight: 700; overflow-wrap: anywhere; }
  .pk-root .pk-seat-chips { display: grid; justify-items: end; min-width: 0; text-align: right; font-variant-numeric: tabular-nums; }
  .pk-root .seat-stack { font-size: 14px; line-height: 20px; color: var(--pk-muted); }
  .pk-root .pk-seat-left { font-size: 16px; font-weight: 800; color: var(--pk-ivory); }
  .pk-root .seat-row.is-folded .pk-seat-left { color: var(--pk-muted); }
  .pk-root .pk-seat-pot { font-size: 13px; line-height: 18px; color: var(--pk-muted); }
  .pk-root .pk-seat-tags { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 6px; }
  .pk-root .seat-badge {
    display: inline-flex; align-items: center; margin: 0; padding: 1px 8px;
    font-size: 12px; line-height: 16px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap;
    color: var(--pk-ivory); background: transparent; border: 1px solid var(--pk-muted); border-radius: 999px;
  }
  .pk-root .seat-badge.turn { background: var(--pk-purple); border-color: #a78bfa; color: #ffffff; }
  .pk-root .seat-badge.allin { border-color: var(--pk-lilac); color: var(--pk-lilac); }
  .pk-root .seat-badge.out, .pk-root .seat-badge.wait { color: var(--pk-muted); }
  .pk-root .seat-badge.wait { border-style: dashed; }
  @media (max-width: 419px) {
    .pk-root .seat-row { grid-template-columns: minmax(0, 1fr); }
    .pk-root .pk-seat-chips { justify-items: start; text-align: left; }
  }

  /* hand result */
  .pk-root .poker-result-card { border: 2px solid var(--pk-ivory); border-radius: 16px; }
  .pk-root .poker-result-card.poker-result-win { border-color: var(--pk-gold); }
  .pk-root .pk-result-sub { font-size: 13px; line-height: 18px; color: var(--pk-muted); }
  .pk-root .pk-result-headline { font-size: 22px; line-height: 28px; font-weight: 800; overflow-wrap: anywhere; }
  .pk-root .pk-result-detail { margin-top: 2px; font-size: 15px; line-height: 22px; font-weight: 700; }
  .pk-root .poker-result-row {
    display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 10px;
    margin-top: 8px; padding: 8px 10px; background: var(--pk-surface-2); border: 2px solid var(--pk-line); border-radius: 10px;
  }
  .pk-root .poker-result-row.pk-winner { border-color: var(--pk-gold); }
  .pk-root .pk-reveal-line { min-width: 0; font-weight: 700; overflow-wrap: anywhere; }
  .pk-root .pk-mini-cards { display: flex; gap: 4px; }
  .pk-root .pk-payout { grid-column: 1 / -1; font-size: 14px; line-height: 20px; color: var(--pk-muted); }
  .pk-root .pk-payee { grid-column: 1 / -1; font-weight: 700; overflow-wrap: anywhere; }

  /* actions: a section of the table, in normal document flow (nothing is pinned or overlaid at any screen height, so the board and the
     player's own cards can always be seen in full); the section scrolls like the rest of the page, and a focused amount field is
     scrolled into view by the browser. Controls stay readable on the felt: ivory, purple, outlined and dark fields. */
  .pk-root .pk-actionbar { display: grid; gap: 10px; margin: 0; padding: 0; }
  .pk-root .pk-turnline { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 12px; }
  .pk-root .pk-turnline .street-label { margin: 0; font-size: 13px; line-height: 18px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--pk-felt-ink); }
  .pk-root .pk-owed { font-size: 14px; line-height: 20px; color: var(--pk-felt-ink); font-variant-numeric: tabular-nums; }
  .pk-root .action-bar { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 0; }
  .pk-root .action-bar .pk-wide { grid-column: 1 / -1; }
  .pk-root .action-btn {
    min-height: 48px; margin: 0; padding: 10px 8px; overflow-wrap: anywhere; font-family: inherit;
    font-size: 16px; line-height: 22px; font-weight: 800; text-align: center; cursor: pointer;
    color: var(--pk-ivory); background: var(--pk-felt-shade); border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 10px;
  }
  .pk-root .action-btn.fold { color: var(--pk-danger); border-color: var(--pk-danger-line); }
  .pk-root .action-btn.primary { color: var(--pk-card-ink); background: var(--pk-ivory); border-color: var(--pk-ivory); }
  .pk-root .action-btn.aggressive { color: #ffffff; background: var(--pk-purple); border-color: #a78bfa; }
  .pk-root .action-btn.allin { color: var(--pk-lilac); border-color: var(--pk-lilac); }
  .pk-root .action-btn:disabled { opacity: 1; cursor: not-allowed; color: var(--pk-felt-ink); background: var(--pk-felt-shade); border-color: rgba(255, 255, 255, 0.18); }
  .pk-root .pk-btn-note { font-size: 13px; font-weight: 600; }
  /* the amount field sits in the button grid directly above the Bet/Raise it feeds */
  .pk-root .pk-amount { grid-column: 1 / -1; display: grid; gap: 6px; margin: 4px 0; padding: 0; }
  .pk-root .amount-row { display: grid; grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 4px 12px; margin: 0; }
  .pk-root .amount-label { margin: 0; font-size: 14px; line-height: 20px; font-weight: 700; color: var(--pk-ivory); }
  .pk-root #amount-input {
    width: 100%; min-height: 50px; margin: 0; padding: 8px 12px; color-scheme: dark; font-family: inherit;
    /* when the field is focused, leave room below it so the help line and the Bet/Raise button it feeds scroll into view with it */
    scroll-margin: 16px 0 150px;
    font-size: 20px; line-height: 26px; font-weight: 800; text-align: center; font-variant-numeric: tabular-nums;
    color: var(--pk-ivory); background: var(--pk-charcoal); border: 2px solid var(--pk-muted); border-radius: 10px;
  }
  .pk-root #amount-input[aria-invalid="true"] { border-color: var(--pk-danger); }
  .pk-root .amount-help { margin: 0; font-size: 13px; line-height: 18px; color: var(--pk-felt-ink); }
  /* POKER-PLAYER-TABLE-UI:END */
</style>
</head>
<body>

<div class="brand">
  <div class="brand-identity">
    <img class="brand-mark" src="/urbano-mark.svg" alt="" />
    <span class="brand-word">URBANO</span>
    <span class="brand-badge">Gaming</span>
  </div>
  <span class="identity-role-badge">Guest</span>
</div>
<a class="back-link" href="/participant.html">← Back to URBANO Gaming</a>

<div class="content" id="content">
  <h1>🃏 Poker Table</h1>
  <p class="sub">Non-wagering — free chips only.</p>

  <div class="card" id="join-card">
    <div class="field">
      <label>Room code</label>
      <input id="join-room-code" placeholder="ABCDEF" maxlength="6" style="text-transform:uppercase" />
    </div>
    <div class="field">
      <label>Your name</label>
      <input id="join-display-name" placeholder="Your name" maxlength="40" />
    </div>
    <button class="btn-primary" id="btn-join">Join Table</button>
    <p class="msg" id="join-msg"></p>
  </div>

  <div id="table-card" style="display:none;"></div>
</div>

<script src="/sessionSync.js"></script>
<script src="/pokerParticipant.js"></script>
<script>
// Participant Unified Entry Slice 002: this page is now a thin
// compatibility surface over the shared PokerParticipant module
// (pokerParticipant.js) — the same join/render/action implementation
// /participant.html's own inline Poker experience now also calls, so
// the two surfaces cannot silently drift apart. This page's own join
// form (below) stays, since it — unlike participant.html's unified
// form — has always been Poker-only. Seat identity is now
// sessionStorage-scoped (tab-scoped), a deliberate Founder correction
// carried into this compatibility surface too — see
// pokerParticipant.js's own top comment.
const tableContainer = document.getElementById("table-card");

// Reuses the same session-agnostic polling factory participant.html's
// own Session sync already uses — createSessionSync() has no concept
// of "session" or "table" at all, so this is not a special case.
const pokerSync = createSessionSync(function () {
  const seat = PokerParticipant.loadPokerSeat();
  if (!seat) return Promise.resolve();
  return PokerParticipant.renderPokerTable(tableContainer, seat);
}, 2000);

document.getElementById("btn-join").addEventListener("click", async () => {
  const roomCode = document.getElementById("join-room-code").value.trim();
  const displayName = document.getElementById("join-display-name").value.trim();
  const msg = document.getElementById("join-msg");
  const btn = document.getElementById("btn-join");

  if (!roomCode || !displayName) {
    msg.className = "msg error";
    msg.textContent = "Room code and name are required.";
    return;
  }

  btn.disabled = true;
  msg.className = "msg";
  msg.textContent = "Joining…";

  const res = await PokerParticipant.joinPokerTable(roomCode.toUpperCase(), displayName);

  if (res.status === 201) {
    PokerParticipant.savePokerSeat(res.json);
    document.getElementById("join-card").style.display = "none";
    document.getElementById("table-card").style.display = "block";
    await PokerParticipant.renderPokerTable(tableContainer, res.json);
    pokerSync.start();
  } else {
    msg.className = "msg error";
    msg.textContent = (res.json && res.json.error) || "Failed to join table.";
    btn.disabled = false;
  }
});

// Poker Dedicated Experience Participant Handoff Slice: a plain,
// non-authoritative convenience prefill — carries no identity, token,
// or Session reference. Only pre-fills the visible join form; the
// actual Guest/seat identity this page creates is entirely
// independent of it, and nothing breaks if this parameter is absent,
// stale, or tampered with. Participant Unified Entry Slice 002 no
// longer links here from participant.html (the unified join form
// handles Poker codes directly), but this page remains reachable
// directly, so the prefill stays useful and is left unchanged.
(function prefillNameFromQuery() {
  const name = new URLSearchParams(location.search).get("name");
  if (name) document.getElementById("join-display-name").value = name;
})();

(function init() {
  const seat = PokerParticipant.loadPokerSeat();
  if (seat) {
    document.getElementById("join-card").style.display = "none";
    document.getElementById("table-card").style.display = "block";
    PokerParticipant.renderPokerTable(tableContainer, seat);
    pokerSync.start();
  }
})();
</script>

</body>
</html>
