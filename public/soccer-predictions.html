<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title data-i18n="pred.title">URBANO Score — URBANO Gaming</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /*
   * URBANO Score (historically "Soccer Predictions": this file's name, its route and its identifiers keep that name) — real Experience. Built on Gaming Member
   * identity (urbanoAuth.js); Prediction data via
   * /api/gaming/predictions/*. Reuses the same identity tokens as
   * index.html/host.html/participant.html — no shell redesign.
   */
  :root {
    --bg-page: #0a0a0a;
    --bg-card: #161616;
    --surface-2: #1c1c1c;
    --ink: #f5f1e8;
    --muted: #9b9689;
    --line: #2a2a2a;
    --gold: #d4af37;
    --gold-bg: rgba(212, 175, 55, 0.12);
    --primary-fill: #f5f1e8;
    --primary-ink: #0a0a0a;
    --exp-purple: #7c3aed;
    --exp-purple-glow: rgba(124, 58, 237, 0.45);
    --exp-purple-bg: rgba(124, 58, 237, 0.12);
    --good: #4ade80;
    --bad: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-page); color: var(--ink); margin: 0; padding: 0 0 60px;
  }
  a { color: inherit; text-decoration: none; }

  .shell-header {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 16px;
    max-width: 720px; margin: 0 auto; padding: 20px 20px 0;
  }
  .brand { display: inline-flex; align-items: center; gap: 10px; min-width: 0; }
  /* The URBANO mark and wordmark are one link to the parent site; the Gaming badge is a separate link back to this application's home. */
  .brand-link { display: inline-flex; align-items: center; gap: 10px; border-radius: 6px; }
  .brand-mark-wrap { position: relative; display: inline-flex; width: 24px; height: 26px; flex-shrink: 0; }
  .brand-mark-wrap::before {
    content: ""; position: absolute; inset: -9px;
    background: radial-gradient(circle, var(--exp-purple-glow) 0%, transparent 70%);
    filter: blur(4px); z-index: 0;
  }
  .brand-mark { position: relative; z-index: 1; width: 24px; height: 26px; display: block; }
  .brand-word { font-size: 17px; font-weight: 700; color: var(--ink); letter-spacing: 0.02em; }
  .brand-badge {
    background: var(--exp-purple-bg); border: 1px solid var(--exp-purple);
    color: var(--exp-purple); font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; padding: 3px 8px; border-radius: 999px;
  }
  /* Language selector and account controls sit together on the right; on a phone the header wraps to two rows (brand, then the
     selector on the left and the account group on the right) so nothing overflows at 375 px. */
  .header-tools { display: flex; align-items: center; gap: 12px; margin-left: auto; min-width: 0; max-width: 100%; }
  .lang-switch { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; flex-shrink: 0; }
  .lang-switch button {
    font-family: inherit; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: var(--muted);
    background: transparent; border: none; padding: 9px 12px; min-height: 44px; min-width: 44px; cursor: pointer;
  }
  .lang-switch button[aria-pressed="true"] { color: var(--primary-ink); background: var(--primary-fill); }
  .account-group { display: flex; align-items: center; gap: 8px; min-width: 0; justify-content: flex-end; position: relative; }
  .account-group [data-urbano-signout] { flex: none; white-space: nowrap; padding: 12px 4px; color: var(--muted); }
  [hidden] { display: none !important; }
  .brand-link:focus-visible, .brand-badge:focus-visible, .nav-link:focus-visible, .back-link:focus-visible,
  .lang-switch button:focus-visible, .signin-btn:focus-visible, .account-group [data-urbano-signout]:focus-visible,
  .btn-primary:focus-visible, .team-toggle:focus-visible, footer a:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  .signin-btn {
    font-family: inherit; font-size: 13px; font-weight: 600; padding: 9px 16px;
    border-radius: 8px; border: 1px solid var(--ink); background: transparent;
    color: var(--ink); cursor: pointer;
  }
  .signin-btn:hover { background: var(--surface-2); }
  a.signin-btn { display: inline-block; text-align: center; }
  .account-group .signin-btn { flex: 0 1 auto; min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .signin-status {
    display: none; max-width: 720px; margin: 10px auto 0; padding: 10px 20px 0;
    font-size: 12.5px; color: var(--muted); line-height: 1.5;
  }

  .primary-nav {
    display: flex; gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch;
    max-width: 720px; margin: 16px auto 0; padding: 0 20px 2px;
  }
  .primary-nav::-webkit-scrollbar { display: none; }
  .nav-link {
    flex: 0 0 auto; font-size: 13px; font-weight: 600; color: var(--muted);
    padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line);
    white-space: nowrap;
  }
  .nav-link.is-active { color: var(--ink); border-color: var(--ink); }

  .back-link {
    max-width: 720px; margin: 18px auto 0; padding: 0 20px;
    font-size: 13px; color: var(--muted); display: block;
  }
  .back-link:hover { color: var(--ink); }

  .content { max-width: 720px; margin: 20px auto 0; padding: 0 20px; }

  /* The public name, its descriptor and the honest scope (soccer only for now) are static: they are on screen before, and whatever
     happens to, the match list. */
  .score-heading { max-width: 720px; margin: 18px auto 0; padding: 0 20px; }
  .score-heading h1 { font-size: clamp(26px, 5vw, 34px); font-weight: 800; letter-spacing: -0.01em; margin: 0; }
  .score-descriptor { margin: 6px 0 0; font-size: 16px; font-weight: 600; color: var(--ink); }
  .score-scope {
    margin: 10px 0 0; display: inline-block; font-size: 12.5px; font-weight: 700; letter-spacing: 0.02em; line-height: 1.4;
    color: #b57cff; background: var(--exp-purple-bg); border: 1px solid rgba(124, 58, 237, 0.5); padding: 4px 10px; border-radius: 6px;
  }

  .card {
    border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2);
    padding: 20px; margin: 0 0 18px;
  }
  .card.accent { border-color: var(--exp-purple); box-shadow: 0 0 0 1px rgba(124,58,237,0.14), 0 0 24px var(--exp-purple-glow); }

  .match-teams {
    display: flex; align-items: center; justify-content: center; gap: 14px;
    font-size: 20px; font-weight: 800; margin: 0 0 10px; flex-wrap: wrap; text-align: center;
  }
  .match-vs { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
  .match-meta {
    display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: center;
    font-size: 12.5px; color: var(--muted); margin-bottom: 14px;
  }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
  .field input, .field select {
    width: 100%; font-family: inherit; font-size: 15px; padding: 12px 14px;
    border-radius: 10px; border: 1px solid var(--line); background: var(--bg-card); color: var(--ink);
    min-height: 44px;
  }
  .score-row { display: flex; align-items: center; gap: 12px; }
  .score-row input { text-align: center; }
  .score-row .score-vs { font-size: 13px; color: var(--muted); font-weight: 700; }

  .team-toggle-row { display: flex; gap: 8px; }
  .team-toggle {
    flex: 1; font-family: inherit; font-size: 13px; font-weight: 600; padding: 12px 8px;
    border-radius: 10px; border: 1px solid var(--line); background: var(--bg-card); color: var(--ink);
    cursor: pointer; min-height: 44px; text-align: center;
  }
  .team-toggle.is-selected { border-color: var(--gold); background: var(--gold-bg); color: var(--gold); }

  .btn-primary {
    font-family: inherit; font-size: 14px; font-weight: 700; padding: 13px 18px;
    border-radius: 10px; border: none; background: var(--primary-fill); color: var(--primary-ink);
    cursor: pointer; width: 100%; min-height: 46px;
  }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  .status-pill {
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 5px 12px; border-radius: 999px; background: rgba(255,255,255,0.04);
    color: var(--muted); border: 1px solid var(--line); display: inline-block;
  }
  .status-pill.good { color: var(--good); border-color: var(--good); }
  .status-pill.bad { color: var(--bad); border-color: var(--bad); }

  .dimension-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 14px 0; }
  .dimension-cell { border-radius: 10px; border: 1px solid var(--line); padding: 12px; text-align: center; }
  .dimension-cell.correct { border-color: var(--good); background: rgba(74,222,128,0.08); }
  .dimension-cell.incorrect { border-color: var(--bad); background: rgba(248,113,113,0.06); }
  .dimension-cell .label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .dimension-cell .mark { font-size: 20px; margin-top: 4px; }

  /* URBANO Score — the progressive prediction (a stepper over the ladder). */
  .ladder-rules { margin: 0 0 12px; font-size: 13.5px; color: var(--ink); line-height: 1.5; border-left: 3px solid var(--exp-purple); padding: 2px 0 2px 12px; }
  .ladder-steps { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; padding: 0; margin: 12px 0; }
  .ladder-step-btn {
    font-family: inherit; font-size: 12px; font-weight: 700; padding: 8px 10px; min-height: 44px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--bg-card); color: var(--muted); cursor: pointer;
  }
  .ladder-step-btn.is-done { border-color: var(--good); color: var(--ink); }
  .ladder-step-btn.is-current { border-color: var(--exp-purple); color: var(--ink); background: var(--exp-purple-bg); }
  .ladder-step-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .ladder-body h3 { font-size: 17px; font-weight: 800; margin: 14px 0 6px; outline: none; }
  .ladder-hint { font-size: 12.5px; color: var(--muted); margin: 0 0 12px; line-height: 1.5; }
  .score-stepper-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .score-stepper { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--bg-card); text-align: center; }
  .score-stepper .team-name { font-size: 13px; font-weight: 700; margin: 0 0 8px; overflow-wrap: anywhere; }
  .stepper-controls { display: flex; align-items: center; justify-content: center; gap: 8px; }
  .stepper-controls button {
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
    font-size: 20px; font-family: inherit; cursor: pointer;
  }
  .stepper-controls input {
    width: 56px; min-height: 44px; text-align: center; font-size: 22px; font-weight: 800; font-family: inherit;
    border-radius: 10px; border: 1px solid var(--line); background: var(--bg-card); color: var(--ink); padding: 4px;
  }
  .ladder-none { margin-top: 10px; }
  .team-toggle[aria-pressed="true"] { border-color: var(--gold); background: var(--gold-bg); color: var(--gold); }
  .team-toggle-row.is-wrap { flex-wrap: wrap; }
  .ladder-status { margin: 0 0 10px; padding: 7px 10px; border-radius: 8px; border: 1px dashed var(--line); font-size: 12.5px; font-weight: 700; line-height: 1.4; }
  .ladder-status.is-draft { border-color: var(--gold); color: var(--gold); }
  .ladder-status.is-saved { border-color: var(--good); color: var(--good); }
  .ladder-conflict { border: 1px solid var(--gold); border-radius: 12px; padding: 14px; margin: 6px 0 14px; }
  .ladder-conflict h3 { margin: 0 0 8px; font-size: 16px; }
  .ladder-conflict p, .ladder-conflict li { font-size: 13.5px; line-height: 1.55; }
  .ladder-panel { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 14px 0; background: var(--bg-card); }
  .ladder-panel p { margin: 0 0 6px; font-size: 13px; line-height: 1.5; }
  .ladder-panel .ladder-current { font-weight: 800; }
  .ladder-offers-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 10px 0 4px; }
  .ladder-offers { margin: 0; padding-left: 18px; font-size: 13px; color: var(--ink); line-height: 1.6; }
  .ladder-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .ladder-actions button { flex: 1 1 170px; min-height: 46px; }
  .btn-secondary {
    font-family: inherit; font-size: 14px; font-weight: 700; padding: 13px 18px; border-radius: 10px;
    border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer;
  }
  .btn-secondary:disabled { opacity: 0.5; cursor: not-allowed; }
  .ladder-review { border: 1px dashed var(--exp-purple); border-radius: 12px; padding: 14px; margin: 14px 0; }
  .ladder-review h3 { margin-top: 0; }
  .ladder-review ul { margin: 8px 0; padding-left: 18px; font-size: 14px; line-height: 1.7; }
  .dimension-cell.not-attempted { border-style: dashed; background: transparent; }
  .dimension-cell.not-attempted .mark { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .dimension-cell .state-text { font-size: 12.5px; margin-top: 6px; }
  .msg { font-size: 13px; color: var(--muted); margin: 10px 0 0; line-height: 1.5; }
  .msg.error { color: var(--bad); }
  .msg.success { color: var(--good); }

  .empty-state { text-align: center; color: var(--muted); padding: 40px 20px; }

  footer {
    max-width: 720px; margin: 48px auto 0; padding: 20px; text-align: center;
    color: var(--muted); font-size: 12px; border-top: 1px solid var(--line);
  }
  footer p { margin: 0 0 6px; }
  footer a { color: var(--ink); text-decoration: underline; padding: 8px 2px; }

  @media (max-width: 640px) {
    .shell-header { padding: 16px 16px 0; }
    /* On a phone the tools are not one block: the header wraps into two rows. Row 1 is the brand and the language selector; row 2 is
       the account group alone, the full width, right-aligned, so a real name has room before it is ever truncated. */
    .header-tools { display: contents; }
    .lang-switch { margin-left: auto; }
    .account-group { flex: 1 1 100%; }
    .brand-word { font-size: 15px; }
    .signin-btn { font-size: 12px; padding: 9px 12px; white-space: nowrap; }
    .primary-nav { padding: 0 16px 2px; }
    .back-link, .content, .score-heading { padding-left: 16px; padding-right: 16px; }
    .match-teams { font-size: 17px; }
  }
</style>
</head>
<body>

<header class="shell-header">
  <div class="brand">
    <a class="brand-link" href="https://urbanohn.com/" rel="noopener" aria-label="URBANO — ir a urbanohn.com" data-i18n-attr="aria-label:shell.brand.urbano">
      <span class="brand-mark-wrap"><img class="brand-mark" src="/urbano-mark.svg" alt="" /></span>
      <span class="brand-word">URBANO</span>
    </a>
    <a class="brand-badge" href="/" aria-label="URBANO Gaming — inicio" data-i18n-attr="aria-label:shell.brand.gaming">Gaming</a>
  </div>
  <div class="header-tools">
    <div class="lang-switch" role="group" aria-label="Idioma" data-i18n-attr="aria-label:shell.lang.label">
      <button type="button" data-lang="es" lang="es" aria-pressed="true" aria-label="Cambiar a español" data-i18n-attr="aria-label:shell.lang.es">ES</button>
      <button type="button" data-lang="en" lang="en" aria-pressed="false" aria-label="Cambiar a inglés" data-i18n-attr="aria-label:shell.lang.en">EN</button>
    </div>
    <div class="account-group">
      <a class="signin-btn" id="account-link" href="/profile.html" hidden></a>
      <button class="signin-btn" id="btn-signin" style="visibility:hidden">Iniciar sesión / Crear cuenta</button>
    </div>
  </div>
</header>
<p class="signin-status" id="signin-status"></p>

<nav class="primary-nav" aria-label="Navegación principal" data-i18n-attr="aria-label:shell.nav.label">
  <a class="nav-link" href="/" data-i18n="shell.nav.home">Inicio</a>
  <a class="nav-link" href="/#play" data-i18n="shell.nav.play">Jugar</a>
  <a class="nav-link is-active" href="/#experiences" aria-current="page" data-i18n="shell.nav.experiences">Experiencias</a>
  <a class="nav-link" href="/leaderboards.html" data-i18n="shell.nav.leaderboards">Clasificaciones</a>
  <a class="nav-link" href="/rewards.html" data-i18n="shell.nav.rewards">Premios</a>
</nav>

<a class="back-link" href="/" data-i18n="pred.back">← Volver a URBANO Gaming</a>

<section class="score-heading" aria-labelledby="score-title">
  <h1 id="score-title">URBANO Score</h1>
  <p class="score-descriptor" data-i18n="pred.descriptor">Tus predicciones deportivas</p>
  <p class="score-scope" data-i18n="pred.scope">Por ahora solo hay fútbol disponible.</p>
</section>

<div class="content" id="content">
  <div class="empty-state" data-i18n="pred.loading">Cargando URBANO Score…</div>
</div>

<footer>
  <p data-i18n="shell.footer.part">URBANO Gaming — parte de URBANO</p>
  <p>Powered by <a href="https://www.tecnomovi.com/" rel="noopener" aria-label="TecnoMovi — ir a tecnomovi.com" data-i18n-attr="aria-label:shell.footer.tecnomovi">TecnoMovi</a></p>
</footer>

<script src="/urbanoAuth.js"></script>
<script>
UrbanoAuth.attachSignInButton(
  document.getElementById("btn-signin"),
  document.getElementById("signin-status"),
  { accountLink: document.getElementById("account-link") }
);

const content = document.getElementById("content");

// Language. Every sentence on this page comes from the language table (urbanoI18n.js) and carries data-i18n (and, when it has
// variables, data-i18n-vars) so that changing language re-translates it IN PLACE — nothing is rebuilt, so a form the person is
// filling in keeps what they typed. Team, player, venue and competition names and prize labels are data: they are never translated.
const t = (key, vars) => UrbanoI18n.t(key, vars);

function el(html) {
  const div = document.createElement("div");
  div.innerHTML = html.trim();
  return div.firstElementChild;
}

// Team names, player names, competition names and prize labels are
// admin-entered and reach this page through el() templates, so every
// such string passes through esc() first.
function esc(value) {
  return String(value === null || value === undefined ? "" : value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// Attribute text for a translatable node inside an el() template, and its initial (current-language) text.
function ix(key, vars) {
  return `data-i18n="${esc(key)}"${vars ? ` data-i18n-vars="${esc(JSON.stringify(vars))}"` : ""}`;
}
function tx(key, vars) {
  return esc(t(key, vars));
}

// Sets a node's text from the language table and remembers the key (and variables) so a change of language re-translates it.
function setText(node, key, vars) {
  node.setAttribute("data-i18n", key);
  if (vars) node.setAttribute("data-i18n-vars", JSON.stringify(vars));
  else node.removeAttribute("data-i18n-vars");
  node.removeAttribute("data-server-message");
  node.textContent = t(key, vars);
}

// A message that came from the server. A known, exact message is translated; an unknown one is never guessed at: it is shown as
// received in English and replaced by a generic sentence in Spanish. The raw text is kept so a change of language can redraw it.
function serverMessageText(raw) {
  const key = UrbanoI18n.serverMessageKey(raw);
  if (key) return t(key);
  return UrbanoI18n.getLang() === "en" ? raw : t("pred.srv.generic");
}
function setServerMessage(node, raw) {
  node.removeAttribute("data-i18n");
  node.removeAttribute("data-i18n-vars");
  node.setAttribute("data-server-message", raw);
  node.textContent = serverMessageText(raw);
}

// Kick-off time. The time-zone policy is unchanged (the device's own); only the language of month and weekday names follows the page.
function formatKickoff(iso) {
  return new Date(iso).toLocaleString(UrbanoI18n.locale());
}

// The prize this qualification is for, resolved from the match's own
// venue activations (no extra API call). null when it cannot be resolved.
function prizeLabelForQualification(match, qualification) {
  const activations = match.venueActivations || [];
  const sameActivation = activations.find((a) => a.venueActivationId === qualification.venueActivationId);
  for (const activation of sameActivation ? [sameActivation] : activations) {
    const tier = (activation.prizeTiers || []).find((t) => t.prizeTierId === qualification.prizeTierId);
    if (tier && typeof tier.prizeLabel === "string" && tier.prizeLabel.trim()) return tier.prizeLabel.trim();
  }
  return null;
}

// What the member is told about a prize. A result correction never hands a prize over twice: a prize an earlier handover already
// satisfies says so, and a prize the venue is still reviewing (a correction changed an already-delivered prize) is not shown as
// ready to collect. Returns the language-table key of that sentence.
function prizeStatusKey(qualification) {
  if (qualification.supersededAt) return "pred.prize.superseded";
  if (qualification.redeemedAt) return "pred.prize.redeemed";
  if (qualification.alreadyDelivered) return "pred.prize.delivered";
  if (qualification.underReview) return "pred.prize.review";
  return "pred.prize.pending";
}

function i18nSpan(key) {
  const span = document.createElement("span");
  setText(span, key);

async function authedFetch(path, options) {
  const token = await UrbanoAuth.getAccessToken();
  const headers = Object.assign({ "content-type": "application/json" }, (options && options.headers) || {});
  if (token) headers.authorization = "Bearer " + token;
  const res = await fetch(path, Object.assign({}, options, { headers }));
  const json = await res.json().catch(() => null);
  return { status: res.status, json };
}

function haversineMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const toRad = (d) => (d * Math.PI) / 180;
  const dLat = toRad(lat2 - lat1);
  const dLon = toRad(lon2 - lon1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// Predictions-v2: the single shared display-format helper for a
// (regulation, stoppage) Goal-Time pair — used for both the authoring
// form's own state and the finalized-result recap, so the two views
// cannot semantically diverge. Regulation null means No Goal.
// Stoppage is only ever non-null when regulation is 45 or 90.
// Returns either the minute text or a { $t: key } marker that is translated when it is drawn.
function formatGoalMinute(regulation, stoppage) {
  if (regulation === null || regulation === undefined) return { $t: "pred.noGoal" };
  return stoppage ? `${regulation}+${stoppage}'` : `${regulation}'`;
}

function findPlayerName(match, playerId) {
  if (!playerId) return null;
  const pools = [
    (match.homeTeam && match.homeTeam.players) || [],
    (match.awayTeam && match.awayTeam.players) || [],
  ];
  for (const pool of pools) {
    const found = pool.find((p) => p.playerId === playerId);
    if (found) return found.name;
  }
  return null;
}

function getCurrentPosition() {
  return new Promise((resolve) => {
    if (!navigator.geolocation) { resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve({ latitude: pos.coords.latitude, longitude: pos.coords.longitude, accuracyMeters: pos.coords.accuracy }),
      () => resolve(null),
      { enableHighAccuracy: true, timeout: 10000 }
    );
  });
}

// ---------------------------------------------------------------------------------------------------------------------
// URBANO Score — the progressive prediction (PROGRESSIVE_LADDER_V1): a stepper over the ladder.
//
//   1 Easy: exact scoreline · 2 Medium: first team to score · 3 Hard: any goalscorer · 4 Legendary: any goal minute.
//
// A person completes the levels in order, can send after completing any of them, and can go back and edit. The stepper ends at the
// highest level this venue OFFERS (the server and the database enforce the same limit; hiding steps is only the display). What is
// sent is exactly the levels up to the one chosen at the moment of sending: answers above it never leave the browser and are
// cleared once the choice is saved. A level that was not reached is not an answer; "no team / no player / no minute" is an answer.
// Nothing here says a prize was won: the panel only describes what is possible.
// ---------------------------------------------------------------------------------------------------------------------
const LADDER_LEVELS = [1, 2, 3, 4];

// A refusal the person must still see after the list is rebuilt (for example "the prizes changed"): kept by match until it is shown once.
const ladderNotices = new Map();

// ==== local draft storage (sessionStorage) — begin ====
// Unsent answers survive a reload of THIS TAB in the browser's session storage, and nowhere else: never persistent storage, never a server,
// never a token, a credential or an e-mail address. A draft holds only the person's own answers plus what it must be bound to: the
// member, the match, the venue activation, the contract and the fingerprint of the prize offer the answers were given under. It is
// restored only when ALL of those still hold (see judgeLadderDraft); restoring puts answers back in the form and nothing more — it
// never sends and never saves a prediction. A draft that cannot be read, or does not have exactly the expected shape, is dropped.
// If the browser refuses to store anything, the page works the same and asks before it is left with answers that exist nowhere else.
const LADDER_DRAFT_PREFIX = "urbano.score.draft.";
const LADDER_DRAFT_VERSION = 1;

  if (!storage) return;
  try { storage.removeItem(key); } catch (err) { /* nothing to remove */ }
}
// The draft stored under `key`, rebuilt from only the fields it may carry, or null (and removed) when it is corrupt or not this member's.
function readLadderDraft(key, memberId, matchId) {
  const storage = ladderSessionStorage();
  if (!storage) return null;
  let raw;
  try { raw = storage.getItem(key); } catch (err) { return null; }
  if (raw === null || raw === undefined) return null;
  const drop = () => { removeLadderDraft(key); return null; };
  if (typeof raw !== "string" || raw.length > 4000) return drop();
  let d;
  try { d = JSON.parse(raw); } catch (err) { return drop(); }
  if (!d || typeof d !== "object" || Array.isArray(d)) return drop();
  const a = d.a;
  const digits = (v) => typeof v === "string" && /^\d{0,9}$/.test(v);
  const ok =
    d.v === LADDER_DRAFT_VERSION && d.memberId === memberId && d.matchId === matchId && d.contract === "PROGRESSIVE_LADDER_V1" &&
    typeof d.activationId === "string" && d.activationId.length > 0 && d.activationId.length <= 64 &&
    typeof d.offerDigest === "string" && /^[0-9a-f]{64}$/.test(d.offerDigest) &&
    Number.isInteger(d.step) && d.step >= 1 && d.step <= 4 &&
    (d.baseUpdatedAt === null || (typeof d.baseUpdatedAt === "string" && d.baseUpdatedAt.length <= 64)) &&
    a && typeof a === "object" && !Array.isArray(a) &&
    digits(a.home) && digits(a.away) && digits(a.minute) && digits(a.stoppage) &&
    (a.first === "" || a.first === "HOME" || a.first === "AWAY" || a.first === "NONE") &&
    typeof a.scorer === "string" && (a.scorer === "" || a.scorer === "NONE" || /^[A-Za-z0-9_-]{1,64}$/.test(a.scorer)) &&
    typeof a.minuteNone === "boolean";

    activationId: d.activationId, offerDigest: d.offerDigest, step: d.step, baseUpdatedAt: d.baseUpdatedAt,
    a: { home: a.home, away: a.away, first: a.first, scorer: a.scorer, minuteNone: a.minuteNone, minute: a.minute, stoppage: a.stoppage },

// true when the draft was stored, false when the browser would not (or could not) keep it.
function writeLadderDraft(key, memberId, matchId, draft) {
  const storage = ladderSessionStorage();
  if (!storage) return false;
  try {
    storage.setItem(key, JSON.stringify({
      v: LADDER_DRAFT_VERSION, memberId, matchId, contract: "PROGRESSIVE_LADDER_V1",
      activationId: draft.activationId, offerDigest: draft.offerDigest, step: draft.step, baseUpdatedAt: draft.baseUpdatedAt,
      a: draft.a, savedAt: new Date().toISOString(),
    }));
    return true;
  } catch (err) { return false; }
}
// Removes the drafts this page stored: all of them (keepMemberId null: nobody is signed in, or the person changed or signed out), or
// every draft that is not this member's, or this member's draft of a match that is no longer open (keepMatchIds given).
function purgeLadderDrafts(keepMemberId, keepMatchIds) {
  const storage = ladderSessionStorage();
  if (!storage) return;
  try {
    const keys = [];
    for (let i = 0; i < storage.length; i++) {
      const key = storage.key(i);
      if (typeof key === "string" && key.indexOf(LADDER_DRAFT_PREFIX) === 0) keys.push(key);
    }
    for (const key of keys) {
      const [member, match] = key.slice(LADDER_DRAFT_PREFIX.length).split(".");
      const keep = keepMemberId !== null && member === keepMemberId && (!keepMatchIds || keepMatchIds.has(match));
      if (!keep) storage.removeItem(key);
    }
  } catch (err) { /* nothing more can be done */ }

// ==== local draft storage (sessionStorage) — end ====

// What to do with a stored draft, given the venues now on offer and what the server has saved:
//   "none"     no draft
//   "restore"  every binding still holds: put the answers back (nothing is sent or saved)
//   "offer"    the venue or the prize offer is not the one the answers were given under: drop it and say so
//   "conflict" a prediction is saved and the draft does not start from it (for example it was saved from another device): do not
//              apply it over what is saved without the person's explicit choice
//   "invalid"  a draft that claims to start from a saved prediction that does not exist
function judgeLadderDraft(draft, activations, saved) {
  if (!draft) return "none";
  const activation = activations.find((x) => x.venueActivationId === draft.activationId);
  if (!activation || activation.offer.digest !== draft.offerDigest) return "offer";
  if (saved) {
    if (saved.venueActivationId !== draft.activationId) return "offer"; // answered for another venue than the one the entry is saved at
    return draft.baseUpdatedAt === saved.updatedAt ? "restore" : "conflict";

// Forms whose answers exist only in this page (the browser would not store the draft). Leaving the page asks for confirmation while any.
const ladderUnsent = new Set();
window.addEventListener("beforeunload", (event) => {
  if (ladderUnsent.size === 0) return undefined;
  event.preventDefault();
  event.returnValue = "";
  return "";
});

// Answers above the highest level a venue offers belong to no participation there, so a draft never carries them back.
function ladderTrimToOffer(a, maxLevel) {

  if (maxLevel < 3) a.scorer = "";
  if (maxLevel < 4) { a.minute = ""; a.stoppage = ""; a.minuteNone = false; }
}
function blankLadderAnswers() {
  return { home: "", away: "", first: "", scorer: "", minuteNone: false, minute: "", stoppage: "" };
}
function wholeNumberOrNull(value) {
  const text = String(value === null || value === undefined ? "" : value).trim();
  return /^\d{1,9}$/.test(text) ? parseInt(text, 10) : null;
}
function ladderStepComplete(a, level) {
  if (level === 1) return wholeNumberOrNull(a.home) !== null && wholeNumberOrNull(a.away) !== null;
  if (level === 2) return a.first === "HOME" || a.first === "AWAY" || a.first === "NONE";
  if (level === 3) return a.scorer === "NONE" || (typeof a.scorer === "string" && a.scorer.length > 0);
  if (level === 4) {
    if (a.minuteNone) return true;
    const minute = wholeNumberOrNull(a.minute);
    if (minute === null || minute < 1 || minute > 90) return false;
    if (String(a.stoppage).trim() === "") return true;
    const stoppage = wholeNumberOrNull(a.stoppage);
    return stoppage !== null && stoppage >= 1 && (minute === 45 || minute === 90);
  }
  return false;
}
// How many levels, in order from the first, are complete (never more than the venue offers).
function ladderCompletedLevel(a, maxLevel) {
  let level = 0;
  while (level < maxLevel && ladderStepComplete(a, level + 1)) level += 1;
  return level;
}
// The request for exactly the levels up to `level`. A category above it is absent, never null.
function ladderPayload(a, level) {
  const body = { attemptedLevel: level, scoreline: { home: wholeNumberOrNull(a.home), away: wholeNumberOrNull(a.away) } };
  if (level >= 2) body.firstTeam = a.first === "NONE" ? { kind: "NONE" } : { kind: "PICKED", team: a.first };
  if (level >= 3) body.goalscorer = a.scorer === "NONE" ? { kind: "NONE" } : { kind: "PICKED", playerId: a.scorer };
  if (level >= 4) {
    body.goalMinute = a.minuteNone
      ? { kind: "NONE" }
      : { kind: "PICKED", regulation: wholeNumberOrNull(a.minute), stoppage: String(a.stoppage).trim() === "" ? null : wholeNumberOrNull(a.stoppage) };
  }

}
// Answers a saved prediction (explicit form from the server) back into the form's own state.
function ladderAnswersFromSaved(view) {
  const a = blankLadderAnswers();
  a.home = String(view.scoreline.home);
  a.away = String(view.scoreline.away);
  if (view.firstTeam) a.first = view.firstTeam.kind === "NONE" ? "NONE" : view.firstTeam.team;
  if (view.goalscorer) a.scorer = view.goalscorer.kind === "NONE" ? "NONE" : view.goalscorer.playerId;
  if (view.goalMinute) {
    if (view.goalMinute.kind === "NONE") a.minuteNone = true;

// What was answered at a level, as text or a { $t } marker translated when drawn. Team and player names are data.
function ladderAnswerValue(match, answer, level) {

  const awayName = match.awayTeam ? match.awayTeam.name : null;
  if (level === 2) {
    if (answer.first === "NONE") return { $t: "pred.ladder.none.first" };
    if (answer.first === "HOME") return homeName === null ? { $t: "pred.home" } : homeName;
    return awayName === null ? { $t: "pred.away" } : awayName;

function ladderRowVars(match, a, level) {

const LADDER_ANSWER_KEYS = { 1: "pred.ladder.ans.score", 2: "pred.ladder.ans.first", 3: "pred.ladder.ans.scorer", 4: "pred.ladder.ans.minute" };

function ladderSelectedOffer(activations, activationId) {

function buildLadderForm(match, mine, authState, activations, options) {
  const matchId = match.matchId;
  const memberId = authState.gamingMemberId;

    dec.addEventListener("click", () => { const now = wholeNumberOrNull(input.value); setValue(now === null ? 0 : Math.max(0, now - 1)); });
    inc.addEventListener("click", () => { const now = wholeNumberOrNull(input.value); setValue(now === null ? 0 : now + 1); });
    input.addEventListener("input", () => { st.a[side] = input.value; afterEdit(); });
    controls.append(dec, input, inc);
    box.append(name, controls);
    return box;
  }

  function renderBody() {
    bodyHost.replaceChildren();
    const level = st.step;
    const title = document.createElement("h3");
    title.tabIndex = -1;
    title.setAttribute("data-ladder-title", String(level));
    setText(title, "pred.ladder.q." + level);
    const hint = document.createElement("p");
    hint.className = "ladder-hint";
    setText(hint, "pred.ladder.hint." + level);
    bodyHost.append(title, hint);

    if (level === 1) {
      const row = document.createElement("div");
      row.className = "score-stepper-row";
      row.append(scoreStepper("home", homeLabel), scoreStepper("away", awayLabel));
      bodyHost.appendChild(row);
      return;
    }

    if (level === 2) {
      const row = document.createElement("div");
      row.className = "team-toggle-row is-wrap";
      row.setAttribute("role", "group");
      const options = [["HOME", homeLabel, null], ["AWAY", awayLabel, null], ["NONE", null, "pred.ladder.none.first"]];
      for (const [value, label, key] of options) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "team-toggle";
        button.setAttribute("data-value", value);
        button.setAttribute("aria-pressed", st.a.first === value ? "true" : "false");
        if (key) setText(button, key); else button.textContent = label;
        button.addEventListener("click", () => {
          st.a.first = value;
          for (const other of row.querySelectorAll(".team-toggle")) other.setAttribute("aria-pressed", other.getAttribute("data-value") === value ? "true" : "false");
          afterEdit();
        });
        row.appendChild(button);
      }
      bodyHost.appendChild(row);
      const note = document.createElement("p");
      note.className = "ladder-hint ladder-none";
      setText(note, "pred.ladder.noneNote");
      bodyHost.appendChild(note);
      return;
    }

    if (level === 3) {
      const field = document.createElement("div");
      field.className = "field";
      const scorerSelect = document.createElement("select");
      scorerSelect.id = `ladder-scorer-${matchId}`;
      const placeholder = document.createElement("option");
      placeholder.value = "";
      setText(placeholder, "pred.ladder.scorerPlaceholder");
      scorerSelect.appendChild(placeholder);
      const none = document.createElement("option");
      none.value = "NONE";
      setText(none, "pred.ladder.none.scorer");
      scorerSelect.appendChild(none);
      for (const [teamLabel, players] of [[homeLabel, match.homeTeam ? match.homeTeam.players : []], [awayLabel, match.awayTeam ? match.awayTeam.players : []]]) {
        const group = document.createElement("optgroup");
        group.label = teamLabel;
        for (const player of players) {
          const option = document.createElement("option");
          option.value = player.playerId;
          option.textContent = player.name;
          group.appendChild(option);
        }
        scorerSelect.appendChild(group);
      }
      scorerSelect.value = st.a.scorer;
      if (scorerSelect.value !== st.a.scorer) { st.a.scorer = ""; scorerSelect.value = ""; }
      scorerSelect.addEventListener("change", () => { st.a.scorer = scorerSelect.value; afterEdit(); });
      field.appendChild(scorerSelect);
      bodyHost.appendChild(field);
      const note = document.createElement("p");
      note.className = "ladder-hint ladder-none";
      setText(note, "pred.ladder.noneNote");
      bodyHost.appendChild(note);
      return;
    }

    // level 4: a minute, or the explicit "no goals" answer
    const field = document.createElement("div");
    field.className = "field";
    const label = document.createElement("label");
    setText(label, "pred.ladder.minuteLabel");
    const row = document.createElement("div");
    row.className = "score-row";
    const minute = document.createElement("input");
    minute.type = "number"; minute.min = "1"; minute.max = "90"; minute.inputMode = "numeric";
    minute.id = `ladder-minute-${matchId}`;
    minute.setAttribute("data-i18n-attr", "placeholder:pred.ladder.minutePlaceholder");
    minute.placeholder = t("pred.ladder.minutePlaceholder");
    minute.value = st.a.minute;
    const plus = document.createElement("span");
    plus.className = "score-vs";
    plus.textContent = "+";
    const stoppage = document.createElement("input");
    stoppage.type = "number"; stoppage.min = "1"; stoppage.inputMode = "numeric";
    stoppage.id = `ladder-stoppage-${matchId}`;
    stoppage.setAttribute("data-i18n-attr", "placeholder:pred.f.stoppagePlaceholder");
    stoppage.placeholder = t("pred.f.stoppagePlaceholder");
    stoppage.value = st.a.stoppage;
    const noneButton = document.createElement("button");
    noneButton.type = "button";
    noneButton.className = "team-toggle ladder-none";
    noneButton.setAttribute("aria-pressed", st.a.minuteNone ? "true" : "false");
    setText(noneButton, "pred.ladder.none.minute");
    function syncMinuteControls() {
      const m = wholeNumberOrNull(minute.value);
      const boundary = m === 45 || m === 90;
      stoppage.disabled = st.a.minuteNone || !boundary;
      if (stoppage.disabled && !st.a.minuteNone) { stoppage.value = ""; st.a.stoppage = ""; }
      minute.disabled = st.a.minuteNone;
      noneButton.setAttribute("aria-pressed", st.a.minuteNone ? "true" : "false");
    }
    minute.addEventListener("input", () => { st.a.minute = minute.value; st.a.minuteNone = false; syncMinuteControls(); afterEdit(); });
    stoppage.addEventListener("input", () => { st.a.stoppage = stoppage.value; afterEdit(); });
    noneButton.addEventListener("click", () => {
      st.a.minuteNone = !st.a.minuteNone;
      if (st.a.minuteNone) { st.a.minute = ""; st.a.stoppage = ""; minute.value = ""; stoppage.value = ""; }
      syncMinuteControls();
      afterEdit();
    });
    syncMinuteControls();
    row.append(minute, plus, stoppage);
    const stoppageHint = document.createElement("p");
    stoppageHint.className = "msg";
    setText(stoppageHint, "pred.f.minuteHint");
    const note = document.createElement("p");
    note.className = "ladder-hint ladder-none";
    setText(note, "pred.ladder.noneNote");
    field.append(label, row, stoppageHint);
    bodyHost.append(field, noneButton, note);
  }

  // --- the panel: what is possible, never what was won ---
  function renderPanel() {
    const offer = activationNow().offer;
    const completed = ladderCompletedLevel(st.a, offer.maxLevel);
    panelHost.replaceChildren();
    const current = document.createElement("p");
    current.className = "ladder-current";
    setText(current, "pred.ladder.current", { level: { $t: "pred.ladder.level." + st.step } });
    panelHost.appendChild(current);
    const max = document.createElement("p");
    // The prize described is that of the level this step would send with: the step's own level once it is answered, otherwise the
    // last level that is complete. It is the highest prize that attempt can reach — never a prize already won.
    const sendLevel = Math.min(st.step, completed);
    if (sendLevel >= 1) {
      setText(max, "pred.ladder.max", { prize: offer.levels[sendLevel - 1].label, condition: { $t: "pred.ladder.cond." + sendLevel } });
    } else {
      setText(max, "pred.ladder.needAnswer");
    }
    panelHost.appendChild(max);
    const claim = document.createElement("p");
    claim.className = "ladder-hint";
    setText(claim, "pred.ladder.noClaim");
    panelHost.appendChild(claim);
    const title = document.createElement("p");
    title.className = "ladder-offers-title";
    setText(title, "pred.ladder.offers");
    const list = document.createElement("ul");
    list.className = "ladder-offers";
    for (const entry of offer.levels) {
      const item = document.createElement("li");
      setText(item, "pred.ladder.offerRow", { n: entry.level, name: { $t: "pred.ladder.name." + entry.level }, prize: entry.label });
      list.appendChild(item);
    }
    panelHost.append(title, list);
  }

  // --- actions and review ---
  function button(kind, key, vars, onClick, disabled) {
    const node = document.createElement("button");
    node.type = "button";
    node.className = kind;
    node.disabled = !!disabled;
    setText(node, key, vars);
    node.addEventListener("click", onClick);
    return node;
  }

  function renderActions() {
    actionsHost.replaceChildren();
    const offer = activationNow().offer;
    const completed = ladderCompletedLevel(st.a, offer.maxLevel);
    if (st.view === "review") {
      actionsHost.append(
        button("btn-secondary", "pred.ladder.btn.edit", null, () => { st.view = "edit"; st.step = st.declared; renderAll(); }, st.busy),
        button("btn-primary", "pred.ladder.btn.confirm", null, confirmSend, st.busy)
      );
      return;
    }
    const complete = completed >= st.step;
    if (st.step > 1) actionsHost.appendChild(button("btn-secondary", "pred.ladder.btn.back", null, () => { st.step -= 1; renderAll(); }, st.busy));
    if (st.step < offer.maxLevel) {
      actionsHost.appendChild(button("btn-secondary", "pred.ladder.btn.continue", { n: st.step + 1 }, () => { st.step += 1; renderAll(); }, st.busy || !complete));
    }
    actionsHost.appendChild(
      button("btn-primary", st.saved ? "pred.ladder.btn.save" : "pred.ladder.btn.send", { n: st.step }, () => { st.declared = st.step; st.view = "review"; renderAll(); }, st.busy || !complete)
    );
    if (!complete) {
      const need = document.createElement("p");
      need.className = "msg";
      setText(need, st.step === 1 ? "pred.ladder.needAnswer" : "pred.ladder.needThis");
      actionsHost.appendChild(need);
    }
  }

  function renderReview() {
    if (st.view !== "review") { reviewHost.hidden = true; reviewHost.replaceChildren(); return; }
    const offer = activationNow().offer;
    reviewHost.hidden = false;
    reviewHost.className = "ladder-review";
    reviewHost.replaceChildren();
    const title = document.createElement("h3");
    setText(title, "pred.ladder.review.title");
    const level = document.createElement("p");
    setText(level, "pred.ladder.review.level", { n: st.declared, name: { $t: "pred.ladder.name." + st.declared } });
    const list = document.createElement("ul");
    for (let n = 1; n <= st.declared; n++) {
      const item = document.createElement("li");
      setText(item, LADDER_ANSWER_KEYS[n], ladderRowVars(match, st.a, n));
      list.appendChild(item);
    }
    reviewHost.append(title, level, list);
    const prize = document.createElement("p");
    setText(prize, "pred.ladder.max", { prize: offer.levels[st.declared - 1].label, condition: { $t: "pred.ladder.cond." + st.declared } });
    reviewHost.appendChild(prize);
    if (st.declared < offer.maxLevel) {
      const notSent = document.createElement("p");
      setText(notSent, "pred.ladder.review.notSent");
      reviewHost.appendChild(notSent);
    }
    if (st.saved && st.saved.attemptedLevel > st.declared) {
      const warn = document.createElement("p");
      warn.className = "msg error";
      setText(warn, "pred.ladder.reduceWarning", { saved: st.saved.attemptedLevel, n: st.declared });
      reviewHost.appendChild(warn);
    }
    const editable = document.createElement("p");
    editable.className = "ladder-hint";
    setText(editable, "pred.ladder.review.editable");
    reviewHost.appendChild(editable);
  }

  function renderAll() {
    clampStep();
    renderStatus();
    renderSteps();
    const editing = st.view === "edit";
    bodyHost.hidden = !editing;
    panelHost.hidden = false;
    if (editing) renderBody(); else bodyHost.replaceChildren();
    renderPanel();
    renderReview();
    renderActions();
  }
  function afterEdit() {
    persist();
    renderStatus();
    renderSteps();
    renderPanel();
    renderActions();
    setMessage(null);
  }

  // --- sending ---
  async function confirmSend() {
    if (st.busy) return;
    st.busy = true;
    renderAll();
    setMessage("pred.submitting");
    const declared = st.declared;
    try {
      const position = await getCurrentPosition();
      if (!position) { setMessage("pred.locationRequired", null, "error"); return; }
      lastPosition = position;
      showGeo();
      const offer = activationNow().offer;
      const body = Object.assign(ladderPayload(st.a, declared), {
        venueActivationId: st.activationId,
        offerDigest: offer.digest,
        latitude: position.latitude,
        longitude: position.longitude,
        accuracyMeters: position.accuracyMeters,
      });
      const result = await authedFetch(`/api/gaming/predictions/matches/${matchId}/predict`, { method: "POST", body: JSON.stringify(body) });
      if (result.status === 201 && result.json && result.json.prediction) {
        st.saved = result.json.prediction;
        select.disabled = true;
        // What was not sent does not stay behind: the answers above the chosen level are cleared here as they are on the server.
        const kept = blankLadderAnswers();
        const fromServer = ladderAnswersFromSaved(st.saved);
        Object.assign(kept, fromServer);
        st.a = kept;
        st.view = "edit";
        st.step = declared;
        removeLadderDraft(draftKey); // saved: nothing is left unsent, and nothing above the chosen level is kept anywhere
        ladderUnsent.delete(draftKey);
        setMessage("pred.ladder.saved", { n: declared, name: { $t: "pred.ladder.name." + declared } }, "success");
      } else {
        persist();
        const raw = result.json && result.json.error ? String(result.json.error) : null;
        if (raw) { msgNode.className = "msg error"; setServerMessage(msgNode, raw); } else setMessage("pred.failed", null, "error");
        if (result.status === 409 && raw && UrbanoI18n.serverMessageKey(raw) === "pred.srv.offerChanged") {
          // The offer changed since the page loaded: show the current one on the rebuilt form and say so. The draft was answered under
          // the old offer, so it is not restored there.
          ladderNotices.set(matchId, raw);
          refresh().catch(() => {});
        }
        // The review stays open: a retry is one tap, and "back to editing" is one tap.
      }
    } catch (err) {
      persist();
      setMessage("pred.failed", null, "error");
    } finally {
      st.busy = false;
      renderAll();
    }
  }

  renderAll();
  if (restored === "draft") setMessage("pred.ladder.draftRestored", null, null);
  else if (restored === "overSaved") setMessage("pred.ladder.draftRestoredOverSaved", null, null);
  const offerNotice = ladderNotices.get(matchId);
  ladderNotices.delete(matchId);
  if (offerNotice) {
    msgNode.className = "msg error";
    setServerMessage(msgNode, offerNotice);
  }
  if (discardedByOffer) {
    const discarded = document.createElement("p");
    discarded.className = "msg";
    discarded.setAttribute("data-ladder-discarded", "true");
    setText(discarded, "pred.ladder.draftDiscardedOffer");
    msgNode.insertAdjacentElement("afterend", discarded);
  }
  if (restored) persist();
  return form;
}

// A local draft that does not start from the prediction now saved on the server. Nothing is applied and nothing is sent: the person
// chooses between keeping what is saved (the draft is discarded) and working from the draft (still unsent until they confirm).
function buildLadderConflict(match, mine, authState, activations, stored, saved) {
  const draftLevel = Math.max(1, ladderCompletedLevel(stored.a, 4));
  // Both lines carry the scoreline, so the person can tell the two versions apart even when they reach the same level.
  const savedVars = { n: saved.attemptedLevel, name: { $t: "pred.ladder.name." + saved.attemptedLevel }, score: saved.scoreline.home + "–" + saved.scoreline.away };
  const draftVars = { n: draftLevel, name: { $t: "pred.ladder.name." + draftLevel }, score: (stored.a.home || "?") + "–" + (stored.a.away || "?") };
  const panel = el(`<div class="ladder-conflict" data-ladder-conflict>
    <h3 ${ix("pred.ladder.conflict.title")}>${tx("pred.ladder.conflict.title")}</h3>
    <p ${ix("pred.ladder.conflict.text")}>${tx("pred.ladder.conflict.text")}</p>
    <ul>
      <li ${ix("pred.ladder.conflict.savedLine", savedVars)}>${tx("pred.ladder.conflict.savedLine", savedVars)}</li>
      <li ${ix("pred.ladder.conflict.draftLine", draftVars)}>${tx("pred.ladder.conflict.draftLine", draftVars)}</li>
    </ul>
    <div class="ladder-actions">
      <button type="button" class="btn-secondary" data-conflict-keep ${ix("pred.ladder.conflict.keep")}>${tx("pred.ladder.conflict.keep")}</button>
      <button type="button" class="btn-secondary" data-conflict-use ${ix("pred.ladder.conflict.use")}>${tx("pred.ladder.conflict.use")}</button>
    </div>
  </div>`);
  const resolve = (conflictChoice) => panel.replaceWith(buildLadderForm(match, mine, authState, activations, { conflictChoice }));
  panel.querySelector("[data-conflict-keep]").addEventListener("click", () => resolve("keep"));
  panel.querySelector("[data-conflict-use]").addEventListener("click", () => resolve("use"));
  return panel;
}

// The finalized result of a progressive prediction: the level attempted, the level won (never above it), one outcome per category in
// the ladder's order — right, missed, or NOT attempted, which is none of the first two — and the single prize of the won level.
function buildLadderResult(match, mine) {
  const ev = mine.evaluation;
  const pred = mine.prediction;
  const attempted = ev.attemptedLevel;
  const won = ev.ladderLevel;
  const outcomes = [ev.scorelineCorrect, ev.firstTeamToScoreCorrect, ev.goalscorerCorrect, ev.goalMinuteCorrect];
  const wrap = document.createElement("div");
  const summary = document.createElement("p");
  summary.className = won >= 1 ? "msg success" : "msg";
  if (won >= 1) setText(summary, "pred.ladder.result.won", { attempted: { $t: "pred.ladder.level." + attempted }, won: { $t: "pred.ladder.level." + won } });
  else setText(summary, "pred.ladder.result.none", { attempted: { $t: "pred.ladder.level." + attempted } });
  const grid = document.createElement("div");
  grid.className = "dimension-grid";
  outcomes.forEach((outcome, index) => {
    const level = index + 1;
    const cell = document.createElement("div");
    cell.className = "dimension-cell " + (outcome === true ? "correct" : outcome === false ? "incorrect" : "not-attempted");
    const label = document.createElement("div");
    label.className = "label";
    setText(label, "pred.ladder.dim." + level);
    const mark = document.createElement("div");
    mark.className = "mark";
    mark.textContent = outcome === true ? "✓" : outcome === false ? "✗" : "–";
    const state = document.createElement("div");
    state.className = "state-text";
    setText(state, outcome === true ? "pred.ladder.state.correct" : outcome === false ? "pred.ladder.state.wrong" : "pred.ladder.state.notAttempted");
    cell.append(label, mark, state);
    grid.appendChild(cell);
  });
  const list = document.createElement("ul");
  list.className = "ladder-offers";
  const answers = ladderAnswersFromSaved(pred);
  for (let n = 1; n <= attempted; n++) {
    const item = document.createElement("li");
    setText(item, LADDER_ANSWER_KEYS[n], ladderRowVars(match, answers, n));
    list.appendChild(item);
  }
  const prizeSlot = document.createElement("div");
  prizeSlot.setAttribute("data-prize-slot", "");
  if (mine.qualification) prizeSlot.appendChild(buildPrizeQualifiedLine(match, mine.qualification));
  wrap.append(summary, grid, prizeSlot, list);
  return wrap;
}

function renderProgressive(card, body, match, mine, authState, kickoffPassed) {
  // Once the match is closed (kick-off passed or a result exists) an unsent draft can no longer become a prediction: it is dropped.
  if (kickoffPassed || match.finalized) removeLadderDraft(ladderDraftKey(authState.gamingMemberId, match.matchId));
  if (match.finalized && mine.evaluation && mine.prediction) {
    body.appendChild(buildLadderResult(match, mine));
    return card;
  }
  if (kickoffPassed || match.finalized) {
    if (mine.prediction) {
      const vars = { n: mine.prediction.attemptedLevel, name: { $t: "pred.ladder.name." + mine.prediction.attemptedLevel } };
      body.appendChild(el(`<p class="msg" ${ix("pred.ladder.awaiting", vars)}>${tx("pred.ladder.awaiting", vars)}</p>`));
    } else {
      body.appendChild(el(`<p class="msg" ${ix("pred.missed")}>${tx("pred.missed")}</p>`));
    }
    return card;
  }
  // Only an activation whose offer is valid (a consecutive prefix of prizes starting at Easy) takes participations.
  const activations = (match.venueActivations || []).filter((a) => a.enabled && a.venue && a.venue.active && a.offer && a.offer.available);
  if (activations.length === 0) {
    removeLadderDraft(ladderDraftKey(authState.gamingMemberId, match.matchId));
    body.appendChild(el(`<p class="msg" ${ix("pred.ladder.noOffer")}>${tx("pred.ladder.noOffer")}</p>`));
    return card;
  }
  body.appendChild(buildLadderForm(match, mine, authState, activations));
  return card;
}

async function renderMatch(match) {
  const authState = await UrbanoAuth.getState();
  const kickoffPassed = new Date() >= new Date(match.kickoffAt);

  // Team names are data. When a team is missing the page falls back to a generic label (translated), never to a guessed name.
  const homeTeamName = esc(match.homeTeam ? match.homeTeam.name : t("pred.home"));
  const awayTeamName = esc(match.awayTeam ? match.awayTeam.name : t("pred.away"));

  const card = el(`<div class="card accent" data-match-id="${esc(match.matchId)}">
    <div class="match-teams"><span>${homeTeamName}</span><span class="match-vs" ${ix("pred.vs")}>${tx("pred.vs")}</span><span>${awayTeamName}</span></div>
    <div class="match-meta"><span>${esc(match.competition)}</span><span data-kickoff="${esc(match.kickoffAt)}">${esc(formatKickoff(match.kickoffAt))}</span></div>
    <div id="match-body-${match.matchId}"></div>
  </div>`);
  const body = card.querySelector(`#match-body-${match.matchId}`);

  if (match.finalized) {
    body.appendChild(el(`<span class="status-pill" ${ix("pred.result", { home: match.finalResult.homeScore, away: match.finalResult.awayScore })}>${tx("pred.result", { home: match.finalResult.homeScore, away: match.finalResult.awayScore })}</span>`));
  } else if (kickoffPassed) {
    body.appendChild(el(`<span class="status-pill bad" ${ix("pred.locked")}>${tx("pred.locked")}</span>`));
  }

  if (authState.status !== "authenticated") {
    // Not signed in (or signed in but the account is not finished): one clear next step that remembers THIS match, so after
    // logging in the person lands back here, not on a generic page. The words follow the state of the match: only an OPEN match
    // invites a prediction. A closed match (kick-off passed) offers access to an existing participation, and a finalized one access to
    // the results. This text changes nothing the server decides.
    const unfinished = authState.status === "profile_incomplete";
    const phase = match.finalized ? "final" : kickoffPassed ? "closed" : "open";
    const promptKey = phase === "open"
      ? (unfinished ? "pred.login.unfinished" : "pred.login.prompt")
      : (unfinished ? "pred.login.unfinishedView" : phase === "closed" ? "pred.login.promptClosed" : "pred.login.promptFinal");
    const buttonKey = unfinished ? "pred.login.finishBtn" : phase === "open" ? "pred.login.btn" : "pred.login.btnView";
    const entry = el(`<div>
      <p class="msg" ${ix(promptKey)}>${tx(promptKey)}</p>
      <button type="button" class="btn-primary" data-login-cta ${ix(buttonKey)}>${tx(buttonKey)}</button>
    </div>`);
    entry.querySelector("[data-login-cta]").addEventListener("click", () => (phase === "open" ? openAccountEntry(match.matchId) : openAccountToView(match.matchId)));
    body.appendChild(entry);
    return card;
  }

  const mineRes = await authedFetch(`/api/gaming/predictions/matches/${match.matchId}/mine`);
  const mine = mineRes.json || {};

  if (match.predictionContract === "PROGRESSIVE_LADDER_V1") {
    return renderProgressive(card, body, match, mine, authState, kickoffPassed);
  }

  if (match.finalized && mine.evaluation) {
    const ev = mine.evaluation;
    const pred = mine.prediction;
    const scorerName = findPlayerName(match, pred.predictedGoalscorerPlayerId);
    const homeName = match.homeTeam ? match.homeTeam.name : null;
    const awayName = match.awayTeam ? match.awayTeam.name : null;
    const firstTeamVar =
      pred.predictedFirstTeamToScore === "HOME" ? (homeName === null ? { $t: "pred.home" } : homeName) :
      pred.predictedFirstTeamToScore === "AWAY" ? (awayName === null ? { $t: "pred.away" } : awayName) : { $t: "pred.noGoal" };
    const yoursVars = {
      home: pred.predictedHomeScore,
      away: pred.predictedAwayScore,
      scorer: scorerName || { $t: "pred.noGoalscorer" },
      minute: formatGoalMinute(pred.predictedGoalMinuteRegulation, pred.predictedGoalMinuteStoppage),
      first: firstTeamVar,
    };
    // el() returns only firstElementChild — every sibling after the
    // dimension-grid div must live inside ONE wrapper, or it is
    // silently dropped rather than appended.
    body.appendChild(el(`
      <div>
        <div class="dimension-grid">
          <div class="dimension-cell ${ev.scorelineCorrect ? "correct" : "incorrect"}"><div class="label" ${ix("pred.dim.scoreline")}>${tx("pred.dim.scoreline")}</div><div class="mark">${ev.scorelineCorrect ? "✓" : "✗"}</div></div>
          <div class="dimension-cell ${ev.goalscorerCorrect ? "correct" : "incorrect"}"><div class="label" ${ix("pred.dim.goalscorer")}>${tx("pred.dim.goalscorer")}</div><div class="mark">${ev.goalscorerCorrect ? "✓" : "✗"}</div></div>
          <div class="dimension-cell ${ev.goalMinuteCorrect ? "correct" : "incorrect"}"><div class="label" ${ix("pred.dim.goalMinute")}>${tx("pred.dim.goalMinute")}</div><div class="mark">${ev.goalMinuteCorrect ? "✓" : "✗"}</div></div>
          <div class="dimension-cell ${ev.firstTeamToScoreCorrect ? "correct" : "incorrect"}"><div class="label" ${ix("pred.dim.firstScorer")}>${tx("pred.dim.firstScorer")}</div><div class="mark">${ev.firstTeamToScoreCorrect ? "✓" : "✗"}</div></div>
        </div>
        <p class="msg success" ${ix("pred.correctCount", { n: ev.correctDimensionCount })}>${tx("pred.correctCount", { n: ev.correctDimensionCount })}</p>
        <div data-prize-slot></div>
        <p class="msg" ${ix("pred.yours.full", yoursVars)}>${tx("pred.yours.full", yoursVars)}</p>
      </div>
    `));
    if (mine.qualification) {
      body.querySelector("[data-prize-slot]").appendChild(buildPrizeQualifiedLine(match, mine.qualification));
    }
    return card;
  }

  if (kickoffPassed) {
    if (mine.prediction) {
      const vars = { home: mine.prediction.predictedHomeScore, away: mine.prediction.predictedAwayScore };
      body.appendChild(el(`<p class="msg" ${ix("pred.yours.awaiting", vars)}>${tx("pred.yours.awaiting", vars)}</p>`));
    } else {
      body.appendChild(el(`<p class="msg" ${ix("pred.missed")}>${tx("pred.missed")}</p>`));
    }
    return card;
  }

  const enabledActivations = match.venueActivations.filter((a) => a.enabled && a.venue && a.venue.active);
  if (enabledActivations.length === 0) {
    body.appendChild(el(`<p class="msg" ${ix("pred.noVenue")}>${tx("pred.noVenue")}</p>`));
    return card;
  }

  const form = el(`<form>
    <div class="field">
      <label ${ix("pred.f.venue")}>${tx("pred.f.venue")}</label>
      <select id="venue-select-${match.matchId}"></select>
    </div>
    <p class="msg" id="geo-status-${match.matchId}" ${ix("pred.f.checking")}>${tx("pred.f.checking")}</p>
    <div class="field">
      <label ${ix("pred.f.exact")}>${tx("pred.f.exact")}</label>
      <div class="score-row">
        <input type="number" min="0" id="home-score-${match.matchId}" value="${mine.prediction ? mine.prediction.predictedHomeScore : 0}" />
        <span class="score-vs">–</span>
        <input type="number" min="0" id="away-score-${match.matchId}" value="${mine.prediction ? mine.prediction.predictedAwayScore : 0}" />
      </div>
    </div>
    <div class="field">
      <label ${ix("pred.f.who")}>${tx("pred.f.who")}</label>
      <select id="goalscorer-select-${match.matchId}">
        <option value="" ${ix("pred.f.noScorerOpt")}>${tx("pred.f.noScorerOpt")}</option>
        <optgroup label="${homeTeamName}">
          ${(match.homeTeam ? match.homeTeam.players : []).map((p) => `<option value="${esc(p.playerId)}">${esc(p.name)}</option>`).join("")}
        </optgroup>
        <optgroup label="${awayTeamName}">
          ${(match.awayTeam ? match.awayTeam.players : []).map((p) => `<option value="${esc(p.playerId)}">${esc(p.name)}</option>`).join("")}
        </optgroup>
      </select>
    </div>
    <div class="field">
      <label ${ix("pred.f.minuteQ")}>${tx("pred.f.minuteQ")}</label>
      <div class="score-row">
        <input type="number" min="1" max="90" id="goal-minute-regulation-${match.matchId}" placeholder="${tx("pred.f.minutePlaceholder")}" data-i18n-attr="placeholder:pred.f.minutePlaceholder" value="${mine.prediction && mine.prediction.predictedGoalMinuteRegulation !== null ? mine.prediction.predictedGoalMinuteRegulation : ""}" />
        <span class="score-vs">+</span>
        <input type="number" min="1" id="goal-minute-stoppage-${match.matchId}" placeholder="${tx("pred.f.stoppagePlaceholder")}" data-i18n-attr="placeholder:pred.f.stoppagePlaceholder" value="${mine.prediction && mine.prediction.predictedGoalMinuteStoppage !== null && mine.prediction.predictedGoalMinuteStoppage !== undefined ? mine.prediction.predictedGoalMinuteStoppage : ""}" disabled />
      </div>
      <p class="msg" id="goal-minute-hint-${match.matchId}" ${ix("pred.f.minuteHint")}>${tx("pred.f.minuteHint")}</p>
    </div>
    <div class="field">
      <label ${ix("pred.f.firstQ")}>${tx("pred.f.firstQ")}</label>
      <div class="team-toggle-row" id="first-team-toggle-${match.matchId}">
        <button type="button" class="team-toggle" data-value="HOME">${homeTeamName}</button>
        <button type="button" class="team-toggle" data-value="AWAY">${awayTeamName}</button>
        <button type="button" class="team-toggle" data-value="" ${ix("pred.noGoal")}>${tx("pred.noGoal")}</button>
      </div>
    </div>
    <button type="submit" class="btn-primary" id="submit-btn-${match.matchId}" ${ix(mine.prediction ? "pred.f.update" : "pred.f.submit")}>${tx(mine.prediction ? "pred.f.update" : "pred.f.submit")}</button>
    <p class="msg" id="submit-msg-${match.matchId}"></p>
  </form>`);
  body.appendChild(form);

  const goalscorerSelect = form.querySelector(`#goalscorer-select-${match.matchId}`);
  if (mine.prediction && mine.prediction.predictedGoalscorerPlayerId) {
    goalscorerSelect.value = mine.prediction.predictedGoalscorerPlayerId;
  }

  // Stoppage offset is only meaningful at the two regulation-time
  // boundaries (45, 90) — matches the 0094 CHECK constraint exactly.
  // Disabling (rather than hiding) the field at every other minute
  // keeps the control always visible while making an invalid
  // combination impossible to submit from this form.
  const regulationInput = form.querySelector(`#goal-minute-regulation-${match.matchId}`);
  const stoppageInput = form.querySelector(`#goal-minute-stoppage-${match.matchId}`);
  function syncStoppageAvailability() {
    const regulation = parseInt(regulationInput.value, 10);
    const atBoundary = regulation === 45 || regulation === 90;
    stoppageInput.disabled = !atBoundary;
    if (!atBoundary) stoppageInput.value = "";
  }
  syncStoppageAvailability();
  regulationInput.addEventListener("input", syncStoppageAvailability);

  const firstTeamToggle = form.querySelector(`#first-team-toggle-${match.matchId}`);
  let selectedFirstTeam = mine.prediction ? mine.prediction.predictedFirstTeamToScore : null;
  function renderFirstTeamToggle() {
    for (const btn of firstTeamToggle.querySelectorAll(".team-toggle")) {
      const btnValue = btn.getAttribute("data-value") || null;
      btn.classList.toggle("is-selected", btnValue === selectedFirstTeam);
    }
  }
  renderFirstTeamToggle();
  for (const btn of firstTeamToggle.querySelectorAll(".team-toggle")) {
    btn.addEventListener("click", () => {
      selectedFirstTeam = btn.getAttribute("data-value") || null;
      renderFirstTeamToggle();
    });
  }

  const select = form.querySelector(`#venue-select-${match.matchId}`);
  const lockedActivationId = mine.prediction ? mine.prediction.venueActivationId : null;
  for (const activation of enabledActivations) {
    const opt = document.createElement("option");
    opt.value = activation.venueActivationId;
    opt.textContent = activation.venue.name;
    if (lockedActivationId && activation.venueActivationId === lockedActivationId) opt.selected = true;
    select.appendChild(opt);
  }
  if (lockedActivationId) select.disabled = true;

  const geoStatus = form.querySelector(`#geo-status-${match.matchId}`);
  const position = await getCurrentPosition();
  if (!position) {
    setText(geoStatus, "pred.geo.unavailable");
    geoStatus.className = "msg error";
  } else {
    const selectedActivation = enabledActivations.find((a) => a.venueActivationId === select.value) || enabledActivations[0];
    const distance = haversineMeters(position.latitude, position.longitude, selectedActivation.venue.latitude, selectedActivation.venue.longitude);
    const eligible = distance <= selectedActivation.venue.radiusMeters;
    setText(geoStatus, eligible ? "pred.geo.within" : "pred.geo.outside");
    geoStatus.className = eligible ? "msg success" : "msg error";
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const submitMsg = form.querySelector(`#submit-msg-${match.matchId}`);
    const submitBtn = form.querySelector(`#submit-btn-${match.matchId}`);
    submitBtn.disabled = true;
    submitMsg.className = "msg";
    setText(submitMsg, "pred.submitting");

    const freshPosition = await getCurrentPosition();
    if (!freshPosition) {
      submitMsg.className = "msg error";
      setText(submitMsg, "pred.locationRequired");
      submitBtn.disabled = false;
      return;
    }

    const regulationRaw = regulationInput.value;
    const predictedGoalMinuteRegulation = regulationRaw.trim() === "" ? null : parseInt(regulationRaw, 10);
    const stoppageRaw = stoppageInput.disabled ? "" : stoppageInput.value;
    const predictedGoalMinuteStoppage = stoppageRaw.trim() === "" ? null : parseInt(stoppageRaw, 10);

    const result = await authedFetch(`/api/gaming/predictions/matches/${match.matchId}/predict`, {
      method: "POST",
      body: JSON.stringify({
        venueActivationId: select.value,
        predictedHomeScore: parseInt(form.querySelector(`#home-score-${match.matchId}`).value, 10) || 0,
        predictedAwayScore: parseInt(form.querySelector(`#away-score-${match.matchId}`).value, 10) || 0,
        predictedGoalscorerPlayerId: goalscorerSelect.value || null,
        predictedGoalMinuteRegulation: Number.isFinite(predictedGoalMinuteRegulation) ? predictedGoalMinuteRegulation : null,
        predictedGoalMinuteStoppage: Number.isFinite(predictedGoalMinuteStoppage) ? predictedGoalMinuteStoppage : null,
        predictedFirstTeamToScore: selectedFirstTeam,
        latitude: freshPosition.latitude,
        longitude: freshPosition.longitude,
        accuracyMeters: freshPosition.accuracyMeters,
      }),
    });

    if (result.status === 201) {
      submitMsg.className = "msg success";
      setText(submitMsg, "pred.saved");
      mine.prediction = result.json.prediction;
    } else {
      submitMsg.className = "msg error";
      if (result.json && result.json.error) setServerMessage(submitMsg, String(result.json.error));
      else setText(submitMsg, "pred.failed");
    }
    submitBtn.disabled = false;
  });

  return card;
}

// Opens the shared account-entry panel and remembers the match, so the journey continues here once the person is in.
function openAccountEntry(matchId) {
  const intent = { kind: "predict", matchId };
  if (typeof UrbanoAuth.openSignIn === "function" && UrbanoAuth.openSignIn({ intent })) return;
  const header = document.getElementById("btn-signin");
  if (header) header.click();
}

// A closed or finalized match: the person comes to consult, so the panel opens on logging in (it does not lead with creating an account)
// and the intent is to VIEW, which only brings the card back into view after signing in.
function openAccountToView(matchId) {
  const intent = { kind: "view", matchId };
  if (typeof UrbanoAuth.openSignIn === "function" && UrbanoAuth.openSignIn({ intent, mode: "login" })) return;
  const header = document.getElementById("btn-signin");
  if (header) header.click();
}

// Every build of the match list is numbered. When who is signed in changes while a build is still waiting on the network, the
// older build is dropped instead of being painted over the newer one (and never shows the previous person's prediction).
let renderGeneration = 0;

function emptyState(key) {
  return el(`<div class="empty-state" ${ix(key)}>${tx(key)}</div>`);
}

async function refresh() {
  const generation = ++renderGeneration;
  const res = await fetch("/api/gaming/predictions/matches");
  const data = await res.json();
  if (generation !== renderGeneration) return false;

  // Local drafts belong to the signed-in member only: nobody signed in (or a profile not finished) leaves none, and another person's
  // are removed. A draft for a match that is no longer open is removed as well.
  const identity = await UrbanoAuth.getState();
  const draftMember = identity && identity.status === "authenticated" && identity.gamingMemberId ? identity.gamingMemberId : null;
  const openMatchIds = new Set(
    (data.matches || [])
      .filter((m) => !m.cancelledAt && m.predictionContract === "PROGRESSIVE_LADDER_V1" && !m.finalized && new Date() < new Date(m.kickoffAt))
      .map((m) => m.matchId)
  );
  purgeLadderDrafts(draftMember, openMatchIds);

  if (!data.matches || data.matches.length === 0) {
    content.replaceChildren(emptyState("pred.empty"));
    return true;
  }

  const cards = [];
  for (const match of data.matches) {
    if (match.cancelledAt) continue;
    const card = await renderMatch(match);
    if (generation !== renderGeneration) return false;
    cards.push(card);
  }
  if (generation !== renderGeneration) return false;

  if (cards.length === 0) content.replaceChildren(emptyState("pred.empty"));
  else content.replaceChildren(...cards);
  return true;
}

// After a successful sign-in, take the person back to the match they came for.
function resumeIntent(state) {
  if (!state || state.status !== "authenticated" || typeof UrbanoAuth.consumeIntent !== "function") return;
  const intent = UrbanoAuth.consumeIntent();
  if (!intent || (intent.kind !== "predict" && intent.kind !== "view")) return;
  const card = [...content.querySelectorAll("[data-match-id]")].find((c) => c.getAttribute("data-match-id") === String(intent.matchId));
  if (!card) return;
  if (typeof card.scrollIntoView === "function") card.scrollIntoView({ block: "center" });
  if (intent.kind === "view") return; // consulting: no form to focus and no invitation to predict
  const firstInput = card.querySelector('input[type="number"]');
  if (firstInput) firstInput.focus();
  const note = card.querySelector('[id^="submit-msg-"]');
  if (note) {
    note.className = "msg success";
    setText(note, "pred.signedInNote");
  }
}

// Signing in, signing out, or a different person: nothing that belonged to the previous identity stays on screen, and the list is
// rebuilt for the new one without a page reload.
async function onIdentityChanged(state) {
  content.replaceChildren(emptyState("pred.updating"));
  try {
    await refresh();
  } catch (err) {
    console.error("Soccer Predictions: refresh after sign-in change failed:", err);
    content.replaceChildren(emptyState("pred.err.refresh"));
    return;
  }
  resumeIntent(state);
}

refresh().catch((err) => {
  console.error("Soccer Predictions: failed to load matches:", err);
  content.replaceChildren(emptyState("pred.err.load"));
});
if (typeof UrbanoAuth.onIdentityReset === "function") {
  // The signed-in person changed: nothing of the previous person (their predictions, their forms) stays on screen while the list is
  // rebuilt for the new one, and a build still waiting on the network is dropped.
  UrbanoAuth.onIdentityReset(() => {
    purgeLadderDrafts(null); // who is signed in changed, or nobody is: no draft survives for anyone
    ladderUnsent.clear();
    ladderNotices.clear();
    renderGeneration += 1;
    content.replaceChildren(emptyState("pred.updating"));
  }).catch(() => {});
}
if (typeof UrbanoAuth.onIdentityChange === "function") {
  UrbanoAuth.onIdentityChange(onIdentityChanged).catch(() => {});
}

// A change of language: everything with data-i18n is re-translated in place by UrbanoI18n itself; what remains is the parts that are
// not a plain table lookup — kick-off times (formatted in the chosen language) and server messages (known ones translate, unknown
// ones follow the rule in serverMessageText).
UrbanoI18n.onChange(() => {
  for (const node of content.querySelectorAll("[data-kickoff]")) {
    node.textContent = formatKickoff(node.getAttribute("data-kickoff"));
  }
  for (const node of content.querySelectorAll("[data-server-message]")) {
    node.textContent = serverMessageText(node.getAttribute("data-server-message"));
  }
});
</script>

</body>
