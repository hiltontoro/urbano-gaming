<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>Concurso de Disfraces — URBANO Gaming</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /*
   * Halloween Community Voting, the four-category contest — the voter's page. Mobile-first, on the same identity tokens as the rest of the shell.
   * Everything shown comes from the server as plain text and is placed with textContent; this page never builds markup from data.
   * It never receives, and so can never show, a total, a rank or a count of votes. It never asks the browser for anything about where the person is.
   */
  :root {
    --bg-page: #0a0a0a; --bg-card: #161616; --surface-2: #1c1c1c; --ink: #f5f1e8; --muted: #a8a295; --line: #2a2a2a;
    --halloween: #ff7a1a; --halloween-bg: rgba(255, 122, 26, 0.12); --purple: #7c3aed; --good: #4ade80; --bad: #f87171; --radius: 14px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { font-family: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-page); color: var(--ink); margin: 0; padding: 0 0 calc(24px + env(safe-area-inset-bottom)); }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  input[type="text"], input[type="email"] { font: inherit; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; width: 100%; font-size: 16px; min-height: 44px; }
  .top { display: flex; align-items: center; gap: 10px; padding: 14px 16px; max-width: 720px; margin: 0 auto; flex-wrap: wrap; }
  .top img { width: 24px; height: 26px; }
  .top h1 { font-size: 15px; font-weight: 800; margin: 0; letter-spacing: 0.02em; flex: 1; min-width: 150px; }
  .who { font-size: 12px; color: var(--muted); text-align: right; max-width: 52%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .clockchip { background: var(--halloween-bg); border: 1px solid rgba(255, 122, 26, 0.5); border-radius: 999px; padding: 4px 12px; font-weight: 800; font-size: 14px; letter-spacing: 0.04em; }
  main { max-width: 720px; margin: 0 auto; padding: 0 16px; }
  .banner { background: var(--halloween-bg); border: 1px solid rgba(255, 122, 26, 0.4); border-radius: var(--radius); padding: 10px 14px; font-size: 14px; line-height: 1.45; margin-bottom: 10px; }
  .banner .sub, .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .banner.closed { background: var(--surface-2); border-color: var(--line); }
  .banner .clock { font-weight: 800; font-size: 22px; letter-spacing: 0.04em; }
  .card { background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
  .card h2 { font-size: 17px; margin: 0 0 6px; }
  .card p { margin: 6px 0; font-size: 14px; line-height: 1.5; color: var(--muted); }
  .stack > * + * { margin-top: 10px; }
  .row { display: flex; gap: 10px; align-items: center; }
  .row > * { flex: 1; }
  .btn { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-weight: 700; font-size: 14px; min-height: 44px; }
  .btn.primary { background: var(--halloween); color: #1a0d00; border-color: var(--halloween); }
  .btn.link { background: none; border: none; color: var(--muted); text-decoration: underline; font-weight: 600; min-height: 44px; }
  .msg { font-size: 14px; line-height: 1.45; padding: 10px 12px; border-radius: 10px; margin-bottom: 10px; }
  .msg.err { background: rgba(248, 113, 113, 0.12); border: 1px solid rgba(248, 113, 113, 0.4); color: #fecaca; }
  .msg.ok { background: rgba(74, 222, 128, 0.12); border: 1px solid rgba(74, 222, 128, 0.4); color: #bbf7d0; }
  .msg .btn { margin-top: 8px; width: 100%; }
  .steps { display: flex; gap: 6px; margin: 0 0 14px; padding: 0; list-style: none; }
  .steps li { flex: 1; text-align: center; font-size: 12px; font-weight: 700; padding: 8px 4px; border-radius: 10px; background: var(--surface-2); color: var(--muted); }
  .steps li.done { background: rgba(74, 222, 128, 0.14); color: var(--good); }
  .steps li.current { background: var(--halloween-bg); color: var(--halloween); }
  /* the category picker */
  .cats { display: grid; gap: 12px; margin-bottom: 14px; }
  .cat { display: block; width: 100%; text-align: left; background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; min-height: 76px; }
  .cat h3 { margin: 0 0 4px; font-size: 16px; }
  .cat .state { font-size: 13px; font-weight: 700; }
  .cat .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .cat.open { border-color: rgba(255, 122, 26, 0.6); }
  .cat.voted { border-color: rgba(74, 222, 128, 0.6); }
  .cat.voted .state { color: var(--good); }
  .cat.open .state { color: var(--halloween); }
  .cat.results .state { color: #c4b5fd; }
  .promise { text-align: center; font-weight: 700; font-size: 14px; color: var(--halloween); margin: 4px 0 14px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tabs button { flex: 1; padding: 10px 6px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); font-size: 13px; font-weight: 700; min-height: 44px; }
  .tabs button[aria-selected="true"] { background: var(--halloween-bg); border-color: var(--halloween); color: var(--halloween); }
  .meter { font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; margin-bottom: 8px; }
  .deck { position: relative; touch-action: pan-y; user-select: none; }
  .deck .photo { width: 100%; height: min(58vh, 540px); object-fit: contain; border-radius: var(--radius); background: #000; display: block; }
  .deck .tag { position: absolute; left: 12px; top: 12px; background: rgba(0, 0, 0, 0.7); border-radius: 999px; padding: 6px 12px; font-weight: 800; font-size: 14px; }
  .deck .flag { position: absolute; right: 12px; top: 12px; border-radius: 999px; padding: 6px 12px; font-size: 12px; font-weight: 700; }
  .flag.mine { background: var(--purple); }
  .flag.voted { background: var(--good); color: #052e16; }
  .deck-actions { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 8px; margin-top: 10px; position: sticky; bottom: calc(8px + env(safe-area-inset-bottom)); background: rgba(10, 10, 10, 0.94); padding: 8px; border-radius: 14px; border: 1px solid var(--line); }
  .deck-status { margin-top: 10px; text-align: center; font-size: 14px; font-weight: 700; color: var(--muted); padding: 10px; border: 1px dashed var(--line); border-radius: 12px; }
  .grid-scroller { height: min(70vh, 640px); overflow-y: auto; overscroll-behavior: contain; border-radius: var(--radius); background: var(--bg-card); border: 1px solid var(--line); }
  .grid-window { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 0 6px; }
  .cell { position: relative; border: 0; padding: 0; background: var(--surface-2); border-radius: 10px; overflow: hidden; }
  .cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cell .no { position: absolute; left: 6px; top: 6px; background: rgba(0, 0, 0, 0.72); border-radius: 999px; padding: 3px 8px; font-size: 12px; font-weight: 800; }
  .cell .pick { position: absolute; left: 6px; bottom: 6px; background: var(--good); color: #052e16; border-radius: 999px; padding: 2px 8px; font-size: 12px; font-weight: 800; }
  /* dialogs: the photograph gives way, the actions never leave the screen (a 320 x 568 phone included) */
  .modal-back { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.78); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
  .modal { background: var(--bg-card); border: 1px solid var(--line); border-radius: 18px 18px 0 0; width: 100%; max-width: 560px; max-height: min(94vh, calc(100dvh - 8px)); display: flex; flex-direction: column; overflow: hidden; }
  .modal-body { overflow: auto; padding: 14px 16px 8px; flex: 1 1 auto; min-height: 0; }
  .modal-body > * + * { margin-top: 8px; }
  .modal-actions { flex: 0 0 auto; padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--bg-card); }
  .modal h2 { font-size: 17px; margin: 0; }
  .modal p { margin: 0; font-size: 14px; line-height: 1.45; color: var(--muted); }
  .modal img.full { width: 100%; max-height: 34vh; object-fit: contain; border-radius: 12px; background: #000; display: block; }
  .code-big { font-size: 34px; font-weight: 800; letter-spacing: 0.12em; text-align: center; padding: 14px; background: var(--surface-2); border-radius: 12px; }
  .photo-missing { aspect-ratio: 3 / 4; display: flex; align-items: center; justify-content: center; text-align: center; padding: 8px; background: var(--surface-2); border: 1px dashed var(--line); border-radius: 12px; color: var(--muted); font-size: 12px; }
  .winners { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .winners figure { margin: 0; width: calc(50% - 5px); }
  .winners.single figure { width: min(100%, 320px); }
  .winners img { width: 100%; border-radius: 12px; background: #000; }
  .winners figcaption { text-align: center; font-weight: 800; padding-top: 4px; }
  .nowinner { text-align: center; font-weight: 700; color: var(--muted); padding: 10px; }
  .review-row { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .review-row:first-of-type { border-top: 0; }
  .review-row img { width: 56px; height: 72px; object-fit: cover; border-radius: 8px; background: #000; flex: 0 0 auto; }
  .review-row .nopic { width: 56px; height: 72px; border-radius: 8px; border: 1px dashed var(--line); flex: 0 0 auto; }
  .review-row .grow { flex: 1; min-width: 0; }
  .review-row .grow b { display: block; font-size: 14px; }
  .review-row .grow span { font-size: 13px; color: var(--muted); }
  /* the contest's front door, the registration form, the ficha */
  .facts { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
  .facts li { font-size: 14px; line-height: 1.4; }
  .facts li b { color: var(--ink); }
  .facts li.zone { color: var(--muted); font-size: 12px; }
  .entries { display: grid; gap: 10px; margin: 12px 0 14px; }
  .btn.big { padding: 15px 16px; font-size: 16px; min-height: 52px; }
  .btn.block { display: block; width: 100%; text-align: center; }
  .searchbox { display: flex; gap: 8px; align-items: stretch; }
  .searchbox input { flex: 1; min-width: 0; }
  .searchbox .btn { flex: 0 0 auto; }
  .lbl { display: block; font-size: 13px; font-weight: 700; margin: 0 0 6px; color: var(--ink); }
  .field { margin-bottom: 14px; }
  .field .hint { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.4; }
  .field .bad { font-size: 13px; color: #fecaca; margin-top: 4px; }
  input[type="tel"], input[type="search"], select { font: inherit; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; width: 100%; font-size: 16px; min-height: 44px; }
  .phone-row { display: grid; grid-template-columns: 1fr; gap: 8px; }
  @media (min-width: 560px) { .phone-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); } .phone-row.other { grid-template-columns: 1fr; } }
  .opts { display: grid; gap: 8px; }
  .opt { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); min-height: 48px; cursor: pointer; }
  .opt input { margin-top: 3px; width: 20px; height: 20px; flex: 0 0 auto; accent-color: var(--halloween); }
  .opt span { font-size: 14px; line-height: 1.4; }
  .opt small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .opt.on { border-color: var(--halloween); background: var(--halloween-bg); }
  .check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.45; min-height: 44px; padding: 2px 0; }
  .check input { margin-top: 3px; width: 20px; height: 20px; flex: 0 0 auto; accent-color: var(--halloween); }
  details.more { margin-top: 6px; }
  details.more summary::before, details.how summary::before { content: "▸"; margin-right: 8px; }
  details.more[open] summary::before, details.how[open] summary::before { content: "▾"; }
  details.more summary { cursor: pointer; font-size: 13px; color: var(--muted); font-weight: 600; min-height: 44px; display: flex; align-items: center; }
  details.more p { font-size: 13px; line-height: 1.5; margin: 6px 0 0; color: var(--muted); }
  details.how { background: var(--bg-card); border: 1px solid var(--line); border-radius: var(--radius); padding: 4px 16px; margin-bottom: 14px; }
  details.how summary { cursor: pointer; font-weight: 700; font-size: 15px; min-height: 48px; display: flex; align-items: center; }
  details.how ul { margin: 0 0 12px; padding-left: 18px; }
  details.how li { font-size: 14px; line-height: 1.5; color: var(--muted); margin-bottom: 6px; }
  .codechip { display: inline-block; font-weight: 800; letter-spacing: 0.1em; font-size: 20px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 14px; }
  .ficha-photo { width: 100%; max-height: 62vh; object-fit: contain; border-radius: var(--radius); background: #000; display: block; }
  .ficha-title { font-size: 20px; font-weight: 800; margin: 12px 0 4px; word-break: break-word; }
  .btnrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .btnrow .btn { flex: 1 1 140px; }
  .tag.code { position: absolute; left: 12px; bottom: 12px; top: auto; font-size: 13px; letter-spacing: 0.06em; }
  .cell .no { max-width: calc(100% - 12px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cell .cname { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(transparent, rgba(0, 0, 0, 0.82)); padding: 14px 6px 5px; font-size: 11px; font-weight: 700; text-align: left; line-height: 1.2; overflow: hidden; }
  .cell .pick + .cname { padding-bottom: 5px; }
  .winners figcaption small { display: block; font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: 0.06em; }
  .promise.top { margin-top: 0; }
  @media (max-width: 359px) { .top h1 { font-size: 14px; } .btnrow .btn { flex-basis: 100%; } }
  .hidden { display: none !important; }
  @media (min-width: 560px) { .modal-back { align-items: center; } .modal { border-radius: 18px; } }
</style>
</head>
<body>
<header class="top">
  <img src="/urbano-mark.svg" alt="" width="24" height="26" />
  <h1>Concurso de disfraces</h1>
  <div class="clockchip hidden" id="clockChip" role="timer" aria-label="Tiempo restante de la votación"></div>
  <div class="who" id="who"></div>
</header>
<main id="main">
  <div id="app" aria-busy="true" aria-live="polite">
    <div class="card" id="loading" role="status"><h2>Cargando el concurso…</h2><p>Un momento, estamos buscando las categorías.</p></div>
  </div>
</main>
<div id="modalRoot"></div>

<script src="/urbanoAuth.js"></script>
<script src="/communityVotingRound.js"></script>
<script src="/communityVotingShareCard.js"></script>
<script src="/featuredContest.js"></script>
<script>
(() => {
  "use strict";
  const R = CommunityVotingRound;
  const S = CommunityVotingShareCard;
  const V = R;   // the deck, swipe and virtual-grid helpers live in the same module
  const params = new URLSearchParams(window.location.search);
  const contestId = params.get("c") || "";
  const rawCode = params.get("codigo") || "";
  const urlCode = R.normalizeCode(rawCode);
  const badCode = rawCode !== "" && !urlCode; // a link that carries something that cannot be a code is a link to nothing: it says so, it does not fall back to the front door
  const app = document.getElementById("app");
  const who = document.getElementById("who");
  const clockChip = document.getElementById("clockChip");
  const modalRoot = document.getElementById("modalRoot");
  const API = "/api/gaming/community-voting/";
  const PHOTO_PREFIX = API + "rounds/";
  const KEYS = ["MOST_ELABORATE", "SEXIEST", "BEST_GROUP", "FUNNIEST"];
  const PRIZE_PROMISE = "Habrá premios en cada categoría";
  const VENUE = "The Pub by Beer Box";

  // ---- storage: per-person conveniences only (where to come back to, a draft of the form). Every access is guarded.
  const sessionStore = (() => {
    try { return window.sessionStorage; } catch (e) { return { getItem: () => null, setItem: () => {}, removeItem: () => {} }; }
  })();
  const lastCatKey = `cv:contest:lastcat:${contestId}`;
  const draftKey = `cv:contest:draft:${contestId}`;
  const DRAFT_TTL_MS = 2 * 60 * 60 * 1000;

  const contestApi = R.buildContestApi((...a) => window.fetch(...a), () => UrbanoAuth.getAccessToken(), contestId);

  const state = {
    contest: null, cats: {}, order: [],
    // panel: home | vote | category | review | register | ficha | signin
    panel: urlCode || badCode ? "ficha" : params.get("participar") === "1" ? "register" : "home",
    current: null, after: null,
    ficha: { code: urlCode, status: urlCode ? "loading" : badCode ? "missing" : "idle", data: null },
    mine: null, mineLoaded: false, mineError: false,
    form: loadDraft(), formErrors: {}, registering: false,
    auth: { status: "unauthenticated", email: "" }, authStep: "email", email: "", code: "", name: "",
    entered: false, search: "",
    busy: false, downloadBusy: null, error: null, notice: null, fatal: null, loadFailed: false,
    // `epoch` goes up whenever the signed-in person changes or signs out, `castSeq` with every vote tap: a request that finishes after either
    // moved on must not touch what the page shows.
    epoch: 0, castSeq: 0,
  };

  // ---- the draft of the registration form: what the person typed (never their confirmations), kept in THIS tab only, for two hours
  function blankForm() {
    return { name: "", category: "", country: R.DEFAULT_COUNTRY, otherCountry: "", number: "", whatsappConfirmed: false, requirementsAccepted: false, deliveryAuthorized: false };
  }
  function loadDraft() {
    const form = blankForm();
    try {
      const saved = JSON.parse(sessionStore.getItem(draftKey) || "null");
      if (saved && Number.isFinite(saved.at) && Date.now() - saved.at < DRAFT_TTL_MS && saved.v) {
        for (const k of ["name", "category", "country", "otherCountry", "number"]) if (typeof saved.v[k] === "string") form[k] = saved.v[k];
      }
    } catch (e) { /* no draft */ }
    return form;
  }
  function saveDraft() {
    const f = state.form;
    try { sessionStore.setItem(draftKey, JSON.stringify({ at: Date.now(), v: { name: f.name, category: f.category, country: f.country, otherCountry: f.otherCountry, number: f.number } })); } catch (e) { /* nothing to remember */ }
  }
  function clearDraft() { try { sessionStore.removeItem(draftKey); } catch (e) { /* nothing to forget */ } state.form = blankForm(); }

  // ---- tiny DOM builder: text only, never markup from data
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v === undefined || v === null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k === "value") el.value = v;
      else if (k === "checked") el.checked = !!v;
      else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
      else if (v === true) el.setAttribute(k, "");
      else el.setAttribute(k, String(v));
    }
    for (const kid of kids.flat()) {
      if (kid === null || kid === undefined || kid === false) continue;
      el.appendChild(typeof kid === "string" ? document.createTextNode(kid) : kid);
    }
    return el;
  }
  const safePhoto = (url) => (typeof url === "string" && url.startsWith(PHOTO_PREFIX) ? url : "");
  const say = (code) => R.describeError(code);
  const step = () => R.identityStep(state.auth.status);
  const cat = (key) => state.cats[key];
  const curCat = () => (state.current ? cat(state.current) : null);
  const phaseOf = (c) => (c && c.pub ? c.pub.phase : "NOT_OPEN");
  const allItemsOf = (c) => (c && c.gallery && c.gallery.items) || [];
  const itemsOf = (c) => R.searchGallery(allItemsOf(c), c && c.search);
  const catName = (key) => (cat(key) ? cat(key).name : "");
  const registration = () => (state.contest && state.contest.registration) || { phase: "NOT_SCHEDULED", opensAt: null, closesAt: null };
  const texts = () => (state.contest && state.contest.texts) || null;

  function go(panel, extra) {
    state.panel = panel; state.notice = null; state.error = null;
    Object.assign(state, extra || {});
    render(); window.scrollTo(0, 0);
  }
  /** Runs `next` once the person is a full voter (verified email + profile); shows the sign-in steps first when they are not. */
  function requireIdentity(next) {
    if (step() === "READY" && state.entered) { next(); return; }
    state.after = next; state.panel = "signin"; state.notice = null; state.error = null; render(); window.scrollTo(0, 0);
  }

  async function copyText(text, okMessage) {
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch (e) { ok = false; }
    if (!ok) {
      try {
        const area = h("textarea", { "aria-hidden": "true", tabindex: "-1", style: "position:fixed;left:-9999px;top:0" });
        area.value = text; document.body.appendChild(area); area.select(); ok = document.execCommand("copy"); area.remove();
      } catch (e) { ok = false; }
    }
    state.error = ok ? null : "No pudimos copiar. Mantené apretado el texto para copiarlo.";
    state.notice = ok ? okMessage : null;
    render();
  }
  async function shareFicha(data) {
    const text = R.shareText(data);
    if (navigator.share) {
      try { await navigator.share({ title: "Concurso de disfraces", text, url: new URL(data.candidacy.ficheUrl, window.location.origin).toString() }); return; } catch (e) { if (e && e.name === "AbortError") return; }
    }
    await copyText(text, "Copiamos el mensaje para que lo pegues donde quieras.");
  }
  const absoluteFiche = (path) => new URL(path, window.location.origin).toString();

  // ---- the contest and its categories ----------------------------------------------------------------------------------------

  function makeCat(ref) {
    return {
      key: ref.key, instanceId: ref.instanceId, kind: ref.kind, name: ref.name.es, prompt: ref.prompt.es,
      api: R.buildApi((...a) => window.fetch(...a), () => UrbanoAuth.getAccessToken(), ref.instanceId),
      pub: ref, countdown: R.createCountdown(ref.deadlineRemainingMs),
      bound: false, status: null, gallery: null, myCandidateId: null, results: null, retry: null, search: "",
      deckIndex: 0, grid: { scrollTop: 0 }, view: "deck", pending: R.createPendingSelection(sessionStore, ref.instanceId),
    };
  }

  /** Reads the contest's public state and folds it in. Returns true when something a person sees changed. */
  async function applyContest(next) {
    let changed = !state.contest;
    const regBefore = state.contest ? state.contest.registration.phase : null;
    state.contest = next;
    if (regBefore !== null && regBefore !== next.registration.phase) changed = true;
    const keys = KEYS.filter((k) => next.categories.some((c) => c.key === k));
    if (keys.join() !== state.order.join()) { state.order = keys; changed = true; }
    for (const ref of next.categories) {
      let c = cat(ref.key);
      if (!c) { c = makeCat(ref); state.cats[ref.key] = c; changed = true; }
      const before = c.pub.phase, wasPublished = c.pub.published;
      c.pub = ref;
      c.countdown.resync(ref.deadlineRemainingMs);
      if (ref.phase !== before || ref.published !== wasPublished) {
        changed = true;
        if (before === "OPEN" && ref.phase !== "OPEN") { c.retry = null; if (state.current === ref.key) state.notice = null; } // an old "your vote was registered, you can change it" must not outlive the window
        if (state.entered && c.bound) await refreshCategory(c);
        if ((ref.phase === "CLOSED" || ref.phase === "ENDED") && ref.published) await loadResults(c);
      }
      if (state.entered && !c.bound && (ref.phase === "OPEN" || ref.phase === "NOT_OPEN") && (await tryBind(c))) changed = true;
    }
    return changed;
  }

  async function loadContest() {
    const r = await R.readContest((...a) => window.fetch(...a), contestId);
    if (r.status !== 200) return { ok: false, status: r.status, code: r.json && r.json.code };
    return { ok: true, json: r.json };
  }

  async function loadResults(c) {
    const r = await c.api.results();
    if (r.status === 200 && r.json.published) { c.results = r.json; render(); }
  }

  async function loadMine() {
    const r = await contestApi.mine();
    if (r.status === 200) { state.mine = (r.json && r.json.candidacy) || null; state.mineLoaded = true; state.mineError = false; }
    else if (r.status === 0 || r.status >= 500) state.mineError = true;
  }

  async function loadFicha(code) {
    state.ficha = { code, status: "loading", data: null };
    const r = await contestApi.ficha(code);
    if (state.ficha.code !== code) return; // the person asked for another one meanwhile
    if (r.status === 200) state.ficha = { code, status: "ok", data: r.json };
    else if (r.status === 404) state.ficha = { code, status: "missing", data: null };
    else state.ficha = { code, status: "error", data: null };
    render();
  }

  // ---- identity -------------------------------------------------------------------------------------------------------------

  /** Every change of WHO is signed in (or of how far their account is) goes through here, so anything started for the previous person can tell. */
  function setAuth(next) {
    if (state.auth.status !== next.status || state.auth.email !== next.email) state.epoch += 1;
    state.auth = next;
  }

  async function refreshAuth() {
    try {
      const s = await UrbanoAuth.getState();
      setAuth({ status: (s && s.status) || "unauthenticated", email: (s && s.email) || "" });
    } catch (e) { setAuth({ status: "unauthenticated", email: "" }); }
  }

  /** Once the person is a full voter (verified email + profile): bind in every category, read their own state, and come back to where they were. */
  async function enterContest() {
    const bound = await Promise.all(state.order.map((k) => cat(k).api.bind()));
    // A category that admits nobody new at this moment (its lobby is locked and it has not opened yet) is not an error: the person is bound
    // to it the moment it opens (see tryBind). Anything else that refuses a binding is about the person, and sends them back to that step.
    const refusal = bound.find((b) => b.status !== 200 && b.status !== 201 && !(b.json && b.json.code === "ADMISSION_CLOSED"));
    if (refusal) {
      state.entered = false;
      const code = refusal.json && refusal.json.code;
      const back = R.stepForError(code);
      if (back === "PROFILE") state.auth = { status: "profile_incomplete", email: state.auth.email };
      else if (back === "SIGN_IN") state.auth = { status: "unauthenticated", email: state.auth.email };
      else state.error = say(code);
      if (back) return;
    }
    state.order.forEach((k, i) => { cat(k).bound = bound[i].status === 200 || bound[i].status === 201; });
    state.entered = true;
    await Promise.all([...state.order.map((k) => refreshCategory(cat(k))), loadMine()]);
    resumeAfterSignIn();
  }

  /** A category that could not admit the person earlier (locked, not yet open) is joined the moment it can. Cheap, and quiet when it still cannot. */
  async function tryBind(c) {
    const r = await c.api.bind();
    if (r.status !== 200 && r.status !== 201) return false;
    c.bound = true;
    await refreshCategory(c);
    return true;
  }

  async function refreshCategory(c) {
    if (!c.bound) return;
    const [status, gallery] = await Promise.all([c.api.status(), c.api.gallery()]);
    if (status.status === 200) { c.status = status.json; c.myCandidateId = status.json.myCandidateId || null; }
    if (gallery.status === 200) c.gallery = gallery.json;
  }

  /** After sign-in or profile the page may resume on the candidacy the person had chosen — when it is SAFE to: open, still shown, not their own, not already their vote. */
  function resumeAfterSignIn() {
    let key = null;
    try { key = sessionStore.getItem(lastCatKey); } catch (e) { key = null; }
    const c = key ? cat(key) : null;
    if (!c) return;
    const resumed = R.resumeSelection(c.pending.get(), allItemsOf(c), phaseOf(c), c.myCandidateId);
    if (resumed) { c.pending.clear(); state.panel = "category"; state.current = c.key; render(); confirmVote(c, resumed); }
  }

  // ---- polling: ONE cheap public read of the whole contest ----------------------------------------------------------------------
  // One request at a time, adaptive to what the contest is doing (R.pollDelayMs), jittered so a crowd does not call in step, refreshed the moment
  // the page is visible (or online) again, and never trusting an answer older than the newest. The page only ever SHOWS what the server answered.

  let phaseSeenAt = 0;
  const poller = R.createPoller({
    now: () => performance.now(),
    setTimer: (fn, ms) => window.setTimeout(fn, ms),
    clearTimer: (handle) => window.clearTimeout(handle),
    isVisible: () => !document.hidden,
    random: () => Math.random(),
    delayFor: () => {
      const phase = state.contest ? state.contest.phase : "NOT_OPEN";
      const done = state.contest && state.contest.categories.every((c) => c.phase === "ENDED");
      if (done) return null;
      return R.pollDelayMs({ phase, published: phase === "RESULTS", sinceChangeMs: performance.now() - phaseSeenAt });
    },
    staleAfterMs: R.POLL.staleAfterMs,
    fetchOnce: async () => {
      const r = await loadContest();
      if (!r.ok) return { ok: false };
      return { ok: true, apply: async () => { const before = state.contest && state.contest.phase; const changed = await applyContest(r.json); if (state.contest.phase !== before) phaseSeenAt = performance.now(); if (changed && !formIsBeingEdited()) render(); } };
    },
  });
  document.addEventListener("visibilitychange", () => poller.onVisibility(!document.hidden));
  window.addEventListener("pageshow", (e) => { if (e && e.persisted) poller.refreshNow(); });
  window.addEventListener("online", () => poller.refreshNow());
  /** A background refresh never rebuilds the page under a hand that is typing. */
  function formIsBeingEdited() {
    const a = document.activeElement;
    return !!(a && a !== document.body && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && app.contains(a));
  }

  // ---- the clock: the server's remaining time, advanced by a monotonic clock -------------------------------------------------------

  function clockCat() {
    const open = state.order.map(cat).filter((c) => phaseOf(c) === "OPEN" && c.pub.deadlineAt);
    if (open.length === 0) return null;
    if (curCat() && open.includes(curCat())) return curCat();
    return open.slice().sort((a, b) => (a.countdown.remaining() || 0) - (b.countdown.remaining() || 0))[0];
  }
  function tickClock() {
    const c = clockCat();
    const live = document.getElementById("clock");
    if (!c) { clockChip.classList.add("hidden"); if (live) live.textContent = ""; return; }
    const left = c.countdown.remaining();
    const text = left === null ? "" : R.formatCountdown(left);
    clockChip.textContent = text ? `⏱ ${text}` : "";
    clockChip.classList.toggle("hidden", !text);
    if (live) live.textContent = text;
    if (left !== null && left <= 0) { c.pub.phase = "CLOSED"; c.retry = null; if (state.current === c.key) state.notice = null; phaseSeenAt = performance.now(); render(); poller.refreshNow(); }
  }
  setInterval(tickClock, 1000);

  // ---- shared pieces -------------------------------------------------------------------------------------------------------

  function messages() {
    const retrying = state.order.map(cat).find((c) => c.retry);
    return [
      state.error ? h("div", { class: "msg err", role: "alert", text: state.error }) : null,
      retrying ? h("div", { class: "msg err", role: "alert" },
        h("div", { text: `No pudimos confirmar tu voto en «${retrying.name}». Si ya había llegado, no se duplica.` }),
        h("button", { class: "btn primary", id: "retryVote", disabled: state.busy, text: "Reintentar mi voto", onclick: () => retryVote(retrying) })) : null,
      state.notice ? h("div", { class: "msg ok", role: "status", text: state.notice }) : null,
    ];
  }

  const back = (label, panel) => h("button", { class: "btn link", id: "backLink", text: label || "← Inicio", onclick: () => go(panel || "home", { current: null, after: null }) });

  function stepper() {
    const s = step();
    const mk = (label, done, current) => h("li", { class: done ? "done" : current ? "current" : "", text: `${done ? "✓ " : ""}${label}` });
    if (s === "READY") return null;
    return h("ol", { class: "steps", "aria-label": "Pasos" }, mk("Correo", s !== "SIGN_IN", s === "SIGN_IN"), mk("Perfil", false, s === "PROFILE"), mk("Listo", false, false));
  }

  function renderSignIn() {
    const email = h("input", { type: "email", id: "email", autocomplete: "email", inputmode: "email", placeholder: "tu@correo.com", "aria-label": "Correo electrónico", value: state.email });
    const code = h("input", { type: "text", id: "authCode", inputmode: "numeric", autocomplete: "one-time-code", placeholder: "Código del correo", "aria-label": "Código del correo", maxlength: "10", value: state.code });
    const send = h("button", { class: "btn primary", id: "sendEmail", disabled: state.busy, text: state.busy ? "Enviando…" : "Enviar código al correo", onclick: async () => {
      state.error = null; state.busy = true; state.email = email.value.trim(); render();
      const r = await UrbanoAuth.requestOtp(state.email);
      state.busy = false;
      if (r.status === "sent") { state.authStep = "code"; state.notice = "Te enviamos un código. Revisá tu correo."; } else state.error = say("INVALID_REQUEST");
      render();
    } });
    const verify = h("button", { class: "btn primary", id: "verifyEmail", disabled: state.busy, text: state.busy ? "Verificando…" : "Verificar y entrar", onclick: async () => {
      state.error = null; state.busy = true; state.code = code.value.trim(); render();
      // verifyOtp is reachable ONLY from this panel, which exists only when there is no session: an existing session is never replaced here.
      // The state is read again right before, because another tab may have signed in since this panel was drawn.
      await refreshAuth();
      if (step() !== "SIGN_IN") {
        state.busy = false; state.authStep = "email"; state.code = "";
        state.notice = "Ya hay una sesión abierta en este navegador. Seguimos con esa cuenta; si querés usar otra, cambiala desde “Usar otra cuenta”.";
        await afterIdentityChange();
        return;
      }
      const r = await UrbanoAuth.verifyOtp(state.email, state.code);
      state.busy = false;
      if (r.status === "error") { state.error = "El código no es correcto o ya venció. Pedí uno nuevo."; state.notice = null; render(); return; }
      state.authStep = "email"; state.code = ""; state.notice = null;
      await afterIdentityChange();
    } });
    return h("section", { class: "card stack", id: "stepIdentity" },
      h("h2", { text: "Entrá con tu correo" }),
      h("p", { text: R.SIGN_IN_NOTICE }),
      state.authStep === "email" ? [email, send] : [h("p", { text: `Código enviado a ${state.email}` }), code, verify, h("button", { class: "btn link", text: "Usar otro correo", onclick: () => { state.authStep = "email"; state.notice = null; render(); } })]
    );
  }

  function renderProfile() {
    const name = h("input", { type: "text", id: "displayName", autocomplete: "nickname", maxlength: "40", placeholder: "Tu nombre", "aria-label": "Tu nombre en URBANO Gaming", value: state.name });
    const save = h("button", { class: "btn primary", id: "saveProfile", disabled: state.busy, text: state.busy ? "Guardando…" : "Guardar mi perfil y continuar", onclick: async () => {
      state.error = null; state.busy = true; state.name = name.value; render();
      const r = await UrbanoAuth.completeProfile(name.value.trim());
      state.busy = false;
      if (r.status === "error") { state.error = r.message ? "No pudimos guardar tu perfil. Revisá el nombre e intentalo de nuevo." : say("INVALID_REQUEST"); render(); return; }
      await afterIdentityChange();
    } });
    return h("section", { class: "card stack", id: "stepProfile" },
      h("h2", { text: "Completá tu perfil" }),
      h("p", { id: "profileNotice", text: R.PROFILE_NOTICE }),
      name, save,
      h("button", { class: "btn link", id: "switchAccount", text: "Usar otra cuenta", onclick: confirmSwitchAccount }));
  }
  const identityCards = () => [stepper(), step() === "PROFILE" ? renderProfile() : renderSignIn()];

  /** Signing out is the person's explicit act; nothing here ever replaces a session by itself. */
  function confirmSwitchAccount() {
    const close = () => { modalRoot.textContent = ""; };
    modalRoot.textContent = "";
    modalRoot.appendChild(h("div", { class: "modal-back" }, h("div", { class: "modal", role: "dialog", "aria-modal": "true", "aria-label": "Cambiar de cuenta" },
      h("div", { class: "modal-body" },
        h("h2", { text: "¿Cambiar de cuenta?" }),
        h("p", { text: `Vas a cerrar la sesión de ${state.auth.email || "esta cuenta"}. Tus votos y tu candidatura, si ya los hiciste, se conservan.` })),
      h("div", { class: "modal-actions row" },
        h("button", { class: "btn", id: "switchCancel", text: "Cancelar", onclick: close }),
        h("button", { class: "btn primary", id: "switchConfirm", text: "Cerrar sesión", onclick: async () => {
          close();
          state.epoch += 1; state.castSeq += 1; state.busy = false; // a vote still in flight belongs to the person who is leaving
          try { await UrbanoAuth.signOut(); } catch (e) { /* the page re-reads the state below */ }
          state.entered = false; state.panel = "home"; state.current = null; state.after = null; state.mine = null; state.mineLoaded = false;
          for (const k of state.order) { const c = cat(k); c.bound = false; c.status = null; c.gallery = null; c.myCandidateId = null; c.retry = null; }
          await refreshAuth(); render();
        } })))));
  }

  async function afterIdentityChange() {
    await refreshAuth();
    if (step() === "READY") {
      await enterContest();
      if (state.after && step() === "READY" && state.entered) { const next = state.after; state.after = null; next(); return; }
    }
    render();
  }

  // ---- candidacy cards (the person's own, a ficha) --------------------------------------------------------------------------

  function codeActions(code, ficheUrl, data) {
    return h("div", { class: "btnrow" },
      h("button", { class: "btn", id: "copyCode", text: "Copiar código", onclick: () => copyText(code, `Copiamos el código ${code}.`) }),
      h("button", { class: "btn", id: "copyLink", text: "Copiar enlace", onclick: () => copyText(absoluteFiche(ficheUrl), "Copiamos el enlace de la ficha.") }),
      navigator.share && data ? h("button", { class: "btn", id: "shareFicha", text: "Compartir", onclick: () => shareFicha(data) }) : null);
  }

  async function downloadMine(kind) {
    const share = state.mine && state.mine.share;
    if (!share || state.downloadBusy) return;
    state.downloadBusy = kind;
    state.error = null;
    state.notice = null;
    render();
    const opts = {
      imageUrl: share.imageUrl,
      code: share.code,
      location: window.location,
      document,
      Image: window.Image,
      fetch: window.fetch.bind(window),
      urlApi: window.URL,
    };
    try {
      if (kind === "photo") await S.downloadPhoto(opts);
      else await S.downloadStory(opts);
      state.notice = kind === "photo" ? "Descargamos tu foto aprobada." : "Descargamos tu story personalizado con tu foto y código.";
    } catch (_) {
      state.error = kind === "photo" ? "No pudimos descargar tu foto. Intentá de nuevo." : "No pudimos crear tu story. Intentá de nuevo.";
    } finally {
      state.downloadBusy = null;
      render();
    }
  }

  function instagramInvite() {
    return h("aside", { class: "card stack", id: "instagramInvite", "aria-label": "Instagram de URBANO" },
      h("h3", { text: "¡Compartí tu disfraz! 🎃" }),
      h("p", null, "Seguinos en ", h("a", { class: "btn link", href: "https://www.instagram.com/realurbanohn/", target: "_blank", rel: "noopener noreferrer", text: "@realurbanohn" }), " y etiquetanos en tu historia de Instagram."),
      h("p", { class: "hint", text: "Es opcional y no afecta tu participación ni tus votos." }));
  }

  function renderMine() {
    const m = state.mine;
    if (!m) return null;
    const rep = m.role !== "MEMBER";
    return h("section", { class: "card stack", id: "myCandidacy" },
      h("h2", { text: "Tu candidatura" }),
      h("p", { text: `${m.publicName || "Sin nombre público todavía"} · ${catName(m.categoryKey) || m.categoryName.es}` }),
      h("div", null, h("span", { class: "codechip", id: "myCode", text: m.publicCode })),
      h("p", { id: "myCandidacyText", text: R.myCandidacyText(m) }),
      rep && m.deliveryStatus ? h("p", { id: "deliveryText", text: R.deliveryText(m.deliveryStatus) }) : null,
      codeActions(m.publicCode, m.ficheUrl, null),
      m.state === "PUBLIC" ? h("button", { class: "btn", id: "openMyFicha", text: "Ver mi ficha", onclick: () => openFicha(m.publicCode) }) : null,
      m.state === "PUBLIC" && m.share ? h("div", { class: "btnrow", id: "myDownloads" },
        h("button", { class: "btn", id: "downloadMyPhoto", disabled: !!state.downloadBusy, text: state.downloadBusy === "photo" ? "Descargando…" : "Descargar mi foto", onclick: () => downloadMine("photo") }),
        h("button", { class: "btn primary", id: "downloadMyStory", disabled: !!state.downloadBusy, text: state.downloadBusy === "story" ? "Creando story…" : "Descargar story para compartir", onclick: () => downloadMine("story") })) : null,
      instagramInvite());
  }

  function openFicha(code) {
    const normalized = R.normalizeCode(code);
    if (!normalized) { state.error = say("ENTRY_NOT_FOUND"); render(); return; }
    state.ficha = { code: normalized, status: "loading", data: null };
    go("ficha");
    loadFicha(normalized);
  }

  function renderSearch(idSuffix) {
    const input = h("input", { type: "search", id: `codeSearch${idSuffix || ""}`, autocomplete: "off", autocapitalize: "characters", placeholder: "Código, por ejemplo HAL-K7M2Q", "aria-label": "Buscar una candidatura por su código", value: state.search });
    const run = () => { state.search = input.value; const code = R.normalizeCode(input.value); if (code) openFicha(code); else { state.error = "Ese código no es válido. Los códigos se ven así: HAL-K7M2Q."; state.notice = null; render(); } };
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); run(); } });
    return h("section", { class: "card stack", id: `searchCard${idSuffix || ""}` },
      h("h2", { text: "Buscar por código" }),
      h("p", { text: "Si alguien te compartió el código de su disfraz, escribilo y mirá su ficha." }),
      h("div", { class: "searchbox" }, input, h("button", { class: "btn primary", id: `searchGo${idSuffix || ""}`, text: "Buscar", onclick: run })));
  }

  // ---- the front door ----------------------------------------------------------------------------------------------------------

  function planFacts() {
    const first = state.order.length ? cat(state.order[0]).pub : null;
    if (!first) return null;
    const lines = [];
    const date = R.formatEventDate(first.votingOpensAt || first.registrationOpensAt);
    if (date) lines.push(h("li", null, h("b", { text: date.charAt(0).toUpperCase() + date.slice(1) })));
    const reg = R.registrationWindowText(first.registrationOpensAt, first.contestantCutoffAt);
    if (reg) lines.push(h("li", { id: "factRegistration", text: reg }));
    const vote = R.votingWindowText(first.votingOpensAt, first.votingClosesAt);
    if (vote) lines.push(h("li", { id: "factVoting", text: vote }));
    if (lines.length) lines.push(h("li", { class: "zone", text: `Hora de Honduras${first.tentative ? " · horario tentativo" : ""}` }));
    return lines.length ? h("ul", { class: "facts", id: "planFacts" }, lines) : null;
  }

  function howToParticipate() {
    return h("details", { class: "how", id: "howTo" }, h("summary", { text: "Cómo participar" }), h("ul", null, R.HOW_TO_PARTICIPATE.map((t) => h("li", { text: t }))));
  }

  function renderHome() {
    const reg = registration();
    const anyOpen = state.order.map(cat).some((c) => phaseOf(c) === "OPEN");
    const registerLabel = reg.phase === "CLOSED" ? "Inscripción terminada" : "Participar como concursante";
    const voteLine = anyOpen ? "La votación está abierta." : state.order.map(cat).every((c) => ["CLOSED", "ENDED"].includes(phaseOf(c))) ? "La votación ya cerró." : "La votación todavía no está abierta.";
    return [
      h("div", { class: "promise top", id: "prizePromise", text: PRIZE_PROMISE }),
      h("section", { class: "card", id: "eventCard" },
        h("h2", { text: `Concurso de disfraces · ${VENUE}` }),
        planFacts(),
        h("p", { id: "registrationNotice", text: R.registrationNotice(reg) }),
        h("p", { id: "voteLine", text: voteLine })),
      h("div", { class: "entries" },
        h("button", { class: "btn primary big block", id: "entryVote", text: "Votar por tu disfraz favorito", onclick: () => go("vote") }),
        h("button", { class: "btn big block", id: "entryRegister", text: registerLabel, onclick: () => go("register") })),
      state.mine ? h("div", { class: "card", id: "mineMini" }, h("p", { text: `Tu candidatura: ${state.mine.publicName || "sin nombre"} · ${state.mine.publicCode}` }), h("button", { class: "btn", id: "seeMine", text: "Ver mi candidatura", onclick: () => go("register") })) : null,
      renderSearch(""),
      howToParticipate(),
      state.order.map(cat).map(renderResults),
      step() === "READY" ? h("button", { class: "btn link", id: "switchAccount", text: "Usar otra cuenta", onclick: confirmSwitchAccount }) : null,
    ];
  }

  // ---- the people who take part: the registration --------------------------------------------------------------------------------

    const card = h("div", { class: "deck", id: "deck",
      ontouchstart: (e) => { startX = e.changedTouches[0].clientX; startY = e.changedTouches[0].clientY; },
      ontouchend: (e) => { const intent = V.swipeIntent({ dx: e.changedTouches[0].clientX - startX, dy: e.changedTouches[0].clientY - startY }); if (intent === "next") move(1); if (intent === "prev") move(-1); } },
      h("img", { class: "photo", src: safePhoto(item.fullUrl), alt: R.candidacyTitle(item), decoding: "async" }),
      h("span", { class: "tag", id: "deckName", text: R.candidacyTitle(item) }),
      item.code ? h("span", { class: "tag code", id: "deckCode", text: item.code }) : null,
      item.mine ? h("span", { class: "flag mine", text: "Tu disfraz" }) : votedFor(c, item) ? h("span", { class: "flag voted", text: "✓ Tu voto" }) : null);
    const can = canVote(c) && !item.mine && !!item.candidateId && !votedFor(c, item);
    return h("div", null,
      h("div", { class: "meter" }, h("span", { text: `${c.deckIndex + 1} de ${list.length}` })),
      card,
      can
        ? h("div", { class: "deck-actions" },
            h("button", { class: "btn", id: "prev", "aria-label": "Anterior", text: "←", onclick: () => move(-1) }),
            h("button", { class: "btn primary", id: "choose", disabled: state.busy, text: c.myCandidateId ? "Cambiar mi voto a este" : "Votar por este", onclick: () => confirmVote(c, item) }),
            h("button", { class: "btn", id: "next", "aria-label": "Siguiente", text: "→", onclick: () => move(1) }))
        : h("div", { class: "deck-actions" },
            h("button", { class: "btn", id: "prev", "aria-label": "Anterior", text: "←", onclick: () => move(-1) }),
            h("div", { class: "deck-status", id: "voteStatus", text: voteStatus(c, item) }),
            h("button", { class: "btn", id: "next", "aria-label": "Siguiente", text: "→", onclick: () => move(1) })),
      h("button", { class: "btn link", text: "Ver en grande", onclick: () => openPhoto(c, item) }));
  }

  // virtualized grid: ~30 thumbnails exist at any moment, however many candidacies there are
  function gridMetrics(scroller) {
    const width = scroller.clientWidth || 360;
    const gap = 6;
    const cell = (width - gap * 4) / 3;
    return { rowHeight: Math.round(cell * (4 / 3)) + gap, viewportHeight: scroller.clientHeight || 560 };
  }
  function renderGridWindow(c, scroller, windowEl) {
    const list = itemsOf(c);
    const m = gridMetrics(scroller);
    const w = V.computeVirtualWindow({ total: list.length, columns: 3, rowHeight: m.rowHeight, scrollTop: scroller.scrollTop, viewportHeight: m.viewportHeight, overscanRows: 2 });
    windowEl.style.paddingTop = `${w.topPadding}px`;
    windowEl.style.paddingBottom = `${w.bottomPadding}px`;
    windowEl.style.gridAutoRows = `${m.rowHeight - 6}px`;
    windowEl.textContent = "";
    for (let i = w.firstIndex; i < w.lastIndex; i++) {
      const item = list[i];
      windowEl.appendChild(h("button", { class: "cell", "data-alias": item.alias, "aria-label": R.candidacyTitle(item), onclick: () => openPhoto(c, item) },
        photoTag(c, item),
        votedFor(c, item) ? h("span", { class: "pick", text: "✓ Tu voto" }) : null,
        h("span", { class: "cname", text: R.candidacyTitle(item) })));
    }
  }
  function renderGrid(c) {
    const list = itemsOf(c);
    if (list.length === 0) return h("div", { class: "card" }, h("p", { text: allItemsOf(c).length === 0 ? "Todavía no hay disfraces para mostrar en esta categoría." : "No encontramos disfraces con eso. Probá con otro nombre o código." }));
    const windowEl = h("div", { class: "grid-window", id: "gridWindow" });
    const scroller = h("div", { class: "grid-scroller", id: "gridScroller", tabindex: "0", "aria-label": "Disfraces" }, windowEl);
    let frame = 0;
    scroller.addEventListener("scroll", () => {
      c.grid.scrollTop = scroller.scrollTop;
      if (frame) return;
      frame = (window.requestAnimationFrame || ((f) => setTimeout(f, 16)))(() => { frame = 0; renderGridWindow(c, scroller, windowEl); });
    });
    setTimeout(() => { scroller.scrollTop = c.grid.scrollTop; renderGridWindow(c, scroller, windowEl); }, 0);
    renderGridWindow(c, scroller, windowEl);
    return h("div", null, h("div", { class: "meter" }, h("span", { text: `${list.length} ${list.length === 1 ? "disfraz" : "disfraces"}` })), scroller);
  }

  function renderVoting(c) {
    const tabs = h("div", { class: "tabs", role: "tablist" },
      h("button", { role: "tab", id: "tabDeck", "aria-selected": c.view === "deck" ? "true" : "false", text: "Uno a uno", onclick: () => { c.view = "deck"; render(); } }),
      h("button", { role: "tab", id: "tabGrid", "aria-selected": c.view === "grid" ? "true" : "false", text: "Todos", onclick: () => { c.view = "grid"; render(); } }));
    const search = h("input", { type: "search", id: "gallerySearch", autocomplete: "off", placeholder: "Buscar por nombre o código", "aria-label": "Buscar por nombre o código", value: c.search });
    // typing repaints only the gallery below, never the box being typed in
    const area = h("div", { id: "galleryArea" });
    const paint = () => { area.textContent = ""; area.appendChild(c.view === "deck" ? renderDeck(c) : renderGrid(c)); };
    search.addEventListener("input", () => { c.search = search.value; c.deckIndex = 0; c.grid.scrollTop = 0; paint(); });
    paint();
    return h("div", null, allItemsOf(c).length > 1 ? h("div", { class: "field" }, search) : null, tabs, area);
  }

  // ---- the panels ------------------------------------------------------------------------------------------------------------

  /** The plan of the event, from what the team keeps up to date. It is information: only the team's act opens a category. */
  function scheduleLines() {
    const facts = planFacts();
    return facts ? h("section", { class: "card", id: "scheduleCard" }, facts) : null;
  }

  function openCategoryFor(key) {
    requireIdentity(() => { state.current = key; try { sessionStore.setItem(lastCatKey, key); } catch (e) { /* nothing to remember */ } go("category", { current: key }); });
  }

  function renderVote() {
    const cards = state.order.map((k) => {
      const c = cat(k);
      const s = R.categoryState(c.pub, c.myCandidateId);
      const when = c.pub.phase === "NOT_OPEN" && c.pub.votingOpensAt ? `Votación prevista ${R.atTime(c.pub.votingOpensAt)} (hora de Honduras)` : c.pub.phase === "OPEN" && c.pub.deadlineAt ? `Cierra ${R.atTime(c.pub.deadlineAt)} (hora de Honduras)` : "";
      return h("button", { class: `cat ${s.tone}`, "data-category": k, id: `cat-${k}`, onclick: () => openCategoryFor(k) },
        h("h3", { text: c.name }),
        h("div", { class: "state", text: s.label }),
        when ? h("div", { class: "meta", text: when }) : null);
    });
    const open = state.order.map(cat).filter((c) => phaseOf(c) === "OPEN");
    const voted = open.filter((c) => c.myCandidateId).length;
    const allClosed = state.order.map(cat).every((c) => ["CLOSED", "ENDED"].includes(phaseOf(c)));
    const headline = open.length > 0 ? "La votación está abierta. Elegí una categoría." : allClosed ? "La votación ya cerró. Gracias por participar." : "La votación todavía no está abierta.";
    return [
      back(),
      h("section", { class: "card", id: "voteIntro" }, h("h2", { text: "Votar por tu disfraz favorito" }), h("p", { id: "voteHeadline", text: headline }),
        h("p", { id: "oneVotePerCategory", text: "Podés elegir un disfraz por categoría: hasta cuatro votos, uno en cada categoría. Podés cambiar cada elección mientras su votación siga abierta; el nuevo voto reemplaza al anterior, no suma otro." }), planFacts()),
      h("div", { class: "cats", id: "categories" }, cards),
      open.length > 0 && step() === "READY" ? h("div", { class: "card stack" },
        h("p", { id: "voteProgress", text: `Votaste en ${voted} de ${open.length} ${open.length === 1 ? "categoría abierta" : "categorías abiertas"}.` }),
        h("button", { class: "btn", id: "reviewVotes", text: "Revisar mis votos", onclick: () => go("review") })) : null,
      state.order.map(cat).map(renderResults),
    ];
  }

  function banner(c) {
    const info = c.pub;
    const lines = [h("div", { text: R.phaseNotice(info) })];
    if (info.phase === "OPEN" && info.deadlineAt) lines.push(h("div", { class: "clock", id: "clock", "aria-label": "Tiempo restante" }));
    return h("div", { class: `banner${info.phase === "CLOSED" || info.phase === "ENDED" ? " closed" : ""}`, role: "status" }, lines);
  }

  function renderCategory(c) {
    const parts = [
      back("← Categorías", "vote"),
      h("div", { class: "card" }, h("h2", { text: c.name }), h("p", { text: c.prompt })),
      banner(c),
      renderClaim(c),
      renderResults(c),
    ];
    const p = phaseOf(c);
    if (c.results && c.results.published) { /* the announcement is the whole answer: no voting deck once the result is out */ }
    else if (!c.bound) { if (p === "OPEN") parts.push(h("div", { class: "card", role: "status" }, h("p", { text: "Entrando a la categoría…" }))); }
    else if (p === "CLOSED" || p === "ENDED") parts.push(h("div", { class: "card", id: "closedCard" }, h("h2", { text: "Votación cerrada" }), h("p", { text: c.myCandidateId ? "Tu voto quedó registrado. Los resultados se publican cuando el equipo termine de revisarlos." : "Gracias por participar. Los resultados se publican cuando el equipo termine de revisarlos." })));
    else parts.push(renderVoting(c));
    if (state.entered && c.bound && (p === "OPEN") && state.order.length > 1) parts.push(h("button", { class: "btn", id: "reviewVotes", text: "Revisar mis votos", onclick: () => go("review") }));
    if (state.entered && c.bound && p === "NOT_OPEN" && !c.showClaim) parts.push(h("button", { class: "btn link", id: "showClaim", text: "Tengo un código de participante", onclick: () => { c.showClaim = true; render(); } }));
    if (state.entered && c.myCandidateId && !state.busy && !c.retry) parts.push(instagramInvite());
    return parts;
  }

  function renderReview() {
    const rows = state.order.map((k) => {
      const c = cat(k);
      const item = c.myCandidateId ? allItemsOf(c).find((i) => i.candidateId === c.myCandidateId) : null;
      const p = phaseOf(c);
      const s = R.categoryState(c.pub, c.myCandidateId);
      return h("div", { class: "review-row", "data-category": k },
        item ? h("img", { src: safePhoto(item.thumbUrl), alt: R.candidacyTitle(item), loading: "lazy" }) : h("div", { class: "nopic", "aria-hidden": "true" }),
        h("div", { class: "grow" }, h("b", { text: c.name }), h("span", { text: item ? `Tu voto: ${R.candidacyTitle(item)}` : p === "OPEN" ? "Todavía no votaste en esta categoría." : p === "NOT_OPEN" ? "La votación todavía no abre." : "No votaste en esta categoría." }), h("div", null, h("span", { text: s.label }))),
        p === "OPEN" ? h("button", { class: "btn", "data-change": k, text: item ? "Cambiar" : "Votar", onclick: () => go("category", { current: k }) }) : null);
    });
    return [
      back("← Categorías", "vote"),
      h("section", { class: "card", id: "reviewCard" }, h("h2", { text: "Mis votos" }), h("p", { text: "Tenés un voto por categoría. Mientras la categoría esté abierta podés cambiarlo." }), rows),
    ];
  }

  function renderLoadFailed() {
    return h("div", { class: "card stack", id: "loadFailed" },
      h("h2", { text: "No pudimos cargar el concurso" }),
      h("p", { text: "Revisá tu conexión e intentalo de nuevo." }),
      h("button", { class: "btn primary", id: "retryLoad", text: "Reintentar", onclick: () => { state.loadFailed = false; app.textContent = ""; app.appendChild(h("div", { class: "card", role: "status" }, h("h2", { text: "Cargando el concurso…" }))); start(); } }));
  }

  /** Keeps what the person was typing where it was when a background change rebuilds the page. */
  function withFocusKept(build) {
    const a = document.activeElement;
    const id = a && a !== document.body && app.contains(a) ? a.id : "";
    const range = id && typeof a.selectionStart === "number" ? [a.selectionStart, a.selectionEnd] : null;
    build();
    if (!id) return;
    const again = document.getElementById(id);
    if (!again) return;
    try { again.focus({ preventScroll: true }); if (range && typeof again.setSelectionRange === "function") again.setSelectionRange(range[0], range[1]); } catch (e) { /* focus is a nicety */ }
  }

  function render() {
    app.setAttribute("aria-busy", "false");
    if (state.fatal) { app.textContent = ""; app.appendChild(h("div", { class: "msg err", role: "alert", text: state.fatal })); return; }
    if (state.loadFailed) { app.textContent = ""; app.appendChild(renderLoadFailed()); return; }
    who.textContent = state.auth.status === "unauthenticated" ? "" : state.auth.email;
    const parts = [...messages()];
    if (state.contest && state.contest.mode === "REHEARSAL") parts.push(h("div", { class: "msg", role: "status", id: "rehearsalNotice", text: "ENSAYO · Estas candidaturas y resultados no pertenecen al concurso real." }));
    const s = step();
    if (state.panel === "signin") parts.push(back(), h("p", { class: "sub", text: "Entrá con tu correo para continuar." }), ...identityCards());
    else if (state.panel === "register") parts.push(...renderRegister());
    else if (state.panel === "ficha") parts.push(...renderFicha());
    else if (state.panel === "vote") parts.push(...renderVote());
    else if (state.panel === "category" && curCat()) parts.push(...renderCategory(curCat()));
    else if (state.panel === "review") parts.push(...renderReview());
    else parts.push(...renderHome());
    if (s !== "READY" && state.panel === "signin") { /* the steps are the page */ }
    withFocusKept(() => {
      app.textContent = "";
      for (const p of parts.flat()) if (p) app.appendChild(p);
    });
    tickClock();
  }

  // ---- start -----------------------------------------------------------------------------------------------------------------
  async function showPublicEntry() {
    const joining = params.get("participar") === "1";
    const names = ["Más Elaborado", "Más Sexy", "Dúo o Grupo", "Más Divertido"];
    const preview = h("section", { class: "card stack", id: "preopenEntry" },
      h("a", { href: "/", text: "← Volver a URBANO Gaming" }),
      h("h2", { text: joining ? "Participar como concursante" : "Votar por tu disfraz favorito" }),
      h("p", { text: "Concurso de disfraces · The Pub by Beer Box" }),
      h("p", { text: "Sábado 31 de octubre de 2026 · Hora de Honduras" }),
      h("p", { text: "Inscripciones y fotos: 8:00–11:00 p. m. · Votación: 11:00 p. m.–medianoche." }),
      h("p", { role: "status", text: "El concurso todavía no está disponible. Podés conocer el recorrido; esta vista no guarda ni envía datos." }),
      h("p", { text: PRIZE_PROMISE + ". The Pub by Beer Box define y entrega los premios." }));
    if (joining) {
      const fields = registrationPreviewFields();
      preview.append(fields, h("p", { text: "Al inscribirte necesitarás tu cuenta, confirmar que sos mayor de edad y aceptar las reglas y el permiso de uso de la foto para el concurso. El uso promocional se decide aparte y es opcional." }),
        h("p", { text: "Después recibís un código; en la estación lo usamos para asociar tu foto. Te entregamos manualmente la foto y el enlace por WhatsApp." }));
    } else preview.append(h("ul", null, names.map(n => h("li", { text: n }))), h("p", { text: "Con tu cuenta podés votar por un disfraz en cada categoría y cambiarlo hasta medianoche. No necesitás estar en el local. No se permite votar por tu propia candidatura ni por tu grupo." }));
    preview.append(h("a", { class: "btn block", href: joining ? "/community-voting-round.html" : "/community-voting-round.html?participar=1", text: joining ? "Ver cómo votar" : "Ver cómo participar" }));
    app.textContent = ""; app.append(preview); app.setAttribute("aria-busy", "false");
    try {
      const response = await window.fetch(API + "contests/featured", { method: "GET", credentials: "omit", cache: "no-store" });
      const active = response.status === 200 ? window.UrbanoFeaturedContest.validate(await response.json()) : null;
      if (active) {
        preview.querySelector('[role="status"]').textContent = "El concurso ya está disponible para consultar. La inscripción y el voto dependen de su horario y estado.";
        preview.append(h("a", { class: "btn primary block", id: "continueContest", href: joining ? active.join : active.vote, text: joining ? "Continuar a la inscripción" : "Continuar al concurso" }));
      }
    } catch (e) { /* Informational entry stays usable without the provider. */ }
  }
  async function start() {
    if (!params.has("c")) { await showPublicEntry(); return; }
    if (!/^[0-9a-f-]{36}$/i.test(contestId)) { state.fatal = say("CONTEST_NOT_FOUND"); render(); return; }
    const first = await loadContest();
    if (!first.ok) {
      if (first.status === 404) { state.fatal = say("CONTEST_NOT_FOUND"); render(); return; }
      state.loadFailed = true; render(); return;
    }
    await applyContest(first.json);
    await refreshAuth();
    if (step() === "READY") await enterContest();
    for (const k of state.order) { const c = cat(k); if ((phaseOf(c) === "CLOSED" || phaseOf(c) === "ENDED") && c.pub.published) await loadResults(c); }
    if (state.panel === "ficha" && urlCode) loadFicha(urlCode);
    render();
    phaseSeenAt = performance.now();
    poller.start();
  }
  start();
})();
</script>
</body>
</html>
