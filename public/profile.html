<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title data-i18n="profile.title">Mi perfil — URBANO Gaming</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /*
   * Member profile — a READ-ONLY shell. It shows only what the existing identity already provides: the Gaming Member's display name,
   * the sign-in email (verified only when Auth explicitly says so), the date the member joined when the member route returns it, and a
   * link to the member's own predictions. Editing the name, a password, an avatar and a verified phone are NOT built yet: they are
   * listed as "Próximamente" and there is deliberately no form, input or button for any of them. No XP, points or prize appears here.
   */
  :root {
    --bg-page: #0a0a0a;
    --bg-card: #161616;
    --surface-2: #1c1c1c;
    --ink: #f5f1e8;
    --muted: #9b9689;
    --line: #2a2a2a;
    --gold: #d4af37;
    --primary-fill: #f5f1e8;
    --primary-ink: #0a0a0a;
    --exp-purple: #7c3aed;
    --exp-purple-glow: rgba(124, 58, 237, 0.45);
    --exp-purple-bg: rgba(124, 58, 237, 0.12);
    --good: #4ade80;
    --bad: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg-page); color: var(--ink); margin: 0; padding: 0 0 60px;
  }
  a { color: inherit; text-decoration: none; }
  [hidden] { display: none !important; }

  .shell-header {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 16px;
    max-width: 720px; margin: 0 auto; padding: 20px 20px 0;
  }
  .brand { display: inline-flex; align-items: center; gap: 10px; min-width: 0; }
  .brand-link { display: inline-flex; align-items: center; gap: 10px; border-radius: 6px; }
  .brand-mark-wrap { position: relative; display: inline-flex; width: 24px; height: 26px; flex-shrink: 0; }
  .brand-mark-wrap::before {
    content: ""; position: absolute; inset: -9px;
    background: radial-gradient(circle, var(--exp-purple-glow) 0%, transparent 70%);
    filter: blur(4px); z-index: 0;
  }
  .brand-mark { position: relative; z-index: 1; width: 24px; height: 26px; display: block; }
  .brand-word { font-size: 17px; font-weight: 700; color: var(--ink); letter-spacing: 0.02em; }
  .brand-badge {
    background: var(--exp-purple-bg); border: 1px solid var(--exp-purple);
    color: var(--exp-purple); font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; padding: 3px 8px; border-radius: 999px;
  }
  .header-tools { display: flex; align-items: center; gap: 12px; margin-left: auto; min-width: 0; max-width: 100%; }
  .lang-switch { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; flex-shrink: 0; }
  .lang-switch button {
    font-family: inherit; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: var(--muted);
    background: transparent; border: none; padding: 9px 12px; min-height: 44px; min-width: 44px; cursor: pointer;
  }
  .lang-switch button[aria-pressed="true"] { color: var(--primary-ink); background: var(--primary-fill); }
  .account-group { display: flex; align-items: center; gap: 8px; min-width: 0; justify-content: flex-end; position: relative; }
  .account-group .signin-btn { flex: 0 1 auto; min-width: 0; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .account-group [data-urbano-signout] { flex: none; white-space: nowrap; padding: 12px 4px; color: var(--muted); }
  a.signin-btn { display: inline-block; text-align: center; }
  .signin-btn {
    font-family: inherit; font-size: 13px; font-weight: 600; padding: 9px 16px;
    border-radius: 8px; border: 1px solid var(--ink); background: transparent;
    color: var(--ink); cursor: pointer;
  }
  .signin-btn:hover { background: var(--surface-2); }
  .signin-status {
    display: none; max-width: 720px; margin: 10px auto 0; padding: 10px 20px 0;
    font-size: 12.5px; color: var(--muted); line-height: 1.5;
  }

  .primary-nav {
    display: flex; gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch;
    max-width: 720px; margin: 16px auto 0; padding: 0 20px 2px;
  }
  .primary-nav::-webkit-scrollbar { display: none; }
  .nav-link {
    flex: 0 0 auto; font-size: 13px; font-weight: 600; color: var(--muted);
    padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line);
    white-space: nowrap;
  }

  .content { max-width: 720px; margin: 20px auto 0; padding: 0 20px; }
  .profile-title { font-size: 24px; font-weight: 800; margin: 0 0 16px; }

  .card {
    border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2);
    padding: 20px; margin: 0 0 18px;
  }
  .card.accent { border-color: var(--exp-purple); box-shadow: 0 0 0 1px rgba(124,58,237,0.14), 0 0 24px var(--exp-purple-glow); }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 14px; font-weight: 700; }

  .profile-fields { margin: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .profile-fields .row { min-width: 0; }
  .profile-fields dt { font-size: 12px; color: var(--muted); font-weight: 600; margin: 0 0 4px; }
  .profile-fields dd { margin: 0; font-size: 16px; font-weight: 600; overflow-wrap: anywhere; word-break: break-word; }

  .status-pill {
    font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,0.04);
    color: var(--muted); border: 1px solid var(--line); display: inline-block; margin-left: 8px; vertical-align: middle;
  }
  .status-pill.good { color: var(--good); border-color: var(--good); }

  .soon-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .soon-list li { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 14px; }

  .msg { font-size: 13px; color: var(--muted); margin: 0 0 12px; line-height: 1.5; }
  .btn-primary {
    font-family: inherit; font-size: 14px; font-weight: 700; padding: 13px 18px;
    border-radius: 10px; border: none; background: var(--primary-fill); color: var(--primary-ink);
    cursor: pointer; min-height: 46px;
  }
  .link-out { display: inline-block; margin-top: 16px; font-size: 14px; font-weight: 700; text-decoration: underline; padding: 8px 0; }
  .empty-state { text-align: center; color: var(--muted); padding: 40px 20px; }

  /* My participations: one card per participation, readable at 375 px. What was SENT, its state, and (only once evaluated) the level it
     reached are three separate lines; none of them is a prize. */
  .part-list { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 12px; }
  .club-crest { height: 24px; width: auto; max-width: 32px; object-fit: contain; flex: none; }
  .part-crests { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; }
  .part-crests-vs { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .part-item { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; background: var(--bg-card); min-width: 0; }
  .part-limit { margin: 12px 0 0; }
  .part-truncated { color: var(--ink); border-left: 3px solid var(--gold); padding: 6px 10px; font-weight: 600; }
  .part-item h3 { margin: 0 0 4px; font-size: 16px; font-weight: 800; overflow-wrap: anywhere; text-wrap: balance; }
  .part-item .part-comp { margin: 0 0 8px; font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
  .part-item p, .part-item li { font-size: 13.5px; line-height: 1.55; margin: 0 0 4px; overflow-wrap: anywhere; }
  .part-item ul { margin: 8px 0; padding-left: 18px; }
  .part-item .part-state { font-weight: 700; }
  .part-item .part-eval { color: var(--ink); }
  .part-edit { display: inline-block; margin-top: 6px; font-size: 13.5px; font-weight: 700; text-decoration: underline; padding: 10px 0; min-height: 44px; }
  .part-edit:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  footer {
    max-width: 720px; margin: 48px auto 0; padding: 20px; text-align: center;
    color: var(--muted); font-size: 12px; border-top: 1px solid var(--line);
  }
  footer p { margin: 0 0 6px; }
  footer a { color: var(--ink); text-decoration: underline; padding: 8px 2px; }

  .brand-link:focus-visible, .brand-badge:focus-visible, .nav-link:focus-visible, .lang-switch button:focus-visible,
  .signin-btn:focus-visible, .account-group [data-urbano-signout]:focus-visible, .btn-primary:focus-visible,
  .link-out:focus-visible, footer a:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  @media (max-width: 640px) {
    .shell-header { padding: 16px 16px 0; }
    /* On a phone the tools are not one block: the header wraps into two rows. Row 1 is the brand and the language selector; row 2 is
       the account group alone, the full width, right-aligned, so a real name has room before it is ever truncated. */
    .header-tools { display: contents; }
    .lang-switch { margin-left: auto; }
    .account-group { flex: 1 1 100%; }
    .brand-word { font-size: 15px; }
    .signin-btn { font-size: 12px; padding: 9px 12px; white-space: nowrap; }
    .primary-nav { padding: 0 16px 2px; }
    .content { padding-left: 16px; padding-right: 16px; }
  }
</style>
</head>
<body>

<header class="shell-header">
  <div class="brand">
    <a class="brand-link" href="https://urbanohn.com/" rel="noopener" aria-label="URBANO — ir a urbanohn.com" data-i18n-attr="aria-label:shell.brand.urbano">
      <span class="brand-mark-wrap"><img class="brand-mark" src="/urbano-mark.svg" alt="" /></span>
      <span class="brand-word">URBANO</span>
    </a>
    <a class="brand-badge" href="/" aria-label="URBANO Gaming — inicio" data-i18n-attr="aria-label:shell.brand.gaming">Gaming</a>
  </div>
  <div class="header-tools">
    <div class="lang-switch" role="group" aria-label="Idioma" data-i18n-attr="aria-label:shell.lang.label">
      <button type="button" data-lang="es" lang="es" aria-pressed="true" aria-label="Cambiar a español" data-i18n-attr="aria-label:shell.lang.es">ES</button>
      <button type="button" data-lang="en" lang="en" aria-pressed="false" aria-label="Cambiar a inglés" data-i18n-attr="aria-label:shell.lang.en">EN</button>
    </div>
    <div class="account-group">
      <a class="signin-btn" id="account-link" href="/profile.html" hidden></a>
      <button class="signin-btn" id="btn-signin" style="visibility:hidden">Iniciar sesión / Crear cuenta</button>
    </div>
  </div>
</header>
<p class="signin-status" id="signin-status"></p>

<nav class="primary-nav" aria-label="Navegación principal" data-i18n-attr="aria-label:shell.nav.label">
  <a class="nav-link" href="/" data-i18n="shell.nav.home">Inicio</a>
  <a class="nav-link" href="/#play" data-i18n="shell.nav.play">Jugar</a>
  <a class="nav-link" href="/#experiences" data-i18n="shell.nav.experiences">Experiencias</a>
  <a class="nav-link" href="/leaderboards.html" data-i18n="shell.nav.leaderboards">Clasificaciones</a>
  <a class="nav-link" href="/rewards.html" data-i18n="shell.nav.rewards">Premios</a>
</nav>

<main class="content" id="content">
  <h1 class="profile-title" data-i18n="profile.heading">Mi perfil</h1>
  <div id="profile-body" aria-live="polite">
    <div class="empty-state" data-i18n="profile.loading">Cargando tu perfil…</div>
  </div>
</main>

<footer>
  <p data-i18n="shell.footer.part">URBANO Gaming — parte de URBANO</p>
  <p><a href="/legal.html" data-i18n="shell.footer.legal">Términos, privacidad y reglas</a></p>
  <p>Powered by <a href="https://www.tecnomovi.com/" rel="noopener" aria-label="TecnoMovi — ir a tecnomovi.com" data-i18n-attr="aria-label:shell.footer.tecnomovi">TecnoMovi</a></p>
</footer>

    "profile.part.state.cancelled": "Estado: el partido fue cancelado.",
    "profile.part.state.evaluated": "Estado: evaluada.",
    "profile.part.state.locked.disabled": "Estado: guardada. Esta sede ya no recibe cambios.",
    "profile.part.state.locked.venue": "Estado: guardada. Esta sede no está disponible por ahora, así que no se pueden hacer cambios.",
    "profile.part.state.locked.offer": "Estado: guardada. Esta sede no tiene un premio válido configurado, así que no recibe cambios.",
    "profile.part.state.locked.generic": "Estado: guardada. Por ahora no se puede cambiar.",
    "profile.part.eval.level": "Nivel alcanzado: {level}",
    "profile.part.eval.none": "No alcanzó ningún nivel.",
    "profile.part.eval.legacy": "Resultado evaluado.",
    "profile.part.edit": "Editar en URBANO Score →",
    "profile.part.ans.score": "Marcador: {home}–{away}",
    "profile.part.ans.first": "Primer equipo: {value}",
    "profile.part.ans.scorer": "Goleador: {value}",
    "profile.part.ans.minute": "Minuto: {value}",
    "profile.part.none.first": "Ningún equipo anotará",
    "profile.part.none.scorer": "Ningún jugador marcará",
    "profile.part.none.minute": "No habrá goles en tiempo reglamentario",
    "profile.part.scorerUnknown": "jugador no disponible",
    "profile.err": "No pudimos cargar tu perfil. Recargá la página para intentar de nuevo."
  };
  var SERVER = {};
  function own(object, key) { return Object.prototype.hasOwnProperty.call(object, key); }
  function t(key, vars) {
    var template = own(ES, key) ? ES[key] : key;
    return String(template).replace(/\{(\w+)\}/g, function (whole, name) {
      if (!vars || !own(vars, name)) return whole;
      var value = vars[name];
      if (value && typeof value === "object" && typeof value.$t === "string") return t(value.$t);
      return value === null || value === undefined ? "" : String(value);
    });
  }
  w.UrbanoI18n = {
    fallback: true,
    STORAGE_KEY: "urbano.lang",
    DEFAULT_LANG: "es",
    LANGS: ["es"],
    getLang: function () { return "es"; },
    setLang: function () { return false; },
    t: t,
    has: function (key) { return own(ES, key); },
    locale: function () { return "es-HN"; },
    serverMessageKey: function (message) { return own(SERVER, message) ? SERVER[message] : null; },
    onChange: function () { return function () {}; },
    apply: function () {},
    dictionary: function () { return { es: ES, en: {} }; }
  };
  var groups = w.document.querySelectorAll(".lang-switch");
  for (var i = 0; i < groups.length; i++) { groups[i].hidden = true; groups[i].style.display = "none"; }
})(window);
</script>
<script src="/urbanoAuth.js"></script>
<script>
UrbanoAuth.attachSignInButton(
  document.getElementById("btn-signin"),
  document.getElementById("signin-status"),
  { accountLink: document.getElementById("account-link") }
);

const t = (key, vars) => UrbanoI18n.t(key, vars);
const body = document.getElementById("profile-body");

// Sets a node's text from the language table and remembers the key so a change of language re-translates it in place.
function setText(node, key, vars) {
  node.setAttribute("data-i18n", key);
  if (vars) node.setAttribute("data-i18n-vars", JSON.stringify(vars));
  node.textContent = t(key, vars);
  return node;
}

function make(tag, className, key) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (key) setText(node, key);
  return node;
}

function messageCard(key, buttonKey, onClick) {
  const card = make("div", "card accent");
  card.appendChild(make("p", "msg", key));
  if (buttonKey) {
    const button = make("button", "btn-primary", buttonKey);
    button.type = "button";
    button.addEventListener("click", onClick);
    card.appendChild(button);
  }
  return card;
}

// An instant with its time zone written out (the device's own); the language of month names follows the page. Redrawn on a change of language.
function formatInstant(iso) {
  try {
    return new Intl.DateTimeFormat(UrbanoI18n.locale(), { year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit", second: "2-digit", timeZoneName: "short" }).format(new Date(iso));
  } catch (err) {
    return new Date(iso).toLocaleString(UrbanoI18n.locale());
  }
}
function setTimeText(node, key, iso) {
  node.removeAttribute("data-i18n");
  node.removeAttribute("data-i18n-vars");
  node.setAttribute("data-time-key", key);
  node.setAttribute("data-time-iso", iso);
  node.textContent = t(key, { time: formatInstant(iso) });
  return node;
}
function renderTimeNodes(scope) {
  for (const node of scope.querySelectorAll("[data-time-key]")) {
    node.textContent = t(node.getAttribute("data-time-key"), { time: formatInstant(node.getAttribute("data-time-iso")) });
  }
}

function validTime(iso) { return typeof iso === "string" && !Number.isNaN(new Date(iso).getTime()); }

// ---- My participations: the member's own history, from the authenticated read-only route. Nothing is sent to it but the session. ----
function answerLines(part) {
  const a = part.answers;
  const lines = [["profile.part.ans.score", { home: a.scoreline.home, away: a.scoreline.away }]];
  if (a.firstTeam) {
    const team = a.firstTeam.team === "HOME" ? (part.match.homeTeam || { $t: "profile.part.home" }) : (part.match.awayTeam || { $t: "profile.part.away" });
    lines.push(["profile.part.ans.first", { value: a.firstTeam.kind === "NONE" ? { $t: "profile.part.none.first" } : team }]);
  }
  if (a.goalscorer) {
    lines.push(["profile.part.ans.scorer", { value: a.goalscorer.kind === "NONE" ? { $t: "profile.part.none.scorer" } : (a.goalscorer.playerName ? (typeof a.goalscorer.jerseyNumber === "number" ? a.goalscorer.jerseyNumber + " · " + a.goalscorer.playerName : a.goalscorer.playerName) : { $t: "profile.part.scorerUnknown" }) }]);
  }
  if (a.goalMinute) {
    const m = a.goalMinute;
    lines.push(["profile.part.ans.minute", { value: m.kind === "NONE" ? { $t: "profile.part.none.minute" } : (m.stoppage ? m.regulation + "+" + m.stoppage + "'" : m.regulation + "'") }]);
  }
  return lines;
}

// Why a participation that is still inside its window cannot be changed (the server's own admission rules, as the history reports them).
const LOCK_STATE_KEYS = { ACTIVATION_DISABLED: "profile.part.state.locked.disabled", VENUE_UNAVAILABLE: "profile.part.state.locked.venue", OFFER_UNAVAILABLE: "profile.part.state.locked.offer" };

function renderParticipation(part) {
  const item = make("li", "part-item");
  item.setAttribute("data-participation", part.matchId);
  // The crests (decoration, from the central module) sit above the title, which names both teams in text; no crest, nothing is drawn.
  const homeCrest = window.UrbanoClubCrests && part.match.homeTeam ? window.UrbanoClubCrests.element(part.match.homeTeam) : null;
  const awayCrest = window.UrbanoClubCrests && part.match.awayTeam ? window.UrbanoClubCrests.element(part.match.awayTeam) : null;
  if (homeCrest || awayCrest) {
    const crests = make("div", "part-crests");
    crests.setAttribute("aria-hidden", "true");
    if (homeCrest) crests.appendChild(homeCrest);
    if (homeCrest && awayCrest) { const vs = make("span", "part-crests-vs"); vs.textContent = "vs"; crests.appendChild(vs); }
    if (awayCrest) crests.appendChild(awayCrest);
    item.appendChild(crests);
  }
  const title = document.createElement("h3");
  setText(title, "profile.part.match", { home: part.match.homeTeam || { $t: "profile.part.home" }, away: part.match.awayTeam || { $t: "profile.part.away" } });
  item.appendChild(title);
  const comp = document.createElement("p");
  comp.className = "part-comp";
  comp.textContent = part.match.competition;
  item.appendChild(comp);

  const venue = document.createElement("p");
  setText(venue, "profile.part.venue", { venue: part.venueName || { $t: "profile.part.venueUnknown" } });
  item.appendChild(venue);
  if (validTime(part.match.kickoffAt)) item.appendChild(setTimeText(document.createElement("p"), "profile.part.start", part.match.kickoffAt));

  // What was SENT: the level that was attempted (never a prize), when, and the answers.
  const level = document.createElement("p");
  setText(level, "profile.part.level", { level: { $t: part.attemptedLevel ? "profile.part.level." + part.attemptedLevel : "profile.part.level.legacy" } });
  item.appendChild(level);
  if (validTime(part.sentAt)) item.appendChild(setTimeText(document.createElement("p"), "profile.part.sent", part.sentAt));
  if (validTime(part.lastChangedAt)) item.appendChild(setTimeText(document.createElement("p"), "profile.part.changed", part.lastChangedAt));
  const answers = document.createElement("ul");
  for (const [key, vars] of answerLines(part)) {
    const li = document.createElement("li");
    setText(li, key, vars);
    answers.appendChild(li);
  }
  item.appendChild(answers);

  // The state of the participation, and (only once the match was evaluated) the level it reached. The two are different lines.
  const state = document.createElement("p");
  state.className = "part-state";
  const evaluated = part.evaluation && part.evaluation.evaluated === true;
  // "Open" (and the promise that it can be edited) is said only when a new edit would really be admitted; otherwise the reason is.
  setText(state, evaluated ? "profile.part.state.evaluated"
    : part.state === "CANCELLED" ? "profile.part.state.cancelled"
    : part.state === "CLOSED" ? "profile.part.state.closed"
    : part.editable === true ? "profile.part.state.open"
    : (LOCK_STATE_KEYS[part.editBlockedReason] || "profile.part.state.locked.generic"));
  item.appendChild(state);
  if (evaluated) {
    const reached = document.createElement("p");
    reached.className = "part-eval";
    if (part.attemptedLevel === null) setText(reached, "profile.part.eval.legacy");
    else if (part.evaluation.reachedLevel) setText(reached, "profile.part.eval.level", { level: { $t: "profile.part.level." + part.evaluation.reachedLevel } });
    else setText(reached, "profile.part.eval.none");
    item.appendChild(reached);
  }
  if (part.editable === true) {
    const edit = make("a", "part-edit", "profile.part.edit");
    edit.href = "/soccer-predictions.html";
    item.appendChild(edit);
  }
  return item;
}

async function loadParticipations(host, mine) {
  host.replaceChildren(make("p", "msg", "profile.part.loading"));
  let result;
  try {
    const token = await UrbanoAuth.getAccessToken();
    const response = await fetch("/api/gaming/predictions/participations", { headers: token ? { authorization: "Bearer " + token } : {}, cache: "no-store" });
    if (!response.ok) throw new Error("participations " + response.status);
    result = await response.json();
  } catch (err) {
    if (mine !== generation) return;
    console.error("Profile: failed to load participations:", err);
    host.replaceChildren(make("p", "msg", "profile.part.err"));
    return;
  }
  if (mine !== generation) return;
  const list = Array.isArray(result && result.participations) ? result.participations : [];
  if (list.length === 0) { host.replaceChildren(make("p", "msg", "profile.part.empty")); return; }
  // The list is the newest `limit` participations. Say so, and say when there are older ones: a short list is never the whole history.
  const limit = Number.isInteger(result.limit) && result.limit > 0 ? result.limit : null;
  const notes = [];
  if (result.truncated === true) {
    const truncated = make("p", "msg part-limit part-truncated", "");
    truncated.setAttribute("role", "status");
    setText(truncated, "profile.part.truncated", { n: limit !== null ? limit : list.length });
    notes.push(truncated);
  } else if (limit !== null) {
    const note = make("p", "msg part-limit", "");
    setText(note, "profile.part.limit", { n: limit });
    notes.push(note);
  }
  const ul = document.createElement("ul");
  ul.className = "part-list";
  for (const part of list) ul.appendChild(renderParticipation(part));
  host.replaceChildren(...notes, ul);
}

function formatMemberSince(iso) {
  // The time-zone policy matches the Home page (Tegucigalpa); only the language of the month name follows the page language.
  return new Date(iso).toLocaleDateString(UrbanoI18n.locale(), { year: "numeric", month: "long", day: "numeric", timeZone: "America/Tegucigalpa" });
}

// Email verification is shown ONLY from what Auth explicitly reports. Having a session never counts as verification; when Auth does
// not say, the page says "not available" rather than guessing either way.
function verificationKey(emailVerified) {
  return emailVerified === true ? "profile.verified" : emailVerified === false ? "profile.unverified" : "profile.unknown";
}

function renderProfile(profile, mine) {
  const identity = make("div", "card accent");
  const list = document.createElement("dl");
  list.className = "profile-fields";

  const row = (labelKey) => {
    const wrap = make("div", "row");
    wrap.appendChild(make("dt", "", labelKey));
    const dd = document.createElement("dd");
    wrap.appendChild(dd);
    list.appendChild(wrap);
    return dd;
  };

  row("profile.name").textContent = profile.displayName;

  const emailDd = row("profile.email");
  emailDd.appendChild(document.createTextNode((profile.email || "") + " ")); // a real space, so a screen reader hears the address and its state apart
  const status = make("span", "status-pill" + (profile.emailVerified === true ? " good" : ""), verificationKey(profile.emailVerified));
  status.setAttribute("data-profile-email-status", "");
  emailDd.appendChild(status);

  const sinceDd = row("profile.since");
  if (profile.memberSince) {
    sinceDd.setAttribute("data-since", profile.memberSince);
    sinceDd.textContent = formatMemberSince(profile.memberSince);
  } else {
    setText(sinceDd, "profile.unknown");
  }
  identity.appendChild(list);

  const link = make("a", "link-out", "profile.predictions");
  link.href = "/soccer-predictions.html";
  identity.appendChild(link);

  const soon = make("div", "card");
  soon.appendChild(make("h2", "", "profile.soon.heading"));
  soon.appendChild(make("p", "msg", "profile.readOnly"));
  const items = document.createElement("ul");
  items.className = "soon-list";
  for (const key of ["profile.soon.name", "profile.soon.password", "profile.soon.avatar", "profile.soon.phone"]) {
    const li = document.createElement("li");
    li.setAttribute("aria-disabled", "true");
    li.appendChild(make("span", "", key));
    li.appendChild(make("span", "status-pill", "profile.soon.pill"));
    items.appendChild(li);
  }
  soon.appendChild(items);

  // My participations: its own card, filled after the identity (so the profile never waits for it), and dropped if the person changed.
  const participations = make("div", "card");
  participations.setAttribute("data-participations", "");
  participations.appendChild(make("h2", "", "profile.part.heading"));
  participations.appendChild(make("p", "msg", "profile.part.intro"));
  const participationsHost = document.createElement("div");
  participationsHost.setAttribute("aria-live", "polite");
  participations.appendChild(participationsHost);

  body.replaceChildren(identity, participations, soon);
  loadParticipations(participationsHost, mine);
}

// Every build is numbered. Signing out, signing in as someone else, or a slow answer for a previous person is dropped instead of being
// painted: nothing that belonged to the previous identity ever stays on screen.
let generation = 0;

async function load() {
  const mine = ++generation;
  body.replaceChildren(make("div", "empty-state", "profile.loading"));
  let profile;
  try {
    profile = await UrbanoAuth.getProfile();
  } catch (err) {
    if (mine !== generation) return;
    console.error("Profile: failed to load:", err);
    body.replaceChildren(make("div", "empty-state", "profile.err"));
    return;
  }
  if (mine !== generation) return;
  if (profile.status === "authenticated") renderProfile(profile, mine);
  else if (profile.status === "profile_incomplete") body.replaceChildren(messageCard("profile.incomplete", "profile.incompleteBtn", () => UrbanoAuth.openSignIn()));
  else body.replaceChildren(messageCard("profile.signedOut", "profile.signedOutBtn", () => UrbanoAuth.openSignIn({ mode: "login" })));
}

load();

if (typeof UrbanoAuth.onIdentityReset === "function") {
  // The signed-in person changed (another tab signed in as someone else, or the session ended): nothing that belonged to the previous
  // person stays on screen, not even while the new person's data is still being looked up. A build already waiting is dropped.
  UrbanoAuth.onIdentityReset(() => {
    generation += 1;
    body.replaceChildren(make("div", "empty-state", "profile.loading"));
  }).catch(() => {});
}

if (typeof UrbanoAuth.onIdentityChange === "function") {
  // Clear at once (so no data of the previous identity remains while the new one loads), then load for whoever is signed in now.
  UrbanoAuth.onIdentityChange(() => {
    generation += 1;
    body.replaceChildren(make("div", "empty-state", "profile.loading"));
    load();
  }).catch(() => {});
}

UrbanoI18n.onChange(() => {
  renderTimeNodes(body);
  const since = body.querySelector("[data-since]");
  if (since) since.textContent = formatMemberSince(since.getAttribute("data-since"));
});
</script>

</body>
</html>
