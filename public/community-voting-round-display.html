<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Concurso de Disfraces — URBANO Gaming</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /*
   * Halloween Community Voting, the four-category contest — the public display (a screen at the venue). Its job is EXPOSURE: every shown costume, in turn,
   * in a fresh random order, with the name and the code its person chose. It receives no count, rank, total or "trending" signal from the server, so it
   * cannot show standing even by accident, and it says only what is true now (registration, voting not yet open, open, closed, the winners).
   * It needs no sign-in: nothing here is private.
   */
  :root { --bg-page: #000; --ink: #f5f1e8; --muted: #b5afa0; --halloween: #ff7a1a; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg-page); color: var(--ink); font-family: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; cursor: none; }
  #stage { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #title { padding: 2.4vh 4vw 0; text-align: center; font-size: clamp(18px, 2.6vw, 40px); font-weight: 800; color: var(--halloween); letter-spacing: 0.02em; }
  #photoWrap { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; padding: 1.5vh 4vw 0; min-height: 0; }
  #photo { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 18px; opacity: 0; transition: opacity 0.6s ease; box-shadow: 0 0 80px rgba(255, 122, 26, 0.25); }
  #photo.show { opacity: 1; }
  #category { align-self: center; margin-top: 1.2vh; max-width: 90vw; text-align: center; border: 2px solid var(--halloween); border-radius: 999px; padding: 0.6vh 1.6vw; font-size: clamp(16px, 2.4vw, 38px); font-weight: 800; }
  #caption { padding: 1.6vh 4vw 0; text-align: center; font-size: clamp(22px, 3.6vw, 60px); font-weight: 800; min-height: 1.3em; }
  #caption small { display: inline-block; margin-left: 0.6em; font-size: 0.55em; color: var(--muted); letter-spacing: 0.1em; font-weight: 700; }
  #when { padding: 1vh 5vw 3vh; text-align: center; font-size: clamp(15px, 2vw, 32px); color: var(--muted); min-height: 1.4em; line-height: 1.35; }
  #empty { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; padding: 8vw; font-size: clamp(24px, 4vw, 64px); font-weight: 800; line-height: 1.25; }
  #empty.show { display: flex; }
</style>
</head>
<body>
<div id="stage" aria-live="off">
  <div id="title">Concurso de disfraces · The Pub by Beer Box</div>
  <div id="category" hidden></div>
  <div id="photoWrap"><img id="photo" alt="" decoding="async" /></div>
  <div id="caption"></div>
  <div id="when"></div>
  <div id="empty"></div>
</div>

<script src="/communityVotingSlideshow.js"></script>
<script src="/communityVotingRound.js"></script>
<script>
(() => {
  "use strict";
  const R = CommunityVotingRound;
  const params = new URLSearchParams(window.location.search);
  const contestId = params.get("c") || "";
  const photo = document.getElementById("photo");
  const categoryEl = document.getElementById("category");
  const captionEl = document.getElementById("caption");
  const whenEl = document.getElementById("when");
  const emptyEl = document.getElementById("empty");
  const PREFIX = "/api/gaming/community-voting/rounds/";
  const rotation = CommunityVotingSlideshow.createRotation();
  const validId = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(contestId);
  let rotationSeconds = 8;
  let timer = null;
  let info = null;            // the contest as the server last described it
  let fetchedAt = 0;          // this page's monotonic clock at that answer
  let results = {};           // published winners per category
  let lastMode = "gallery";
  let phaseSeenAt = 0;
  let deadlineAsked = false;

  async function getJson(url) {
    try {
      const r = await window.fetch(url);
      if (r.status !== 200) return null;
      return await r.json();
    } catch (e) { return null; }
  }

  const resultsReady = () => !!info && info.categories.length > 0 && info.categories.every((c) => c.published || c.phase === "NOT_OPEN") && info.categories.some((c) => c.published);

  /** Every shown costume of every category, once per pass. The rotation keys on `alias`, so the category is part of it (numbers repeat across categories). */
  async function buildItems() {
    if (!info) return [];
    if (resultsReady()) {
      const out = [];
      for (const c of info.categories) {
        const res = results[c.key];
        if (!res || !res.published) continue;
        for (const it of res.items) out.push({ alias: `${c.key}:${it.alias}`, imageUrl: `${PREFIX}${c.instanceId}/photos/${it.alias}?v=full`, name: it.name, code: it.code, category: c.name.es, winner: true });
      }
      return out;
    }
    const lists = await Promise.all(info.categories.map((c) => getJson(`${PREFIX}${c.instanceId}/slideshow`).then((s) => ({ c, s }))));
    const out = [];
    for (const { c, s } of lists) {
      if (!s) continue;
      for (const it of s.items || []) out.push({ alias: `${c.key}:${it.alias}`, imageUrl: it.imageUrl, name: it.name, code: it.code, category: c.name.es, winner: false });
    }
    return out;
  }

  async function refreshList() {
    const items = await buildItems();
    if (items === null) return false; // keep cycling the last list rather than going blank
    rotation.load(items);
    return true;
  }

  function show(item) {
    if (!item || typeof item.imageUrl !== "string" || !item.imageUrl.startsWith(PREFIX)) return;
    photo.classList.remove("show");
    const next = new Image();
    next.onload = () => {
      photo.src = item.imageUrl;
      photo.alt = item.name || "Disfraz";
      categoryEl.textContent = item.winner ? `Ganador · ${item.category}` : item.category;
      categoryEl.hidden = false;
      captionEl.textContent = "";
      captionEl.appendChild(document.createTextNode(item.name || ""));
      if (item.code) { const small = document.createElement("small"); small.textContent = item.code; captionEl.appendChild(small); }
      photo.classList.add("show");
    };
    next.onerror = () => { /* a picture that fails to load is skipped; the next tick shows the next one */ };
    next.src = item.imageUrl;
  }

  // The line under the photograph comes from the SERVER's answer: the remaining time is derived from the server clock it reports (and advanced by this
  // page's monotonic clock), never from this screen's wall clock, and every time shown is the EVENT's (America/Tegucigalpa). A category that is only
  // SCHEDULED is announced as scheduled, never as open.
  function paintWhen() {
    if (!info) return;
    const cats = info.categories;
    const open = cats.filter((c) => c.phase === "OPEN");
    let line = "";
    if (resultsReady()) {
      const none = cats.filter((c) => c.published && (!results[c.key] || results[c.key].items.length === 0)).map((c) => c.name.es);
      line = none.length ? `Sin ganador: ${none.join(", ")}.` : "¡Gracias por participar!";
    } else if (open.length > 0) {
      const left = Math.max(...open.map((c) => (Number.isFinite(c.deadlineRemainingMs) ? c.deadlineRemainingMs - (performance.now() - fetchedAt) : 0)));
      line = left > 0 ? `Votación abierta · quedan ${R.formatCountdown(left)} · Votá desde tu teléfono en ${window.location.host}` : "El tiempo de votación terminó. ¡Gracias por participar!";
      if (left <= 0 && !deadlineAsked) { deadlineAsked = true; poller.refreshNow(); }
    } else if (cats.some((c) => c.phase === "CLOSED" || c.phase === "ENDED")) {
      line = "La votación cerró. ¡Gracias por participar! Los ganadores se anuncian después de revisar los resultados.";
    } else {
      const reg = info.registration || { phase: "NOT_SCHEDULED" };
      const first = cats[0];
      const opens = first ? R.atTime(first.votingOpensAt) : "";
      const voteLine = opens ? `La votación abre ${opens} (hora de Honduras).` : "La votación todavía no está abierta.";
      if (reg.phase === "NOT_OPEN") line = `${R.registrationNotice(reg)} ${voteLine}`;
      else if (reg.phase === "OPEN") line = `${R.registrationNotice(reg)} ${voteLine}`;
      else line = voteLine;
      if (first && first.tentative) line += " Horario tentativo.";
    }
    whenEl.textContent = line;
  }

  function applyContest(next) {
    const before = info ? info.phase : null;
    info = next;
    document.getElementById("title").textContent = info.mode === "REHEARSAL" ? "ENSAYO · No es el concurso real" : "Concurso de disfraces · The Pub by Beer Box";
    fetchedAt = performance.now();
    deadlineAsked = false;
    if (info.phase !== before) phaseSeenAt = performance.now();
    paintWhen();
  }

  const poller = R.createPoller({
    now: () => performance.now(),
    setTimer: (fn, ms) => window.setTimeout(fn, ms),
    clearTimer: (handle) => window.clearTimeout(handle),
    isVisible: () => !document.hidden,
    random: () => Math.random(),
    delayFor: () => (info ? R.pollDelayMs({ phase: info.phase, published: info.phase === "RESULTS", sinceChangeMs: performance.now() - phaseSeenAt }) : R.POLL.settledMs),
    staleAfterMs: R.POLL.staleAfterMs,
    fetchOnce: async () => {
      const next = await getJson(`/api/gaming/community-voting/contests/${contestId}`);
      if (!next) return { ok: false };
      return {
        ok: true,
        apply: async () => {
          const cats = next.categories.filter((c) => c.published);
          const fresh = {};
          await Promise.all(cats.map(async (c) => { fresh[c.key] = await getJson(`${PREFIX}${c.instanceId}/results`); }));
          results = fresh;
          applyContest(next);
        },
      };
    },
  });

  async function tick() {
    const mode = resultsReady() ? "results" : "gallery";
    if (mode !== lastMode) { lastMode = mode; await refreshList(); } // from the gallery to the winners (or back) at once, not at the end of a pass
    else if (rotation.needsRefresh()) await refreshList();
    const item = rotation.next();
    if (item) { emptyEl.classList.remove("show"); show(item); }
    else {
      emptyEl.textContent = info && info.registration && info.registration.phase === "OPEN" ? "¡Participá! Inscribite desde tu teléfono." : "Pronto verás aquí los disfraces del concurso.";
      emptyEl.classList.add("show"); photo.classList.remove("show"); categoryEl.hidden = true; captionEl.textContent = "";
    }
    clearTimeout(timer);
    timer = setTimeout(tick, rotationSeconds * 1000);
  }

  async function boot() {
    if (!validId) { emptyEl.textContent = "Enlace de pantalla no válido."; emptyEl.classList.add("show"); return; }
    const first = await getJson(`/api/gaming/community-voting/contests/${contestId}`);
    if (first) {
      const cats = first.categories.filter((c) => c.published);
      await Promise.all(cats.map(async (c) => { results[c.key] = await getJson(`${PREFIX}${c.instanceId}/results`); }));
      applyContest(first);
    }
    await refreshList();
    phaseSeenAt = performance.now();
    poller.start();
    document.addEventListener("visibilitychange", () => poller.onVisibility(!document.hidden));
    window.addEventListener("pageshow", (e) => { if (e && e.persisted) poller.refreshNow(); });
    window.addEventListener("online", () => poller.refreshNow());
    setInterval(paintWhen, 1000);
    tick();
  }
  boot();
})();
</script>
</body>
</html>
