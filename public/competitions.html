<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Competitions — URBANO Gaming</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /*
   * Competitions — Soccer Slice 001, Member/Captain journeys. Organizer
   * and Scorekeeper actions live on competitions-admin.html, mirroring
   * the predictions-admin.html/soccer-predictions.html split.
   *
   * UG-CR-GATE-081 Phase 3A: the URL and every invitation this page
   * builds now carry only opaque public_codes (see
   * lib/gaming/competitions/publicCode.ts and competitionsIntent.js) —
   * never a raw competitionId/competitionTeamId. A code is resolved to
   * the real id (via /api/gaming/competitions/resolve) only in memory,
   * for the one authenticated fetch that needs it; the real id is never
   * written back into the URL, an href, or any displayed/copyable text.
   */
  :root {
    --bg-page: #0a0a0a; --bg-card: #161616; --surface-2: #1c1c1c;
    --ink: #f5f1e8; --muted: #9b9689; --line: #2a2a2a;
    --gold: #d4af37; --gold-bg: rgba(212, 175, 55, 0.12);
    --primary-fill: #f5f1e8; --primary-ink: #0a0a0a;
    --exp-purple: #7c3aed; --exp-purple-glow: rgba(124, 58, 237, 0.45); --exp-purple-bg: rgba(124, 58, 237, 0.12);
    --good: #4ade80; --bad: #f87171;
  }
  * { box-sizing: border-box; }
  body { font-family: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-page); color: var(--ink); margin: 0; padding: 0 0 60px; font-size: 16px; }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 2px solid var(--exp-purple); outline-offset: 2px; border-radius: 4px; }
  /* flex-wrap: wrap — urbanoAuth.js inserts a "Hi, {displayName}" button
     plus a separate "Sign out" link as two more flex children here; a
     long display name can push their combined width past the viewport
     at mobile widths, and wrapping onto a second line (rather than
     overflowing horizontally) keeps both fully visible and clickable. */
  .shell-header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; row-gap: 8px; max-width: 720px; margin: 0 auto; padding: 20px 20px 0; }
  .brand { display: inline-flex; align-items: center; gap: 10px; }
  .brand-mark-wrap { position: relative; display: inline-flex; width: 24px; height: 26px; flex-shrink: 0; }
  .brand-mark-wrap::before { content: ""; position: absolute; inset: -9px; background: radial-gradient(circle, var(--exp-purple-glow) 0%, transparent 70%); filter: blur(4px); z-index: 0; }
  .brand-mark { position: relative; z-index: 1; width: 24px; height: 26px; display: block; }
  .brand-word { font-size: 17px; font-weight: 700; color: var(--ink); letter-spacing: 0.02em; }
  .brand-badge { background: var(--exp-purple-bg); border: 1px solid var(--exp-purple); color: var(--exp-purple); font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px; }
  .signin-btn { font-family: inherit; font-size: 13px; font-weight: 600; padding: 9px 16px; border-radius: 8px; border: 1px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; }
  .signin-btn:hover { background: var(--surface-2); }
  .signin-status { max-width: 720px; margin: 10px auto 0; padding: 10px 20px 0; font-size: 13px; color: var(--muted); line-height: 1.5; }
  .back-link { max-width: 720px; margin: 18px auto 0; padding: 0 20px; font-size: 14px; color: var(--muted); display: block; }
  .back-link:hover { color: var(--ink); }
  .content { max-width: 720px; margin: 20px auto 0; padding: 0 20px; }
  .card { border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); padding: 20px; margin: 0 0 18px; }
  .card.accent { border-color: var(--exp-purple); box-shadow: 0 0 0 1px rgba(124,58,237,0.14), 0 0 24px var(--exp-purple-glow); }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  h3 { font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin: 18px 0 8px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
  .field input, .field select { width: 100%; font-family: inherit; font-size: 16px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg-card); color: var(--ink); min-height: 44px; }
  .checkbox-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; font-size: 14px; }
  .checkbox-row input[type="checkbox"] { width: 20px; height: 20px; flex-shrink: 0; }
  .btn-primary { font-family: inherit; font-size: 15px; font-weight: 700; padding: 13px 18px; border-radius: 10px; border: none; background: var(--primary-fill); color: var(--primary-ink); cursor: pointer; width: 100%; min-height: 46px; }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-secondary { font-family: inherit; font-size: 14px; font-weight: 600; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; }
  .btn-share { font-family: inherit; font-size: 14px; font-weight: 600; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--exp-purple); background: var(--exp-purple-bg); color: var(--ink); cursor: pointer; }
  .status-pill { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; padding: 5px 12px; border-radius: 999px; background: rgba(255,255,255,0.04); color: var(--muted); border: 1px solid var(--line); display: inline-block; }
  .status-pill.good { color: var(--good); border-color: var(--good); }
  .status-pill.bad { color: var(--bad); border-color: var(--bad); }
  .status-pill.gold { color: var(--gold); border-color: var(--gold); }
  .team-list { display: flex; flex-direction: column; gap: 10px; }
  .team-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  button.team-row, div.team-row[role="button"] { width: 100%; text-align: left; font: inherit; color: inherit; background: var(--surface-2); cursor: pointer; }
  button.team-row:hover, div.team-row[role="button"]:hover { border-color: var(--exp-purple); }
  .fixture-card { border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .fixture-title { font-size: 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 6px; }
  .fixture-score { font-size: 22px; font-weight: 800; margin: 6px 0; }
  .msg { font-size: 14px; color: var(--muted); margin: 10px 0 0; line-height: 1.5; }
  .msg.error { color: var(--bad); }
  .msg.success { color: var(--good); }
  .empty-state { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 16px; }
  .record-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .record-row:last-child { border-bottom: none; }
  .invite-link-box { width: 100%; font-size: 13px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg-card); color: var(--muted); word-break: break-all; user-select: all; }
  .invite-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  @media (max-width: 640px) {
    .shell-header { padding: 16px 16px 0; } .brand-word { font-size: 15px; }
    .signin-btn { font-size: 12px; padding: 9px 12px; white-space: nowrap; }
    .back-link, .content { padding-left: 16px; padding-right: 16px; }
    .invite-actions { flex-direction: column; }
    .invite-actions button { width: 100%; }
  }
</style>
</head>
<body>

<div class="shell-header">
  <div class="brand">
    <span class="brand-mark-wrap"><img class="brand-mark" src="/urbano-mark.svg" alt="" /></span>
    <span class="brand-word">URBANO</span>
    <span class="brand-badge">Gaming</span>
  </div>
  <button class="signin-btn" id="btn-signin" style="visibility:hidden">Sign in with URBANO</button>
</div>
<p class="signin-status" id="signin-status"></p>

<a class="back-link" href="/">← Back to URBANO Gaming</a>

<div class="content" id="content">
  <div class="empty-state">Loading Competitions…</div>
</div>

<script src="/urbanoAuth.js"></script>
<script src="/competitionsIntent.js"></script>
<script>
UrbanoAuth.attachSignInButton(document.getElementById("btn-signin"), document.getElementById("signin-status"));

const content = document.getElementById("content");

// --- Return-to-intent (UG-CR-GATE-031, revised UG-CR-GATE-081 Phase 3A) ---
// This shell's own sign-in flow (urbanoAuth.js) is an IN-PAGE panel, never
// a redirect to a separate login page — so there is no "return trip"
// across a navigation boundary to engineer, and no page-to-page storage
// handoff is needed at all: the browser's own URL query string already
// survives the entire sign-in sequence untouched, for free. The one value
// placed in that URL is now an opaque public_code (never a raw
// competitionId/competitionTeamId — UG-CR-GATE-081 Phase 3A), validated
// before every use, and a fresh authenticated fetch (after resolving the
// code to a real id in memory) is what actually renders the page. No
// bearer token, OTP material, role/authority claim, mutation payload, or
// internal primary key is ever placed in the URL or in any persistent
// browser storage by this code.

/** Reflects the currently-viewed competition (and, for an opened invitation, its team) into the URL (same page, no navigation) using only server-confirmed opaque codes — never a raw id. */
function setIntentInUrl(competitionCode, teamCode) {
  const next = CompetitionsIntent.computeUrlWithIntent(window.location.href, competitionCode, teamCode || null);
  if (next) window.history.replaceState(null, "", next);
}

/** Clears any competition/team intent from the URL. */
function clearIntentFromUrl() {
  const next = CompetitionsIntent.computeUrlWithoutIntent(window.location.href);
  if (next) window.history.replaceState(null, "", next);
}

// currentCompetitionId/currentTeamId hold REAL ids, resolved once (either
// from an already-authenticated API response, which already carries the
// real id alongside its own public_code, or via one /resolve call when a
// fresh page load only has a code in the URL) — used only for the
// existing, unchanged internal fetch() calls below, which were never
// rewritten to take a code directly (UG-CR-GATE-081 Phase 3A: the fix is
// to what the BROWSER's own address bar and invitation text show, not to
// rewrite 24 already-reviewed, already-authorized API routes). Real ids
// are never written back into the URL or displayed.
let currentCompetitionId = null;
let currentTeamId = null;
// currentCompetitionCode/currentTeamCode hold the opaque codes actually
// reflected in the URL — kept alongside the real ids purely so the URL
// can be re-written (e.g. on every detail render) without re-resolving.
let currentCompetitionCode = CompetitionsIntent.getIntentCompetitionCodeFromSearch(window.location.search);
let currentTeamCode = currentCompetitionCode ? CompetitionsIntent.getIntentTeamCodeFromSearch(window.location.search) : null;

/** Human-readable label for a raw enum value this page renders (competition/fixture state, team status) — never the raw underscored string. */
function humanizeState(kind, value) {
  const labels = {
    competition: {
      DRAFT: "Not yet open",
      TEAM_REGISTRATION_OPEN: "Open for team registration",
      READY_TO_PUBLISH: "Finalizing bracket",
      PUBLISHED: "In progress",
      COMPLETE: "Complete",
      CANCELLED_WITHOUT_CHAMPION: "Cancelled",
    },
    teamStatus: {
      PENDING_ORGANIZER_APPROVAL: "Pending approval",
      ACCEPTED: "Accepted",
      REJECTED: "Not accepted",
    },
  };
  return (labels[kind] && labels[kind][value]) || String(value).replace(/_/g, " ");
}

/**
 * Builds the safe, non-identifying invitation deep link for an accepted
 * team (UG-CR-GATE-081 Phase 3A) — the competition's and team's own
 * opaque public_code only, never competitionId/competitionTeamId. Opening
 * this link resolves both codes server-side (GET /resolve) before the
 * existing, unchanged invitation-preview read ever runs.
 */
function buildInvitationLink(competitionCode, teamCode) {
  const url = new URL(window.location.href);
  url.search = "";
  url.searchParams.set("c", competitionCode);
  url.searchParams.set("t", teamCode);
  return url.toString();
}

/** Resolves an opaque competition/team code pair to real ids via the one other deliberately unauthenticated Competitions read. Returns null on any mismatch — never throws. */
async function resolveCodes(competitionCode, teamCode) {
  const qs = new URLSearchParams({ c: competitionCode });
  if (teamCode) qs.set("t", teamCode);
  const res = await fetch(`/api/gaming/competitions/resolve?${qs.toString()}`, { cache: "no-store" });
  if (res.status !== 200) return null;
  const json = await res.json().catch(() => null);
  if (!json || !json.competitionId) return null;
  return { competitionId: json.competitionId, teamId: json.teamId || null };
}

/** Copy-to-clipboard with a safe fallback for a browser/context without Clipboard API access — never throws, always reports success/failure via the returned boolean. */
async function copyTextSafely(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (err) {
    // fall through to the manual-selection fallback below
  }
  try {
    const textarea = document.createElement("textarea");
    textarea.value = text;
    textarea.style.position = "fixed";
    textarea.style.opacity = "0";
    document.body.appendChild(textarea);
    textarea.focus();
    textarea.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(textarea);
    return ok;
  } catch (err) {
    return false;
  }
}

function el(html) {
  const div = document.createElement("div");
  div.innerHTML = html.trim();
  return div.firstElementChild;
}

// Sets a status message's text and class from one query, always
// re-including the selector's own hook class in the new className —
// overwriting className outright would strip that hook class on the
// first call and make the element unfindable by the same selector on
// a later retry.
function setFormMsg(container, selector, text, kind) {
  const elm = container.querySelector(selector);
  const hookClass = selector.replace(/^[.#]/, "");
  elm.className = "msg " + hookClass + (kind ? " " + kind : "");
  elm.textContent = text;
}

async function authedFetch(path, options) {
  const token = await UrbanoAuth.getAccessToken();
  const headers = Object.assign({ "content-type": "application/json" }, (options && options.headers) || {});
  if (token) headers.authorization = "Bearer " + token;
  const res = await fetch(path, Object.assign({}, options, { headers }));
  const json = await res.json().catch(() => null);
  return { status: res.status, json };
}

function fixtureLabel(role) {
  return role === "SEMIFINAL_1" ? "Semifinal 1" : role === "SEMIFINAL_2" ? "Semifinal 2" : "Final";
}

function teamName(teams, teamId) {
  if (!teamId) return "TBD";
  const t = teams.find((x) => x.competitionTeamId === teamId);
  return t ? t.name : "?";
}

async function renderCompetitionList() {
  const res = await authedFetch("/api/gaming/competitions");
  // A 503 (or any other non-200 — UG-CR-GATE-036) must never be mistaken
  // for a genuine, successful empty catalog: this branch is checked
  // BEFORE reading .competitions, so a database-not-ready guard response
  // shows its own truthful message, never "no competitions have been
  // created yet." A real `200 []` still falls through to that message
  // below, unchanged.
  if (res.status !== 200) {
    const errDiv = el(`<div class="empty-state"></div>`);
    errDiv.textContent = (res.json && res.json.error) || "Failed to load competitions.";
    return errDiv;
  }
  const competitions = (res.json && res.json.competitions) || [];
  if (competitions.length === 0) {
    return el(`<div class="empty-state">No competitions have been created yet — ask an organizer to create one from the Competitions admin page.</div>`);
  }
  const wrap = el(`<div></div>`);
  wrap.appendChild(el(`<h2>Competitions</h2>`));
  for (const c of competitions) {
    const row = el(`<button type="button" class="team-row">
      <span class="competition-name"></span>
      <span class="status-pill ${c.state === "COMPLETE" ? "good" : c.state === "CANCELLED_WITHOUT_CHAMPION" ? "bad" : ""}">${humanizeState("competition", c.state)}</span>
    </button>`);
    row.querySelector(".competition-name").textContent = c.name;
    // The list response already carries both the real id (for the
    // existing, unchanged detail fetch) and this competition's own
    // public_code (for the URL/any later invitation) — no /resolve round
    // trip is needed for an already-authenticated click.
    row.addEventListener("click", () => {
      currentCompetitionId = c.competitionId;
      currentCompetitionCode = c.publicCode;
      currentTeamId = null;
      currentTeamCode = null;
      setIntentInUrl(c.publicCode, null);
      renderApp();
    });
    wrap.appendChild(row);
  }
  return wrap;
}

async function renderCompetitionDetail(competitionId, competitionCode, teamId) {
  const res = await authedFetch(`/api/gaming/competitions/${competitionId}`);
  if (res.status !== 200) {
    // A malformed, expired, or otherwise unresolvable intent (including
    // one that resolved to a real id this viewer can no longer access)
    // falls back safely: cleared from both state and the URL, with an
    // explicit path back to the list rather than a dead-end message.
    currentCompetitionId = null; currentCompetitionCode = null;
    currentTeamId = null; currentTeamCode = null;
    clearIntentFromUrl();
    const wrap = el(`<div></div>`);
    wrap.appendChild(el(`<a class="back-link" style="padding:0;margin:0 0 14px;" id="back-to-list">← All competitions</a>`));
    const errDiv = el(`<div class="empty-state"></div>`);
    errDiv.textContent = (res.json && res.json.error) || "This competition could not be found.";
    wrap.appendChild(errDiv);
    wrap.querySelector("#back-to-list").addEventListener("click", () => { renderApp(); });
    return wrap;
  }
  const view = res.json.view;
  const {
    competition, teams, pendingTeamProposals, rejectedTeamProposals, myTeamProposals, fixtures,
    myRegistration, myTeamMembership, myTeamMemberships, myPendingJoinRequest, myPersistentRecords, isOrganizer,
  } = view;
  const authState = await UrbanoAuth.getState();
  const myGamingMemberId = authState.gamingMemberId;

  // Reflect the server-CONFIRMED competition's own public_code (never the
  // real id) back into the URL, so a reload/bookmark/share of this exact
  // page returns here again. teamCode is only ever set here to a value
  // that came from an ALREADY-validated intent (see initializePage
  // below) — this call never re-derives it from anything untrusted.
  currentCompetitionCode = competition.publicCode;
  setIntentInUrl(competition.publicCode, currentTeamCode || null);

  const wrap = el(`<div></div>`);
  wrap.appendChild(el(`<a class="back-link" style="padding:0;margin:0 0 14px;" id="back-to-list">← All competitions</a>`));
  wrap.querySelector("#back-to-list").addEventListener("click", () => {
    currentCompetitionId = null; currentCompetitionCode = null; currentTeamId = null; currentTeamCode = null;
    clearIntentFromUrl(); renderApp();
  });

  const headerCard = el(`<div class="card accent">
    <h1 class="competition-title"></h1>
    <span class="status-pill ${competition.state === "COMPLETE" ? "good" : competition.state === "CANCELLED_WITHOUT_CHAMPION" ? "bad" : ""}">${humanizeState("competition", competition.state)}</span>
    ${competition.cancelledReason ? `<p class="msg error cancelled-reason"></p>` : ""}
  </div>`);
  headerCard.querySelector(".competition-title").textContent = competition.name;
  if (competition.cancelledReason) headerCard.querySelector(".cancelled-reason").textContent = competition.cancelledReason;
  wrap.appendChild(headerCard);

  const acceptingRegistration = competition.state === "TEAM_REGISTRATION_OPEN" || competition.state === "READY_TO_PUBLISH" || competition.state === "PUBLISHED";
  const teamRegistrationOpen = competition.state === "TEAM_REGISTRATION_OPEN";

  // --- Registration — a separate, distinct state from team proposal/
  // membership (URBANO identity continuity: these must never be
  // visually conflated). ---
  if (!myRegistration) {
    if (!acceptingRegistration) {
      // DRAFT is the only pre-registration state that will ever genuinely
      // open later — COMPLETE and CANCELLED_WITHOUT_CHAMPION are terminal,
      // and telling a viewer registration "opens once the organizer opens
      // team registration" for either would contradict the status pill
      // and cancelledReason already shown above.
      if (competition.state === "DRAFT") {
        wrap.appendChild(el(`<div class="card"><p class="msg">Registration opens once the organizer opens team registration for this tournament.</p></div>`));
      }
    } else {
      const regCard = el(`<div class="card">
        <h2>Register</h2>
        <div class="checkbox-row"><input type="checkbox" id="reg-adult" /> <label for="reg-adult">I self-attest that I am an adult.</label></div>
        <button class="btn-primary" id="btn-register">Register</button>
        <p class="msg" id="reg-msg" aria-live="polite"></p>
      </div>`);
      regCard.querySelector("#btn-register").addEventListener("click", async () => {
        const isAdultSelfAttested = regCard.querySelector("#reg-adult").checked;
        const r = await authedFetch(`/api/gaming/competitions/${competitionId}/register`, { method: "POST", body: JSON.stringify({ isAdultSelfAttested }) });
        if (r.status === 200 || r.status === 201) renderApp();
        else setFormMsg(regCard, "#reg-msg", (r.json && r.json.error) || "Failed to register.", "error");
      });
      wrap.appendChild(regCard);
    }
    return wrap;
  }

  // --- Team proposal / pending / rejected — a separate, distinct state
  // from confirmed team membership. myTeamProposals never includes an
  // ACCEPTED row (that becomes myTeamMembership instead, via the SAME
  // atomic organizer-acceptance call — never a second, separate step). ---
  const myPendingProposal = myTeamProposals.find((t) => t.status === "PENDING_ORGANIZER_APPROVAL");
  const myRejectedProposals = myTeamProposals.filter((t) => t.status === "REJECTED");

  if (!myTeamMembership) {
    for (const rejected of myRejectedProposals) {
      const rejectedCard = el(`<div class="card">
        <h2>Your Team Proposal</h2>
        <p class="msg">Your proposed team <strong class="rejected-team-name"></strong> was not accepted.</p>
        ${rejected.rejectionReason ? `<p class="msg error"><span class="rejected-reason-text"></span></p>` : ""}
      </div>`);
      rejectedCard.querySelector(".rejected-team-name").textContent = rejected.name;
      if (rejected.rejectionReason) rejectedCard.querySelector(".rejected-reason-text").textContent = "Reason: " + rejected.rejectionReason;
      wrap.appendChild(rejectedCard);
    }

    if (myPendingProposal) {
      const pendingCard = el(`<div class="card"><h2>Your Team Proposal</h2><p class="msg">Your proposed team <strong class="pending-team-name"></strong> is pending the organizer's approval.</p></div>`);
      pendingCard.querySelector(".pending-team-name").textContent = myPendingProposal.name;
      wrap.appendChild(pendingCard);
    } else if (myPendingJoinRequest) {
      wrap.appendChild(el(`<div class="card"><p class="msg">Your request to join a team is pending the captain's approval.</p></div>`));
    } else {
      if (teamRegistrationOpen) {
        const createCard = el(`<div class="card">
          <h2>Create Your Team</h2>
          <p class="msg">Propose a team for this tournament — you'll be its captain once the organizer accepts it.</p>
          <div class="field"><label for="new-team-name">Team name</label><input id="new-team-name" placeholder="Team name" /></div>
          <button class="btn-primary" id="btn-create-team">Propose Team</button>
          <p class="msg" id="create-team-msg" aria-live="polite"></p>
        </div>`);
        createCard.querySelector("#btn-create-team").addEventListener("click", async () => {
          const name = createCard.querySelector("#new-team-name").value.trim();
          if (!name) { setFormMsg(createCard, "#create-team-msg", "A team name is required.", "error"); return; }
          const r = await authedFetch(`/api/gaming/competitions/${competitionId}/teams/propose`, { method: "POST", body: JSON.stringify({ name }) });
          if (r.status === 201) renderApp();
          else setFormMsg(createCard, "#create-team-msg", (r.json && r.json.error) || "Failed to propose team.", "error");
        });
        wrap.appendChild(createCard);
      }

      const teamsCard = el(`<div class="card"><h2>Join a Team</h2><div class="team-list" id="teams-list"></div><p class="msg" id="join-msg" aria-live="polite"></p></div>`);
      const list = teamsCard.querySelector("#teams-list");
      if (teams.length === 0) {
        list.appendChild(el(`<p class="msg">No accepted teams yet — check back soon, or create your own above.</p>`));
      }
      for (const t of teams) {
        const row = el(`<div class="team-row"><span class="team-name"></span><button class="btn-secondary" type="button">Request to Join</button></div>`);
        row.querySelector(".team-name").textContent = t.name;
        row.querySelector("button").addEventListener("click", async () => {
          const r = await authedFetch(`/api/gaming/competitions/${competitionId}/join-requests`, { method: "POST", body: JSON.stringify({ competitionTeamId: t.competitionTeamId }) });
          if (r.status === 201) renderApp();
          else setFormMsg(teamsCard, "#join-msg", (r.json && r.json.error) || "Failed to request.", "error");
        });
        list.appendChild(row);
      }
      wrap.appendChild(teamsCard);
    }
  } else {
    const myTeam = teams.find((t) => t.competitionTeamId === myTeamMembership.competitionTeamId);
    const isCaptain = myTeam && myTeam.captainGamingMemberId === myGamingMemberId;
    const teamCard = el(`<div class="card"><h2>Your Team</h2><p class="msg">You are a member of <strong class="my-team-name"></strong><span class="my-team-captain-suffix"></span></p>
      <div id="team-members-list"></div>
    </div>`);
    teamCard.querySelector(".my-team-name").textContent = myTeam ? myTeam.name : "?";
    teamCard.querySelector(".my-team-captain-suffix").textContent = isCaptain ? " — you are the captain." : ".";
    const membersList = teamCard.querySelector("#team-members-list");
    if (myTeamMemberships && myTeamMemberships.length > 0) {
      membersList.appendChild(el(`<h3>Confirmed Members</h3>`));
      for (const m of myTeamMemberships) {
        const memberRow = el(`<div class="record-row"><span class="member-name"></span>${m.gamingMemberId === myTeam.captainGamingMemberId ? '<span class="status-pill gold">Captain</span>' : ""}</div>`);
        memberRow.querySelector(".member-name").textContent = m.gamingMemberDisplayName || "Member";
        membersList.appendChild(memberRow);
      }
    }
    wrap.appendChild(teamCard);

    // --- Invitation — captain (or the organizer, for any accepted team
    // — accepted decisions §3) only, and only once the team is ACCEPTED
    // (myTeamMembership existing already guarantees this). Navigation
    // only, and now carries only opaque public_codes (UG-CR-GATE-081
    // Phase 3A/3D) — never competitionId/competitionTeamId. ---
    if (isCaptain && myTeam) {
      const link = buildInvitationLink(competition.publicCode, myTeam.publicCode);
      const inviteCard = el(`<div class="card">
        <h2>Invite Teammates</h2>
        <p class="msg"><strong class="invite-team-name"></strong> — ${humanizeState("competition", competition.state)}. Captain: you.</p>
        <p class="msg">Share this link so others can join. <strong>Opening it never adds anyone automatically</strong> — they still create their own URBANO identity, register, and request to join; you (or the organizer) still approve them.</p>
        <label for="invite-link" style="display:block;font-size:14px;color:var(--muted);margin-bottom:6px;font-weight:600;">Invitation link</label>
        <div class="invite-link-box" id="invite-link" tabindex="0"></div>
        <div class="invite-actions">
          <button class="btn-secondary" id="btn-copy-invite" type="button">Copy Link</button>
          <button class="btn-share" id="btn-share-invite" type="button" style="display:none;">Share…</button>
        </div>
        <p class="msg" id="invite-msg" aria-live="polite"></p>
      </div>`);
      inviteCard.querySelector(".invite-team-name").textContent = myTeam.name;
      inviteCard.querySelector("#invite-link").textContent = link;
      inviteCard.querySelector("#btn-copy-invite").addEventListener("click", async () => {
        const ok = await copyTextSafely(link);
        setFormMsg(inviteCard, "#invite-msg", ok ? "✓ Link copied — paste it anywhere you'd share it." : "Could not copy automatically — the link above is selected; press Ctrl/Cmd+C.", ok ? "success" : "error");
        if (!ok) {
          const sel = window.getSelection();
          const range = document.createRange();
          range.selectNodeContents(inviteCard.querySelector("#invite-link"));
          sel.removeAllRanges();
          sel.addRange(range);
        }
      });
      if (typeof navigator.share === "function") {
        const shareBtn = inviteCard.querySelector("#btn-share-invite");
        shareBtn.style.display = "";
        shareBtn.addEventListener("click", async () => {
          try {
            await navigator.share({ title: `Join ${myTeam.name} — ${competition.name}`, url: link });
            setFormMsg(inviteCard, "#invite-msg", "✓ Share sheet opened.", "success");
          } catch (err) {
            // A cancelled share sheet is not an error — leave the message untouched.
          }
        });
      }
      wrap.appendChild(inviteCard);
    }
  }

  // Pending join requests for any team this viewer captains — shown
  // independent of the captain's OWN membership status, since a captain
  // is assigned by the organizer at team-creation time and may not have
  // joined their own team's roster yet when applicants start arriving.
  const captainedTeams = teams.filter((t) => t.captainGamingMemberId === myGamingMemberId);
  for (const capTeam of captainedTeams) {
    const captainCard = el(`<div class="card"><h2>Pending Join Requests — <span class="captain-team-name"></span></h2><div id="pending-list-${capTeam.competitionTeamId}"><p class="msg">Loading…</p></div></div>`);
    captainCard.querySelector(".captain-team-name").textContent = capTeam.name;
    wrap.appendChild(captainCard);
    authedFetch(`/api/gaming/competitions/teams/${capTeam.competitionTeamId}/join-requests`).then((r) => {
      const listEl = captainCard.querySelector(`#pending-list-${capTeam.competitionTeamId}`);
      listEl.innerHTML = "";
      // Same non-200-first check as renderCompetitionList (UG-CR-GATE-036) —
      // a 503 must never be mistaken for a genuinely empty pending queue.
      if (r.status !== 200) {
        const errP = el(`<p class="msg error"></p>`);
        errP.textContent = (r.json && r.json.error) || "Failed to load pending join requests.";
        listEl.appendChild(errP);
        return;
      }
      const pending = (r.json && r.json.joinRequests) || [];
      if (pending.length === 0) { listEl.appendChild(el(`<p class="msg">No pending requests.</p>`)); return; }
      for (const jr of pending) {
        const row = el(`<div class="team-row"><span class="requester-name"></span>
          <span><button class="btn-secondary" type="button">Approve</button> <button class="btn-secondary" type="button">Reject</button></span></div>`);
        row.querySelector(".requester-name").textContent = jr.requestingGamingMemberDisplayName || "Member";
        const [approveBtn, rejectBtn] = row.querySelectorAll("button");
        approveBtn.addEventListener("click", async () => {
          await authedFetch(`/api/gaming/competitions/join-requests/${jr.competitionJoinRequestId}/decide`, { method: "POST", body: JSON.stringify({ decision: "APPROVE" }) });
          renderApp();
        });
        rejectBtn.addEventListener("click", async () => {
          await authedFetch(`/api/gaming/competitions/join-requests/${jr.competitionJoinRequestId}/decide`, { method: "POST", body: JSON.stringify({ decision: "REJECT" }) });
          renderApp();
        });
        listEl.appendChild(row);
      }
    });
  }

  // --- Fixtures ---
  if (fixtures.length > 0) {
    wrap.appendChild(el(`<h3>Fixtures</h3>`));
    for (const entry of fixtures) {
      const f = entry.fixture;
      const card = el(`<div class="fixture-card">
        <div class="fixture-title">${fixtureLabel(f.fixtureRole)} — ${f.state.replace(/_/g, " ")}</div>
        <div class="fixture-matchup"></div>
        <p class="msg">${new Date(f.scheduledAt).toLocaleString()}</p>
        ${entry.score ? `<div class="fixture-score">${entry.score.teamAScore} – ${entry.score.teamBScore}</div>` : ""}
        ${entry.finalization ? `<span class="status-pill ${entry.finalization.outcomeType === "VOID" ? "bad" : "good"}">${entry.finalization.outcomeType}</span>` : ""}
        <div id="fixture-actions-${f.competitionFixtureId}"></div>
      </div>`);
      card.querySelector(".fixture-matchup").textContent = `${teamName(teams, f.teamACompetitionTeamId)} vs ${teamName(teams, f.teamBCompetitionTeamId)}`;
      const actions = card.querySelector(`#fixture-actions-${f.competitionFixtureId}`);

      if (myTeamMembership && myTeamMembership.competitionTeamId === f.teamACompetitionTeamId || myTeamMembership && myTeamMembership.competitionTeamId === f.teamBCompetitionTeamId) {
        const myTeamForFixture = teams.find((t) => t.competitionTeamId === myTeamMembership.competitionTeamId);
        const isCaptainOfFixtureTeam = myTeamForFixture && myTeamForFixture.captainGamingMemberId === myGamingMemberId;

        // Roster declaration (UG-CR-GATE-082 per UG-CR-REV-053 #4):
        // selected from this team's own already-confirmed members
        // (myTeamMemberships, the same competition-scoped, name-
        // resolved list already rendered above under "Confirmed
        // Members") — never a raw gaming-member-ID text field. Checked
        // by default so declaring "everyone who showed up" is a single
        // click; a captain unchecks anyone not actually playing.
        // Scorekeeper appointment and evidence/correction remain the
        // organizer/scorekeeper admin surface (public/competitions-
        // admin.html), addressed there with the same competition-scoped
        // selection pattern.
        if (isCaptainOfFixtureTeam && (f.state === "SCHEDULED" || f.state === "ROSTER_DECLARED")) {
          if (entry.myRoster) {
            actions.appendChild(el(`<p class="msg success">Your roster is declared (${entry.myRoster.length} players).</p>`));
          } else {
            const rosterForm = el(`<div>
              <p class="msg">Declare your roster — select which confirmed team members are playing this fixture:</p>
              <div class="roster-checklist"></div>
              <button class="btn-secondary roster-submit" type="button">Declare Roster</button>
              <p class="msg roster-msg" aria-live="polite"></p>
            </div>`);
            const checklist = rosterForm.querySelector(".roster-checklist");
            for (const m of myTeamMemberships || []) {
              const checkboxLabel = el(`<label class="checkbox-row"><input type="checkbox" class="roster-member-check" checked /> <span class="roster-member-name"></span></label>`);
              checkboxLabel.querySelector(".roster-member-check").value = m.gamingMemberId;
              checkboxLabel.querySelector(".roster-member-name").textContent = m.gamingMemberDisplayName || "Member";
              checklist.appendChild(checkboxLabel);
            }
            rosterForm.querySelector(".roster-submit").addEventListener("click", async () => {
              const ids = [...rosterForm.querySelectorAll(".roster-member-check:checked")].map((c) => c.value);
              const r = await authedFetch(`/api/gaming/competitions/fixtures/${f.competitionFixtureId}/roster`, {
                method: "POST", body: JSON.stringify({ competitionTeamId: myTeamForFixture.competitionTeamId, gamingMemberIds: ids }),
              });
              if (r.status === 201) renderApp();
              else setFormMsg(rosterForm, ".roster-msg", (r.json && r.json.error) || "Failed to declare roster.", "error");
            });
            actions.appendChild(rosterForm);
          }
        }

        if (entry.myRoster && entry.myRoster.includes(myGamingMemberId) && (f.state === "ROSTER_DECLARED" || f.state === "CHECKIN_OPEN")) {
          const checkinBtn = el(`<button class="btn-secondary" type="button" style="margin-top:8px;">Check In</button>`);
          checkinBtn.addEventListener("click", async () => {
            const r = await authedFetch(`/api/gaming/competitions/fixtures/${f.competitionFixtureId}/checkin`, { method: "POST" });
            if (r.status === 200 || r.status === 201) { checkinBtn.disabled = true; checkinBtn.textContent = "Checked In"; }
          });
          actions.appendChild(checkinBtn);
        }

        // Raise a dispute — SQL (raise_competition_dispute_atomically) is
        // the sole authority on who may dispute what; every control below
        // is a usability match for that same rule, never a substitute for
        // it (UG-CR-GATE-032/033). Each control targets the real, current
        // fact id the role-aware projection (getCompetitionView) exposed
        // for exactly this purpose — never a fixture id, never a fact
        // belonging to anyone but the authenticated viewer themselves
        // (myDisputableFacts only ever carries the CALLER's own ids).
        function buildDisputeControl(label, targetFactType, targetFactId) {
          const wrapEl = el(`<div style="margin-top:8px;"></div>`);
          const disputeToggle = el(`<button class="btn-secondary" type="button">Dispute ${label}</button>`);
          const disputeForm = el(`<div style="display:none;margin-top:8px;">
            <label for="dispute-reason-${targetFactId}" style="display:block;font-size:14px;color:var(--muted);margin-bottom:6px;">Why are you disputing ${label}?</label>
            <textarea id="dispute-reason-${targetFactId}" class="dispute-reason" style="width:100%;min-height:60px;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg-card);color:var(--ink);margin-bottom:8px;"></textarea>
            <button class="btn-secondary dispute-submit" type="button">Submit Dispute</button>
            <p class="msg dispute-msg" aria-live="polite"></p>
          </div>`);
          disputeToggle.addEventListener("click", () => { disputeForm.style.display = "block"; disputeToggle.style.display = "none"; disputeForm.querySelector("textarea").focus(); });
          disputeForm.querySelector(".dispute-submit").addEventListener("click", async () => {
            const reason = disputeForm.querySelector(".dispute-reason").value.trim();
            if (!reason) { setFormMsg(disputeForm, ".dispute-msg", "A reason is required.", "error"); return; }
            const submitBtn = disputeForm.querySelector(".dispute-submit");
            submitBtn.disabled = true;
            const r = await authedFetch(`/api/gaming/competitions/fixtures/${f.competitionFixtureId}/disputes`, {
              method: "POST", body: JSON.stringify({ targetFactType, targetFactId, reason }),
            });
            if (r.status === 201) { setFormMsg(disputeForm, ".dispute-msg", "Dispute raised — the organizer will review it.", "success"); renderApp(); }
            else { submitBtn.disabled = false; setFormMsg(disputeForm, ".dispute-msg", (r.json && r.json.error) || "Failed to raise dispute.", "error"); }
          });
          wrapEl.appendChild(disputeToggle);
          wrapEl.appendChild(disputeForm);
          return wrapEl;
        }

        // The captain's own bounded SCORE control (UG-CR-GATE-032) — a
        // whole-fixture fact with no individual owner, so only a captain
        // of one of the two competing teams may dispute it; an ordinary
        // member never sees this control.
        if (isCaptainOfFixtureTeam && entry.score) {
          actions.appendChild(buildDisputeControl("the Score", "SCORE", entry.score.competitionFixtureEvidenceId));
        }

        // The accepted member dispute journey (UG-CR-GATE-033): an
        // authenticated member may dispute only their OWN current
        // participation attestation, goal attribution, or assist
        // attribution — never anyone else's, and never the shared SCORE.
        // entry.myDisputableFacts already carries only the viewer's own
        // ids (see getCompetitionView.ts), so no further filtering is
        // needed or possible here.
        if (entry.myDisputableFacts) {
          if (entry.myDisputableFacts.participationAttestationId) {
            actions.appendChild(buildDisputeControl("Your Participation", "PARTICIPATION_ATTESTATION", entry.myDisputableFacts.participationAttestationId));
          }
          entry.myDisputableFacts.goalEventIds.forEach((id, i) => {
            actions.appendChild(buildDisputeControl(`Your Goal${entry.myDisputableFacts.goalEventIds.length > 1 ? ` #${i + 1}` : ""}`, "GOAL_EVENT", id));
          });
          entry.myDisputableFacts.assistEventIds.forEach((id, i) => {
            actions.appendChild(buildDisputeControl(`Your Assist${entry.myDisputableFacts.assistEventIds.length > 1 ? ` #${i + 1}` : ""}`, "ASSIST_EVENT", id));
          });
        }
      }
      wrap.appendChild(card);
    }
  }

  // --- Persistent records ---
  if (myPersistentRecords && myPersistentRecords.length > 0) {
    const recCard = el(`<div class="card"><h2>Your Persistent Record</h2><div id="records-list"></div></div>`);
    const list = recCard.querySelector("#records-list");
    for (const r of myPersistentRecords) {
      const fixtureRole = fixtures.find((e) => e.fixture.competitionFixtureId === r.competitionFixtureId);
      list.appendChild(el(`<div class="record-row"><span>${fixtureRole ? fixtureLabel(fixtureRole.fixture.fixtureRole) : ""}</span><span>${r.appeared ? `${r.goals} goals, ${r.assists} assists` : "Did not appear"}</span></div>`));
    }
    wrap.appendChild(recCard);
  }

  return wrap;
}

// UrbanoAuth.onAuthStateChange only fires on a genuine Supabase Auth
// event (sign-in, sign-out, token refresh) — completeProfile() (the
// first-time "choose a display name" step) is a plain server call with
// no such event of its own, so a FIRST-TIME member's real transition
// into "authenticated" would otherwise never re-trigger renderApp(),
// leaving the "sign in to continue" screen stuck even though the member
// is, by then, genuinely signed in — including on a fresh landing with
// no invitation intent at all (this is squarely the "member without an
// invitation" journey's own sign-in step, so it must resolve on its
// own, not only when an invitation happened to be present). This poll
// is the local, narrowly-scoped fix: while showing the "sign in to
// continue" message, briefly re-check auth state until it resolves or a
// short timeout elapses — never fetching or mutating anything itself,
// and never running once the authenticated view is showing.
let intentAuthPollTimer = null;
function stopIntentAuthPoll() {
  if (intentAuthPollTimer) { clearInterval(intentAuthPollTimer); intentAuthPollTimer = null; }
}
function startIntentAuthPoll() {
  if (intentAuthPollTimer) return;
  let attempts = 0;
  intentAuthPollTimer = setInterval(async () => {
    attempts += 1;
    const state = await UrbanoAuth.getState();
    if (state.status === "authenticated") {
      stopIntentAuthPoll();
      renderApp();
    } else if (attempts >= 120) {
      stopIntentAuthPoll(); // ~60s at 500ms — give up rather than poll forever.
    }
  }, 500);
}

// UrbanoAuth.onAuthStateChange can fire more than once in quick
// succession while a session is first resolved (e.g. an initial-session
// event followed by a token-refresh), and each call independently
// clears then (asynchronously) re-populates #content — an older call's
// clear can land AFTER a newer call has already appended its own
// result, producing visibly duplicated content. renderGeneration makes
// every renderApp() call check, right before it actually touches the
// DOM, whether a newer call has since started; if so, it discards its
// own result instead of appending on top of one. Only ever the single
// latest call's output is ever shown.
let renderGeneration = 0;

/**
 * The unauthenticated invitation landing: a visitor who opened a
 * `?c=&t=` link before signing in must still see WHAT they were invited
 * to. Resolves both opaque codes first (UG-CR-GATE-081 Phase 3A — the
 * one other deliberately unauthenticated read), then calls the existing,
 * unchanged invitation-preview route with the resolved real ids — no
 * bearer token is ever attached, and neither call performs any mutation.
 * Rendered branded, truthful, and safe even for a fabricated/mismatched
 * pair or a pending/rejected team.
 */
async function renderInvitationPreview(competitionCode, teamCode) {
  const resolved = await resolveCodes(competitionCode, teamCode);
  if (!resolved || !resolved.teamId) {
    return el(`<div class="empty-state">This invitation link is no longer valid.</div>`);
  }
  const res = await fetch(`/api/gaming/competitions/${resolved.competitionId}/teams/${resolved.teamId}/invitation-preview`, { cache: "no-store" });
  const json = await res.json().catch(() => null);
  if (res.status !== 200 || !json || !json.preview) {
    const errDiv = el(`<div class="empty-state"></div>`);
    errDiv.textContent = (json && json.error) || "This invitation link is no longer valid.";
    return errDiv;
  }
  const p = json.preview;
  let statusLine;
  if (p.teamAccepted) {
    statusLine = `<p class="msg">Sign in with URBANO to register and request to join.</p>`;
  } else if (p.teamStatus === "PENDING_ORGANIZER_APPROVAL") {
    statusLine = `<p class="msg">This team is still awaiting the organizer's approval — you can create your URBANO identity now and come back once it's accepted.</p>`;
  } else {
    statusLine = `<p class="msg error">This team was not accepted for this tournament.</p>`;
  }
  const previewCard = el(`<div class="card accent">
    <h1>You're invited</h1>
    <p class="msg"><strong class="preview-competition-name"></strong> — <span class="status-pill">${humanizeState("competition", p.competitionState)}</span></p>
    <p class="msg">Team: <strong class="preview-team-name"></strong> <span class="status-pill ${p.teamAccepted ? "good" : p.teamStatus === "REJECTED" ? "bad" : ""}">${humanizeState("teamStatus", p.teamStatus)}</span></p>
    <p class="msg"><span class="preview-captain-name"></span></p>
    ${statusLine}
    <p class="msg">Opening this link does not add you to the team automatically — signing in only lets you register and ask to join; the captain or organizer still decides.</p>
  </div>`);
  previewCard.querySelector(".preview-competition-name").textContent = p.competitionName;
  previewCard.querySelector(".preview-team-name").textContent = p.teamName;
  previewCard.querySelector(".preview-captain-name").textContent = "Captain: " + (p.captainDisplayName || "Unknown");
  return previewCard;
}

async function renderApp() {
  const myGeneration = ++renderGeneration;
  const authState = await UrbanoAuth.getState();
  if (myGeneration !== renderGeneration) return;

  if (authState.status !== "authenticated") {
    // currentCompetitionCode/currentTeamCode, if present, came only from
    // a validated URL query parameter (or a prior successful, server-
    // confirmed view) — both are preserved as-is across sign-in (never
    // cleared here) so that completing the SAME in-page sign-in panel
    // naturally resumes this exact view once authentication actually
    // completes. Nothing is fetched, mutated, or auto-submitted while
    // signed out beyond the two safe, unauthenticated reads below (code
    // resolution, then invitation preview) plus the poll above, which
    // itself only ever calls the read-only getState().
    content.innerHTML = "";
    if (currentCompetitionCode && currentTeamCode) {
      const preview = await renderInvitationPreview(currentCompetitionCode, currentTeamCode);
      if (myGeneration !== renderGeneration) return;
      content.appendChild(preview);
      content.appendChild(el(`<div class="empty-state">Sign in with URBANO to continue.</div>`));
    } else {
      const message = currentCompetitionCode
        ? "Sign in with URBANO to continue to this competition."
        : "Sign in with URBANO to view and join Competitions.";
      content.appendChild(el(`<div class="empty-state">${message}</div>`));
    }
    startIntentAuthPoll();
    return;
  }
  stopIntentAuthPoll();

  // Once authenticated, a competitionCode present in the URL but not yet
  // resolved to a real id (e.g. a fresh load, a bookmark, or an
  // invitation opened while signed out and just completed) is resolved
  // exactly once here before rendering the detail view.
  if (currentCompetitionCode && currentCompetitionId === null) {
    const resolved = await resolveCodes(currentCompetitionCode, currentTeamCode);
    if (myGeneration !== renderGeneration) return;
    if (resolved) {
      currentCompetitionId = resolved.competitionId;
      currentTeamId = resolved.teamId;
    } else {
      currentCompetitionCode = null; currentTeamCode = null;
      clearIntentFromUrl();
    }
  }

  const rendered = currentCompetitionId
    ? await renderCompetitionDetail(currentCompetitionId, currentCompetitionCode, currentTeamId)
    : await renderCompetitionList();
  if (myGeneration !== renderGeneration) return;
  content.innerHTML = "";
  content.appendChild(rendered);
}

UrbanoAuth.onAuthStateChange(renderApp);
renderApp();
</script>

</body>
</html>
